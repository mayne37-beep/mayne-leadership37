<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <title>Event sign-up | Sign-Up Studio</title>
  <link rel="stylesheet" href="/assets/signup-studio/studio.css">
  <script type="module" src="/assets/signup-studio/participant.js"></script>
</head>
<body>
  <a class="skip" href="#sign-up">Skip to sign-up</a>
  <header class="topbar">
    <div class="topbar-inner guest-topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Sign-Up Studio</span>
    </div>
  </header>
  <main class="guest-wrap" id="sign-up">
    <div id="event"></div>
    <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true">Loading sign-up…</div>
    <div id="booking"></div>
    <noscript><p class="panel">Turn on JavaScript to view the event and choose your slots.</p></noscript>
  </main>
</body>
</html>
