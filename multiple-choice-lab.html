<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiple Choice Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:34px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 28px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.bars,.wall,.rank{width:min(900px,94%);display:grid;gap:12px}.barrow{background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:13px}.barhead{display:flex;justify-content:space-between;font-weight:800}.track{height:16px;background:#ffffff18;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e1af4f,#f3d18a);border-radius:20px;transition:width .45s}.cloud{width:min(950px,94%);min-height:430px;background:#fff;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:12px 20px;color:var(--n)}.word{font-weight:900}.rating{display:flex;gap:12px;align-items:flex-end;height:390px;width:min(850px,94%);border-bottom:2px solid #fff8}.col{flex:1;text-align:center}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:4px;transition:height .45s}.num{font-size:20px;font-weight:900;margin-top:8px}.cards{width:min(1000px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;color:var(--n);padding:18px;border-radius:14px;min-height:110px;box-shadow:0 8px 20px #0003}.agree{width:min(900px,94%)}.agreebar{height:34px;border-radius:20px;background:linear-gradient(90deg,#c35a54,#e1af4f,#4a9b73);position:relative}.marker{position:absolute;top:-8px;width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid var(--g);transform:translateX(-50%)}.ends{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}.rankitem{display:flex;gap:14px;align-items:center;background:#fff;color:var(--n);padding:16px;border-radius:13px}.ranknum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-weight:900}.score{margin-left:auto;font-weight:900;color:var(--b)}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
.setupgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choiceRow{display:flex;gap:6px;margin-top:6px}.choiceRow input{margin:0}.mini{width:auto;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.livejoin{display:none;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:7px 11px}.livejoin img{width:60px;height:60px;background:#fff;padding:3px;border-radius:6px}.livejoin b{font-size:22px;letter-spacing:.08em}.barrow{transition:transform .3s,background .3s}.barrow.winner{background:#e1af4f24;border-color:#e1af4f}.barrow.correct{outline:3px solid #61c58a;outline-offset:2px}.barvalue{font-size:20px;font-weight:900}.resultmask{padding:70px 20px;text-align:center;font-size:24px;font-weight:900;color:#dceafa}.tiles{width:min(900px,94%);display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{background:#ffffff12;border:1px solid #ffffff28;border-radius:15px;padding:25px;text-align:center}.tile strong{display:block;font-size:42px;color:#f2cb78}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 40px}.projecting .question{font-size:clamp(34px,4vw,64px);margin:4px 0 25px}.projecting .bars,.projecting .tiles{width:min(1300px,95%)}.projecting .livejoin{display:flex}.exitproj{display:none}.projecting .exitproj{display:block;position:fixed;right:15px;bottom:15px;z-index:10;width:auto;opacity:.18}.projecting .exitproj:hover{opacity:1}@media(max-width:850px){.setupgrid{grid-template-columns:1fr}}

header{box-shadow:0 6px 24px #102b4b24}.panel{transition:box-shadow .25s,transform .25s}.btn{transition:transform .15s,box-shadow .2s,opacity .2s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 15px #17395a20}.btn:disabled{opacity:.48;cursor:not-allowed}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1af4f88;outline-offset:2px}.stage{overflow:hidden}.question{line-height:1.12}.suitebadge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff25;color:#f2cb78;font-size:11px;font-weight:900;letter-spacing:.08em}.suitebadge:before{content:'●';font-size:8px}.join{box-shadow:inset 0 0 0 1px #fff}.code{font-variant-numeric:tabular-nums}.count{letter-spacing:.02em}.projecting .count{font-size:17px}.projecting .suitebadge{display:none}@media(max-width:600px){header{padding:18px}h1{font-size:27px}.layout{padding:0 10px}.panel{padding:12px}.stage{min-height:560px;padding:20px 12px}.question{font-size:26px}}
</style></head><body><header><div class="suitebadge">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>▥ Multiple Choice</h1><div class="sub">Independent activity lab · live student responses</div></header><div class="layout"><aside class="panel">
<label>Question / Prompt</label><textarea id="q">Which option best represents your view?</textarea><label>Choices</label><div id="choiceEditor"></div><button class="btn alt" id="addChoice">+ Add choice</button>
<div class="setupgrid"><div><label>Mode</label><select id="mode"><option value="opinion">Opinion poll</option><option value="quiz">Knowledge check</option></select></div><div><label>Visualization</label><select id="display"><option value="bars">Animated bars</option><option value="tiles">Percentage tiles</option></select></div></div>
<div id="quizSettings" style="display:none"><label>Correct answer</label><select id="correct"></select></div>
<label><input id="shuffle" type="checkbox" style="width:auto"> Shuffle choices for students</label>
<button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button>
<div class="livecontrols" id="livecontrols"><div class="statuspill" id="status">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reveal">Reveal results</button><button class="btn alt" id="answer" style="display:none">Reveal answer</button><button class="btn alt" id="reset">Reset poll</button><button class="btn alt" id="copy">Copy join link</button></div>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div>
</aside><main class="panel"><div class="stage"><div class="projectbar"><div class="suitebadge">MAYNE LEADERSHIP · LIVE</div><div class="livejoin" id="livejoin"><img id="qr"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"><div class="bars" id="bars"></div></div><div class="count" id="count">0 responses</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],choices=['Option A','Option B','Option C','Option D'],paused=false,revealed=false,answerShown=false,resetAt=null,projecting=false;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}function renderEditor(){var box=$('choiceEditor');box.innerHTML=choices.map((x,i)=>'<div class="choiceRow"><input data-i="'+i+'" value="'+esc(x)+'"><button class="mini" data-del="'+i+'" '+(choices.length<=2?'disabled':'')+'>×</button></div>').join('');box.querySelectorAll('input').forEach(el=>el.oninput=function(){choices[+this.dataset.i]=this.value;syncCorrect();draw()});box.querySelectorAll('[data-del]').forEach(b=>b.onclick=function(){choices.splice(+this.dataset.del,1);renderEditor();draw()});syncCorrect()}
function syncCorrect(){var s=$('correct'),old=Number(s.value)||0;s.innerHTML=choices.map((x,i)=>'<option value="'+i+'">'+esc(x||('Choice '+(i+1)))+'</option>').join('');s.value=Math.min(old,choices.length-1)}
$('addChoice').onclick=function(){if(choices.length<8){choices.push('Option '+String.fromCharCode(65+choices.length));renderEditor();draw()}};$('mode').onchange=function(){$('quizSettings').style.display=this.value==='quiz'?'block':'none';draw()};$('display').onchange=draw;$('correct').onchange=draw;
function cfg(){return {responseLimit:1,options:choices.slice(),mode:$('mode').value,correct:Number($('correct').value||0),shuffle:$('shuffle').checked}}
function activeRows(){return resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows}
function draw(){$('showQ').textContent=$('q').value;var o=choices,v=o.map(()=>0),ar=activeRows();ar.forEach(r=>{var i=Number(r.response.value);if(i>=0&&i<v.length)v[i]++});var total=v.reduce((a,b)=>a+b,0),max=Math.max(1,...v),correct=Number($('correct').value||0),bars=$('bars');if(!revealed){bars.className='bars';bars.innerHTML='<div class="resultmask">'+(total?total+' response'+(total===1?'':'s')+' received':'Waiting for responses…')+'<br><small>Results hidden until instructor reveal.</small></div>'}else if($('display').value==='tiles'){bars.className='tiles';bars.innerHTML=o.map((x,i)=>{var p=total?Math.round(v[i]/total*100):0;return '<div class="tile '+(answerShown&&$('mode').value==='quiz'&&i===correct?'correct':'')+'"><div>'+esc(x)+'</div><strong>'+p+'%</strong><span>'+v[i]+' response'+(v[i]===1?'':'s')+'</span></div>'}).join('')}else{bars.className='bars';bars.innerHTML=o.map((x,i)=>{var p=total?Math.round(v[i]/total*100):0,win=v[i]===max&&total>0;return '<div class="barrow '+(win?'winner ':'')+(answerShown&&$('mode').value==='quiz'&&i===correct?'correct':'')+'"><div class="barhead"><span>'+esc(x)+'</span><span class="barvalue">'+p+'% · '+v[i]+'</span></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join('')}$('count').textContent=total+' response'+(total===1?'':'s')+(answerShown&&$('mode').value==='quiz'&&total?' · '+Math.round(v[correct]/total*100)+'% correct':'')}
document.querySelectorAll('#q,#shuffle').forEach(e=>e.oninput=draw);
function setProject(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=()=>setProject(!projecting);$('exitproj').onclick=()=>setProject(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),conf=cfg(),r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'poll',question:$('q').value,config:conf})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('join').style.display='block';$('livejoin').style.display='flex';$('livecontrols').style.display='grid';$('answer').style.display=conf.mode==='quiz'?'block':'none';revealed=false;answerShown=false;paused=false;resetAt=null;$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500);draw()}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response,created_at');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('status').textContent=paused?'● Responses paused':'● Accepting responses';this.textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused}};
$('reveal').onclick=function(){revealed=!revealed;this.textContent=revealed?'Hide results':'Reveal results';draw()};$('answer').onclick=function(){answerShown=!answerShown;revealed=true;$('reveal').textContent='Hide results';this.textContent=answerShown?'Hide answer':'Reveal answer';draw()};$('reset').onclick=function(){if(session&&confirm('Reset the visible poll and count only new responses from this point?')){resetAt=new Date();rows=[];revealed=false;answerShown=false;$('reveal').textContent='Reveal results';draw()}};$('copy').onclick=function(){if($('link').href)navigator.clipboard.writeText($('link').href).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy join link',1200)})};
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('livecontrols').style.display='none'};renderEditor();draw()})();</script></body></html>
