<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agreement Continuum | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:310px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:80px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:30px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 25px;max-width:1000px}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center}.livejoin{display:none;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:7px 11px}.livejoin img{width:60px;height:60px;background:#fff;padding:3px;border-radius:6px}.livejoin b{font-size:22px;letter-spacing:.08em}.continuum{width:min(1000px,94%);height:390px;position:relative;margin-top:15px}.line{position:absolute;left:4%;right:4%;top:52%;height:24px;border-radius:30px;background:linear-gradient(90deg,#c85f58,#d98a54,#e1af4f,#80a879,#45a47a);box-shadow:0 0 0 1px #ffffff40}.midline{position:absolute;left:50%;top:44%;height:40%;border-left:2px dashed #ffffff55}.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--g);transform:translate(-50%,-50%);box-shadow:0 3px 10px #0005;transition:left .5s,top .5s,transform .3s;animation:pop .35s ease}.dot:hover{transform:translate(-50%,-50%) scale(1.35);z-index:5}.mean{position:absolute;top:38%;width:54px;height:54px;border-radius:50%;background:var(--n);border:6px solid var(--g);transform:translateX(-50%);box-shadow:0 5px 18px #0006;transition:left .6s}.mean:after{content:'AVG';position:absolute;top:-27px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#f2cb78}.labels{position:absolute;left:1%;right:1%;top:64%;display:grid;grid-template-columns:1fr 1fr 1fr;font-weight:900;color:#dceafa}.labels span:nth-child(2){text-align:center}.labels span:last-child{text-align:right}.summary{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:27px;font-weight:900}.mask{padding:100px 20px;text-align:center;font-size:25px;font-weight:900;color:#dceafa}.count{margin-top:auto;padding-top:15px;font-weight:800;color:#dceafa}.join{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd}.code{text-align:center;font-size:30px;font-weight:900;letter-spacing:.08em}.small{font-size:12px;color:var(--muted)}.join a{color:var(--b);font-weight:800;word-break:break-all}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 40px}.projecting .question{font-size:clamp(34px,4vw,64px)}.projecting .continuum{width:min(1400px,96%);height:58vh}.projecting .livejoin{display:flex}.exitproj{display:none}.projecting .exitproj{display:block;position:fixed;right:15px;bottom:15px;width:auto;z-index:20;opacity:.18}@media(max-width:850px){.layout{grid-template-columns:1fr}}
/* Mayne Live suite refinement */
header{box-shadow:0 6px 24px #102b4b24}.panel{transition:box-shadow .25s,transform .25s}.btn{transition:transform .15s,box-shadow .2s,opacity .2s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 15px #17395a20}.btn:disabled{opacity:.48;cursor:not-allowed}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1af4f88;outline-offset:2px}.stage{overflow:hidden}.question{line-height:1.12}.suitebadge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff25;color:#f2cb78;font-size:11px;font-weight:900;letter-spacing:.08em}.suitebadge:before{content:'●';font-size:8px}.join{box-shadow:inset 0 0 0 1px #fff}.code{font-variant-numeric:tabular-nums}.count{letter-spacing:.02em}.projecting .count{font-size:17px}.projecting .suitebadge{display:none}@media(max-width:600px){header{padding:18px}h1{font-size:27px}.layout{padding:0 10px}.panel{padding:12px}.stage{min-height:560px;padding:20px 12px}.question{font-size:26px}}
</style></head><body>
<header><div class="suitebadge">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>↔ Agreement Continuum</h1><div class="sub">See where the room stands — and how widely perspectives differ</div></header>
<div class="layout"><aside class="panel"><label>Statement / Prompt</label><textarea id="q">Where do you stand on this statement?</textarea><label>Left endpoint</label><input id="left" value="Strongly Disagree"><label>Center</label><input id="mid" value="Unsure"><label>Right endpoint</label><input id="right" value="Strongly Agree"><label>Display</label><select id="display"><option value="dots">Individual response dots + average</option><option value="average">Average only</option></select>
<button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button>
<div class="livecontrols" id="controls"><div class="statuspill" id="status">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reveal">Reveal results</button><button class="btn alt" id="reset">Reset continuum</button><button class="btn alt" id="copy">Copy join link</button></div>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div></aside>
<main class="panel"><div class="stage"><div class="projectbar"><div class="suitebadge">MAYNE LEADERSHIP · LIVE</div><div class="livejoin" id="livejoin"><img id="qr"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"></div><div class="count" id="count">0 responses</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],paused=false,revealed=false,resetAt=null,projecting=false;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function cfg(){return {responseLimit:1,labels:[$('left').value,$('mid').value,$('right').value]}}function active(){return resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows}
function draw(){$('showQ').textContent=$('q').value;var vals=active().map(r=>Number(r.response.value)).filter(x=>x>=1&&x<=5),total=vals.length,avg=total?vals.reduce((a,b)=>a+b,0)/total:0;if(!revealed){$('viz').innerHTML='<div class="mask">'+(total?total+' response'+(total===1?'':'s')+' received':'Waiting for responses…')+'<br><small>Results hidden until instructor reveal.</small></div>'}else{var dots='';if($('display').value==='dots')vals.forEach((x,i)=>{var left=4+(x-1)/4*92,j=((i*37)%9)-4,top=52+j*2.2;dots+='<div class="dot" title="Response: '+x+'" style="left:'+left+'%;top:'+top+'%"></div>'});var pos=4+(avg-1)/4*92;$('viz').innerHTML='<div class="continuum"><div class="line"></div><div class="midline"></div>'+dots+(total?'<div class="mean" style="left:'+pos+'%"></div>':'')+'<div class="labels"><span>'+$('left').value+'</span><span>'+$('mid').value+'</span><span>'+$('right').value+'</span></div><div class="summary">'+(total?'Class average: '+avg.toFixed(1)+' / 5':'Waiting for responses…')+'</div></div>'}$('count').textContent=total+' response'+(total===1?'':'s')}
document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);
function project(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=()=>project(!projecting);$('exitproj').onclick=()=>project(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'agreement',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('join').style.display='block';$('livejoin').style.display='flex';$('controls').style.display='grid';revealed=false;paused=false;resetAt=null;$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500);draw()}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response,created_at');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('status').textContent=paused?'● Responses paused':'● Accepting responses';this.textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused}};
$('reveal').onclick=function(){revealed=!revealed;this.textContent=revealed?'Hide results':'Reveal results';draw()};$('reset').onclick=function(){if(session&&confirm('Reset the visible continuum and count only new responses from this point?')){resetAt=new Date();rows=[];revealed=false;$('reveal').textContent='Reveal results';draw()}};$('copy').onclick=function(){if($('link').href)navigator.clipboard.writeText($('link').href).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy join link',1200)})};
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('controls').style.display='none'};draw()})();</script></body></html>
