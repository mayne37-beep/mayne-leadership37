<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agreement Continuum Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:34px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 28px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.bars,.wall,.rank{width:min(900px,94%);display:grid;gap:12px}.barrow{background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:13px}.barhead{display:flex;justify-content:space-between;font-weight:800}.track{height:16px;background:#ffffff18;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e1af4f,#f3d18a);border-radius:20px;transition:width .45s}.cloud{width:min(950px,94%);min-height:430px;background:#fff;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:12px 20px;color:var(--n)}.word{font-weight:900}.rating{display:flex;gap:12px;align-items:flex-end;height:390px;width:min(850px,94%);border-bottom:2px solid #fff8}.col{flex:1;text-align:center}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:4px;transition:height .45s}.num{font-size:20px;font-weight:900;margin-top:8px}.cards{width:min(1000px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;color:var(--n);padding:18px;border-radius:14px;min-height:110px;box-shadow:0 8px 20px #0003}.agree{width:min(900px,94%)}.agreebar{height:34px;border-radius:20px;background:linear-gradient(90deg,#c35a54,#e1af4f,#4a9b73);position:relative}.marker{position:absolute;top:-8px;width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid var(--g);transform:translateX(-50%)}.ends{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}.rankitem{display:flex;gap:14px;align-items:center;background:#fff;color:var(--n);padding:16px;border-radius:13px}.ranknum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-weight:900}.score{margin-left:auto;font-weight:900;color:var(--b)}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><header><div style="color:#f2cb78;font-size:12px;font-weight:900">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>↔ Agreement Continuum</h1><div class="sub">Independent activity lab · live student responses</div></header><div class="layout"><aside class="panel">
<label>Question / Prompt</label><textarea id="q">Where do you stand on this statement?</textarea><label>Left label</label><input id="left" value="Strongly Disagree"><label>Center label</label><input id="mid" value="Unsure"><label>Right label</label><input id="right" value="Strongly Agree">
<button class="btn" id="start">Start live session</button><button class="btn alt" id="stop" disabled>Stop session</button>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div>
</aside><main class="panel"><div class="stage"><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"><div class="agree"><div class="agreebar"><div class="marker" id="marker" style="left:50%"></div></div><div class="ends"><span id="l"></span><span id="m"></span><span id="r"></span></div><div style="text-align:center;margin-top:35px;font-size:30px;font-weight:900" id="avg">—</div></div></div><div class="count" id="count">0 responses</div></div></main></div>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[];
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function cfg(){return {responseLimit:1,labels:[$('left').value,$('mid').value,$('right').value]}}function draw(){ $('showQ').textContent=$('q').value;$('l').textContent=$('left').value;$('m').textContent=$('mid').value;$('r').textContent=$('right').value;var a=rows.map(r=>Number(r.response.value)).filter(Number.isFinite);var avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:null;$('marker').style.left=(avg==null?50:Math.max(0,Math.min(100,(avg-1)/4*100)))+'%';$('avg').textContent=avg==null?'Waiting for responses':'Average '+avg.toFixed(1);$('count').textContent=rows.length+' response'+(rows.length===1?'':'s')}
document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000));var r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'agreement',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('join').style.display='block';$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500)}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response');draw()}catch(e){}}
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true};draw()})();</script></body></html>
