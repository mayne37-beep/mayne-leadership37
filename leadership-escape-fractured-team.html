function progress(id){return ({office:completeOffice(),evidence:evidenceDone(),team:stagesDone(),coaching:needsDone()&&coachesDone(),vault:state.unlocked})[id]}
function accessibleRooms(){return ['office',...(completeOffice()?['evidence']:[]),...(evidenceDone()?['team']:[]),...(stagesDone()?['coaching']:[]),...(needsDone()&&coachesDone()?['vault']:[])];}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stat(delta={}){for(const k of Object.keys(delta)){state.stats[k]=Math.max(5,Math.min(100,state.stats[k]+delta[k]));}save();}
function award(label,points=20,delta={}){if(state.log.some(x=>x.key===label))return;state.score+=points;stat(delta);state.log.push({key:label,time:Math.round(state.time/60),points});save();cue(800);notify('✓ '+label+' · +'+points+' points');}
function notify(s){const t=$('toast');if(!t)return;t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3100)}
function awardDigit(n,label){if(!state.digits.includes(n)){state.digits.push(n);save();notify('Security clue '+n+' recovered: '+label)}}
function nav(room){if(!accessibleRooms().includes(room)){notify('Finish the previous station before entering this area.');return;}state.room=room;save();selected=null;render()}
function start(){let n=$('teamName')?.value?.trim()||'Team Falcon';state=fresh();state.name=n.slice(0,50);save();render();showBriefing()}
function resume(){load();if(!state.started)state.started=Date.now();render()}
function reset(){if(!confirm('Start over? All mission progress on this device will be cleared.'))return;storage.removeItem(SAVEKEY);state=fresh();render()}
function showLanding(){const exists=!!storage.getItem(SAVEKEY);$('app').innerHTML=`<section id="landing" style="--hero:url('${IMG.ops}')"><div class="landing-shell"><div class="landing-copy"><div class="brandmark"><span class="mark"></span> LEADERSHIP 101 <span class="goldtext">ESCAPE LAB</span></div><div class="eyebrow goldtext" style="margin-top:24px">MISSION 01 · PROJECT FALCON</div><h1>The <em>Fractured</em> Team.</h1><p class="sub">The deadline is closing in. Trust has collapsed. Five leadership challenges stand between your team and recovery. Investigate the evidence. Repair the team. Unlock the final briefing.</p><div class="landing-facts"><span>◉ 5 connected environments</span><span>◉ 7 interactive mechanics</span><span>◉ ~35–50 minutes</span><span>◉ Team or individual play</span></div><p style="font-size:12px;color:#aac6d6">Leadership lessons: foundations, traits, team development, task and relationship, personal strengths, ethical judgment.</p></div><div class="launchbox"><div class="eyebrow goldtext">PRIVATE TRAINING SIMULATION</div><h2>Accept your mission</h2><p>Your group has been called in to rescue Project Falcon, a newly merged public-service team. Director Chen is out of the building. You have one session to identify what is happening and provide a defensible recovery plan.</p><label for="teamName">Team / player name</label><input id="teamName" maxlength="50" placeholder="e.g., Blue Team" value="${esc(state.name==='Team Falcon'?'':state.name)}"><button class="button gold launch" onclick="start()">▶ Enter the Operations Office</button><div class="launchrow"><span>Progress saves on this device · No sign-in required</span>${exists?'<button onclick="resume()">Resume saved mission →</button>':''}</div><div class="divider" style="background:#5a7a8e70"></div><div class="small" style="color:#dce8ed">♫ Optional chimes · 🎮 Click, drag, or tap to place · 🧠 Hints available · 🧾 Export mission report</div></div></div></section>`}
function appHeader(){return `<header><div class="top"><div class="topbrand"><span class="mark"></span><div><strong>LEADERSHIP 101</strong><small>ESCAPE LAB · MISSION 01</small></div></div><div class="top-progress">${ROOMS.map((r,i)=>`<button class="step ${r.id===state.room?'active':progress(r.id)?'complete':''}" onclick="nav('${r.id}')" ${accessibleRooms().includes(r.id)?'':'disabled'} title="${esc(r.full)}">${progress(r.id)?'✓ ':''}${i+1}. ${esc(r.name)}</button>`).join('')}</div><div class="top-actions"><span class="timer mono" id="clock">⏱ 00:00</span><button class="topicon" title="Toggle sound effects" onclick="toggleSound()">${state.audio?'♫ On':'♫ Off'}</button><button class="topicon" title="Mission journal" onclick="showJournal()">▤ Notes</button><button class="topicon" title="Game settings" onclick="showHelp()">⚙</button></div></div></header>`}
function side(){const items=[['Gather four verified sources',completeOffice()],['Separate evidence from assumptions',evidenceDone()],['Restore team development map',stagesDone()],['Coach for tasks and relationships',coachesDone()],['Address individual motivations',needsDone()],['Protect integrity and set the vision',ethicsDone()&&visionDone()],['Unlock the final executive briefing',state.unlocked]];
return `<aside class="sidebar"><div class="side-card"><h4>Active objectives</h4>${items.map(([label,ok])=>`<div class="objective ${ok?'done':''}"><span class="tick">${ok?'✓':'○'}</span><span>${label}</span></div>`).join('')}</div><div class="side-card"><h4>Evidence & access</h4><div class="inventory">${state.seen.length?state.seen.map(id=>`<span class="invtag">${DOCUMENTS[id].icon} ${esc(DOCUMENTS[id].short)}</span>`).join(''):'<span class="note">Click objects in the Operations Office to collect evidence.</span>'}</div><div class="divider"></div><div class="small"><b>Security clues:</b> <span class="mono" style="letter-spacing:.17em;color:#a57935">${['3','1','4'].map(d=>state.digits.includes(d)?'['+d+']':'[?]').join(' ')}</span></div></div><div class="side-card"><h4>Simulated team climate</h4>${[['trust','Trust'],['clarity','Role clarity'],['momentum','Momentum']].map(([k,label])=>`<div class="stat-row"><span>${label}</span><div class="bar"><div class="barfill ${state.stats[k]<40?'low':''}" style="width:${state.stats[k]}%"></div></div><b class="mono">${state.stats[k]}</b></div>`).join('')}<div class="divider"></div><div class="row between"><span class="small">Mission points</span><b>${state.score}</b></div><div class="row between" style="margin-top:8px"><span class="small">Hints used</span><b>${state.hints}</b></div><div style="margin-top:14px;display:flex;gap:7px;flex-wrap:wrap"><button class="button ghost mini" onclick="getHint()">💡 Hint</button><button class="button line mini" onclick="exportReport()">⇩ Report</button></div><p class="time-note">These indicators are illustrative feedback, not a validated measure of real-world leadership ability.</p></div></aside>`}
function hotspot(id,x,y,label,icon,act,has=false){return `<button class="hotspot ${has?'done':''}" style="left:${x}%;top:${y}%" onclick="${act}" aria-label="${esc(label)}"><span class="orb">${has?'✓':icon}</span><span>${esc(label)}</span></button>`}
function scene(){let r=state.room;
if(r==='vault')return `<div class="room"><div class="vaultview"><div class="vaultdoor ${state.unlocked?'unlocked':''}"><div class="vaultwheel">${state.unlocked?'✓':'✧'}</div><div class="vaultstripe">${state.unlocked?'ACCESS GRANTED':'ACCESS LOCKED'}</div></div></div><div class="scene-title">EXECUTIVE SECURITY VAULT<small>Protect integrity · Final exit protocol</small></div>${hotspot('ethics',22,48,'Integrity review','⚖',"openEthics()",ethicsDone())}${hotspot('sequence',77,47,'30-day plan','🗂',"openSequence()",sequenceDone())}${hotspot('vision',50,32,'Shared vision','🧭',"openVision()",visionDone())}${hotspot('lock',50,80,state.unlocked?'Exit unlocked':'Security lock','🔐',"openKeypad()",state.unlocked)}<div class="room-bottom"><span class="scenehelp">The vault will only release a defensible leadership plan.</span></div></div>`;
let image=IMG[r==='office'?'ops':r==='evidence'?'collab':r==='team'?'executive':'ops'];
let title=ROOMS.find(a=>a.id===r),hot='';
if(r==='office')hot=hotspot('roster',10,66,'Personnel', '👥',"openDocument('roster')",seen('roster'))+hotspot('pulse',71,19,'Team climate','📊',"openDocument('pulse')",seen('pulse'))+hotspot('handoff',74,72,'Performance','📈',"openDocument('handoff')",seen('handoff'))+hotspot('memo',55,56,'Staff email','✉',"openDocument('memo')",seen('memo'))+hotspot('charter',28,81,'Team charter','🧭',"openDocument('charter')",seen('charter'))+hotspot('timeline',90,69,'Timeline','🗓',"openDocument('timeline')",seen('timeline'));
if(r==='evidence')hot=hotspot('board',18,38,'Evidence wall','📌',"document.getElementById('mainTask').scrollIntoView({behavior:'smooth'})",evidenceDone())+hotspot('report',72,44,'Data screen','🔍',"showEvidenceInsight()",false);
if(r==='team')hot=hotspot('stages',75,30,'Magnetic board','🧩',"document.getElementById('mainTask').scrollIntoView({behavior:'smooth'})",stagesDone())+hotspot('jordan',20,45,'Speak with lead','💬',"openPerson('jordan')",false)+hotspot('maya',42,73,'Speak with Maya','💬',"openPerson('maya')",false);
if(r==='coaching')hot=hotspot('chris',64,69,'Speak with Chris','💬',"openPerson('chris')",false)+hotspot('dana',86,33,'Speak with Dana','💬',"openPerson('dana')",false)+hotspot('console',42,44,'Leadership console','🎛',"document.getElementById('mainTask').scrollIntoView({behavior:'smooth'})",coachesDone());
return `<div class="room photo-room"><img class="scene-image" src="${image}" alt="Cinematic illustration of an operational team workspace with staff, documents, and display screens"><div class="scene-scrim"></div><div class="scene-title">${esc(title.full.toUpperCase())}<small>${esc(title.small)}</small></div>${hot}<div class="room-bottom"><span class="scenehelp">✦ Explore the glowing targets · Solve the hands-on station below</span></div></div>`}
function task(){if(state.room==='office')return officeTask();if(state.room==='evidence')return evidenceTask();if(state.room==='team')return teamTask();if(state.room==='coaching')return coachingTask();return vaultTask()}
function officeTask(){return `<div class="subheading">Station 01 · Foundations of Leadership</div><h3>Do not diagnose before you investigate.</h3><p>Project Falcon has missed milestones and staff trust is dropping. A strong leader distinguishes observation from interpretation before assigning responsibility. Explore the office above and gather at least four information sources.</p><div class="promptcallout">Your first leadership act is <b>curiosity and evidence gathering</b>—not deciding who to blame.</div><div class="intel-grid">${Object.entries(DOCUMENTS).map(([k,v])=>`<button class="intel ${seen(k)?'got':''}" onclick="openDocument('${k}')"><span class="ico">${v.icon}</span><strong>${esc(v.title)} ${seen(k)?'✓':''}</strong><small>${esc(v.subtitle)}</small></button>`).join('')}</div><div class="row between wrap"><span class="collectcount">${state.seen.length}/6 documents reviewed · 4 required</span>${completeOffice()?'<button class="button gold" onclick="nav(\'evidence\')">Go to evidence wall →</button>':'<span class="muted small">Explore the scene or document cards</span>'}</div>`}
function evidenceTask(){return `<div class="subheading">Station 02 · Leadership Traits / Critical Judgment</div><h3>The evidence wall</h3><p>An anonymous accusation is spreading. Sort each pinned statement into <b>verified signal</b> or <b>assumption requiring investigation</b>. Drag a note onto the correct board, or tap a note and then a target.</p><div class="board"><div class="boardtop">RIVERTON / PROJECT FALCON · Evidence review</div><div class="evidence-deck">${EVIDENCE.map(e=>`<button draggable="${!state.evidence[e.id]}" class="evidence-piece ${state.evidence[e.id]?'solved':selected===e.id?'selected':''}" data-dragkind="evidence" data-id="${e.id}" onclick="pick('evidence','${e.id}')"><span>📌 ${esc(e.text)}</span><small>${esc(e.source)}</small></button>`).join('')}</div></div><div class="class-grid"><button class="dropbin" data-dropkind="evidence" data-value="fact" onclick="place('evidence','fact')">✓ Verified signals <span class="tagcount">${Object.values(state.evidence).filter(x=>x==='fact').length}</span><small>Supported by records or the observed data</small></button><button class="dropbin" data-dropkind="evidence" data-value="assumption" onclick="place('evidence','assumption')">? Needs investigation <span class="tagcount">${Object.values(state.evidence).filter(x=>x==='assumption').length}</span><small>An interpretation or accusation, not yet verified</small></button></div>${evidenceDone()?`<div class="donebar" style="margin-top:12px">✓ The board is reconstructed. SECURITY CLUE: <strong>3</strong> verified signals.</div><div style="margin-top:12px"><button class="button gold" onclick="nav('team')">Enter Team Development Room →</button></div>`:`<div class="muted small" style="margin-top:12px">${Object.keys(state.evidence).length}/6 statements analyzed · Feedback will explain every placement.</div>`}`}
function teamTask(){return `<div class="subheading">Station 03 · Building Teams</div><h3>Repair the magnetic development board</h3><p>The team has gone through a difficult merger. Drag each Tuckman stage to the situation it best describes, or tap a stage and then the matching slot. The current team appears to be experiencing <b>storming</b>: role conflict, contested decisions, and unclear expectations.</p><div class="stage-pads">${STAGES.map((s,i)=>`<button class="stage-pad" data-dropkind="stage" data-value="${s.id}" onclick="place('stage','${s.id}')"><span class="padnum">${i+1}</span><span class="description">${esc(s.detail)}</span>${state.stageSlots[s.id]?`<span class="placed">✓ ${esc(s.label)}</span>`:'<span class="small">Drop a stage here</span>'}</button>`).join('')}</div><div class="subheading">Rebuild the sequence</div><div class="token-row">${[STAGES[2],STAGES[0],STAGES[3],STAGES[1]].map(s=>`<button class="token ${Object.values(state.stageSlots).includes(s.id)?'used':selected===s.id?'selected':''}" draggable="${!Object.values(state.stageSlots).includes(s.id)}" data-dragkind="stage" data-id="${s.id}" onclick="pick('stage','${s.id}')">♟ ${s.label}</button>`).join('')}</div>${stagesDone()?`<div class="donebar">✓ You restored the development model. SECURITY CLUE: <strong>1</strong> shared mission must connect this team.</div><div style="margin-top:12px"><button class="button gold" onclick="nav('coaching')">Unlock Leadership Coaching Lab →</button></div>`:`<div class="promptcallout">Reminder: Team stages are a model for understanding patterns, not a guaranteed linear path or a diagnosis of individuals.</div>`}`}
function coachingTask(){let s=state.coachingIndex===0?'jordan':'chris';let b=state.coaches[s];let initialTask=b?b.task:55,initialSupport=b?b.support:55;return `<div class="subheading">Station 04 · Task & Relationship / Developing Leadership Skills</div><h3>The leadership calibration console</h3><p>Adjust two leadership behaviors for each real situation. The goal is a <b>defensible fit to the situation</b>, not a single universally correct leadership style. Test your response, then tailor your support to each team member.</p><div class="scenario-tabs"><button class="scenario-tab ${s==='jordan'?'active':''}" onclick="setCase(0)">01 · Jordan: role confusion ${state.coaches.jordan?'✓':''}</button><button class="scenario-tab ${s==='chris'?'active':''}" onclick="setCase(1)">02 · Chris: expert disengagement ${state.coaches.chris?'✓':''}</button></div><div class="promptcallout">${s==='jordan'?'<b>Jordan:</b> Newly appointed team lead, caught between two supervisors. No one knows who owns cross-unit handoffs. He wants both a clear mandate and a chance to speak.':'<b>Chris:</b> Experienced analyst whose quality concerns were dismissed. He knows the work but has withdrawn from team meetings. He needs to be heard without being micromanaged.'}</div><div class="console"><div class="eyebrow">Live leadership balance</div><div style="font-size:13px;color:#dfeff7;margin-top:5px">Move the amber marker to choose your leadership response.</div><div class="gauge-plot"><span class="quadrant tl">Supportive</span><span class="quadrant tr">High task + support</span><span class="quadrant bl">Low intervention</span><span class="quadrant br">Task-focused</span><div class="marker" id="leaderMarker" style="left:${initialTask}%;bottom:${initialSupport}%"></div></div><div class="sliders"><div class="sliderbox"><label for="taskSlider">Task direction <b id="taskVal">${initialTask}</b></label><input id="taskSlider" type="range" min="0" max="100" value="${initialTask}" oninput="updateLeader()" ${b?'disabled':''}></div><div class="sliderbox"><label for="supportSlider">Relationship support <b id="supportVal">${initialSupport}</b></label><input id="supportSlider" type="range" min="0" max="100" value="${initialSupport}" oninput="updateLeader()" ${b?'disabled':''}></div></div><p id="styleHint" class="console-copy">Moderate direction · Moderate support</p><button class="button gold" ${b?'disabled':''} onclick="submitCoach()">${b?'✓ Approach recorded':'Deploy this leadership response'}</button>${b?`<p class="console-copy">Recorded task: <b>${b.task}</b> · support: <b>${b.support}</b> · ${esc(b.feedback)}</p>`:''}</div><div class="divider"></div><div class="subheading">Core Strengths / Motivational Value Systems</div><h3 style="font-size:19px;margin:6px 0">Fit support to what people need</h3><p>People may be motivated by connection, results, analysis, and fairness in different circumstances. These cards describe <em>current expressed needs</em>—they are not personality diagnoses. Drag a support tool onto a person's card, or tap the tool then tap the person.</p><div class="coach-grid">${Object.entries(PEOPLE).map(([id,p])=>`<div class="profile"><div class="profile-head"><span class="avatar" style="background:${p.tone}">${p.avatar}</span><div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div><p>“${esc(p.note)}”</p><button class="assign ${state.needs[id]?'filled':''}" data-dropkind="need" data-value="${id}" onclick="place('need','${id}')">${state.needs[id]?'✓ '+esc(NEEDS.find(n=>n.key===state.needs[id]).response):'Place a tailored support action here'}</button></div>`).join('')}</div><div class="token-row">${[NEEDS[2],NEEDS[0],NEEDS[3],NEEDS[1]].map(n=>`<button class="tooltoken ${Object.values(state.needs).includes(n.key)?'used':selected===n.key?'selected':''}" draggable="${!Object.values(state.needs).includes(n.key)}" data-id="${n.key}" data-dragkind="need" onclick="pick('need','${n.key}')">✦ ${esc(n.response)}</button>`).join('')}</div>${needsDone()&&coachesDone()?`<div class="donebar">✓ Team support calibrated. SECURITY CLUE: <strong>4</strong> complementary contributions help achieve the mission.</div><div style="margin-top:11px"><button class="button gold" onclick="nav('vault')">Enter Executive Security Vault →</button></div>`:`<div class="muted small">Coaching: ${Object.keys(state.coaches).length}/2 · Tailored support: ${Object.keys(state.needs).length}/4</div>`}`}
function vaultTask(){return `<div class="subheading">Station 05 · Ethical Leadership / Creating a Vision / Obstacles</div><h3>Protect trust. Build a defensible recovery plan.</h3><p>The director's office will open only after you document a fair response to the favoritism rumor, assemble a meaningful shared vision, build a 30-day leadership plan, and apply the three security clues earned in previous rooms.</p><div class="intel-grid">${[['⚖️','Integrity review','Protect fairness and due process','openEthics()',ethicsDone()],['🧭','Shared team vision','Build a purpose people can rally around','openVision()',visionDone()],['📅','30-day recovery','Sequence the leadership work','openSequence()',sequenceDone()],['🔐','Executive security','Enter clues to unlock the briefing','openKeypad()',state.unlocked]].map(a=>`<button class="intel ${a[4]?'got':''}" onclick="${a[3]}"><span class="ico">${a[0]}</span><strong>${a[1]} ${a[4]?'✓':''}</strong><small>${a[2]}</small></button>`).join('')}</div>${state.unlocked?endReport():`<div class="promptcallout">Your three digits were earned by <b>Evidence → Mission → Recovery</b>. Look in your inventory panel if you need to review them. The physical door will not release until the integrity review, team vision, and recovery plan are complete.</div>`}`}
function endReport(){let completed=state.unlocked;let avg=Math.round((state.stats.trust+state.stats.clarity+state.stats.momentum)/3);return `<div class="outcome" style="margin-top:16px"><div class="eyebrow goldtext">MISSION COMPLETE · PROJECT FALCON</div><h2>The executive door is open.</h2><p style="color:#daece7;font-size:13px;line-height:1.65">Your team investigated, separated facts from speculation, diagnosed a team conflict, calibrated leadership behavior, and created a recovery plan. The director receives your leadership briefing.</p><div class="reportgrid"><div class="reporttile"><small>Mission score</small><strong>${state.score} pts</strong></div><div class="reporttile"><small>Team climate index</small><strong>${avg}/100</strong></div><div class="reporttile"><small>Completion time</small><strong>${formatTime(state.time)}</strong></div><div class="reporttile"><small>Hints / attempts</small><strong>${state.hints} / ${state.attempts}</strong></div></div><p style="color:#c0dedb;font-size:12px;margin-top:14px">Your scores reflect game choices and should be paired with a facilitated reflection.</p><div class="flex"><button class="button gold" onclick="exportReport()">⇩ Download team debrief</button><button class="button ghost" onclick="print()">⎙ Print completion</button></div></div>`}
function render(){if(!state.started || !storage.getItem(SAVEKEY)){showLanding();return;}$('app').innerHTML=appHeader()+`<main class="game-shell"><div class="storyline"><div><div class="eyebrow">RIVERTON COUNTY / PROJECT FALCON</div><h2>${esc(ROOMS.find(r=>r.id===state.room).full)}</h2><p>${esc(state.name)} · Mission 01: The Fractured Team · Leadership 101</p></div><div class="row wrap"><span class="pill">🔎 ${state.seen.length}/6 artifacts</span><span class="pill gold">★ ${state.score} points</span></div></div><div class="mission-grid"><div class="content-col">${scene()}<div class="navrooms">${ROOMS.map((r,i)=>`<button class="navroom ${state.room===r.id?'active':''} ${accessibleRooms().includes(r.id)?'':'locked'}" onclick="nav('${r.id}')">${accessibleRooms().includes(r.id)?progress(r.id)?'✓':'◉':'🔒'} ${esc(r.name)}</button>`).join('')}</div><section class="taskpanel" id="mainTask">${task()}</section></div>${side()}</div><div class="footerline">A fictional public-service organization · Illustrative consequences · Offline training experience · No learner data transmitted</div></main>`;refreshClock();wireDrag();if(state.room==='coaching')updateLeader();}
function openDialog(title,body,label='CASE FILE',footer=null){$('modalTitle').textContent=title;$('modalLabel').textContent=label;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=footer||'<button class="button ghost" onclick="closeDialog()">Return to room</button>';$('veil').classList.remove('hide');$('closeModal').focus()}
function closeDialog(){$('veil').classList.add('hide');modalAct=null;if(storage.getItem(SAVEKEY))render();}
function openDocument(id){const d=DOCUMENTS[id];if(!d)return;let first=!seen(id);if(first){state.seen.push(id);award('Evidence acquired: '+d.title,10,{clarity:2});save();}openDialog(d.title,d.body+(first?'<div class="donebar">✓ Added to your mission journal.</div>':'<p class="muted small">Already reviewed — this evidence remains in your inventory.</p>'),'INVESTIGATION RECORD');}
function openPerson(id){const p=PEOPLE[id];openDialog(p.name,`<div class="dossier"><div class="portrait" style="background:${p.tone}">${p.avatar}</div><div><div class="subheading">${esc(p.role)}</div><div class="quote">“${esc(p.note)}”</div><p><b>Leadership observation:</b> ${esc(p.insight)}</p></div></div>`,'PRIVATE CONVERSATION')}
function showBriefing(){openDialog('Director Chen’s emergency briefing',`<div class="doc"><strong>TO: Interim leadership team</strong><p>Two divisions merged four weeks ago. Three project milestones are late. Some staff believe assignment decisions are unfair. Senior leaders want an answer by the end of this session.</p><p><b>Mission:</b> investigate before blaming; rebuild a team; balance task and relationship needs; respond ethically; prepare a 30-day recovery plan.</p></div><div class="alertline">You are not trying to find the “bad employee.” You are trying to lead a system of people through uncertainty.</div>`,'MISSION BRIEFING')}
function showEvidenceInsight(){openDialog('Performance dashboard',`<div class="doc"><strong>Project Falcon operational trends</strong><p>Three overdue milestones · Role clarity 39/100 · Team trust 42/100 · Two ownership reassignment events.</p><p>These signals indicate a problem, but none alone proves an employee acted in bad faith.</p></div><div class="promptcallout">The principle to apply: leadership diagnosis requires verified evidence, multiple perspectives, and a willingness to revise your assumptions.</div>`,'DATA CENTER')}
function showJournal(){const clues=['3','1','4'].map(n=>state.digits.includes(n)?n:'?').join(' · ');openDialog('Mission journal',`<div class="doc"><strong>Artifacts reviewed (${state.seen.length}/6)</strong><p>${state.seen.map(id=>DOCUMENTS[id].short).join(' · ')||'None yet'}</p><strong>Security sequence · Evidence → Mission → Recovery</strong><p style="letter-spacing:.2em;font-size:20px;font-weight:900;color:#996521">${clues}</p><strong>Latest leadership actions</strong><p>${state.log.slice(-6).map(l=>esc(l.key)+' (+'+l.points+')').join('<br>')||'Your decisions will appear here.'}</p></div><div class="promptcallout">Each room offers a new kind of interaction. You can revisit unlocked rooms at any time.</div>`,'LIVE CASEBOOK')}
function showHelp(){openDialog('How to play',`<div class="helpdesk"><p>Explore <b>glowing targets</b> in the scene. Puzzles can be solved with mouse, touch, or keyboard by selecting a tile and then a target. You may also drag tiles onto their targets.</p><details open><summary>How do locked rooms open?</summary><p>Complete the main station in each preceding environment. The next room unlocks automatically, and you can revisit any previous one.</p></details><details><summary>What do the leadership indicators mean?</summary><p>Trust, clarity, and momentum provide fictional immediate feedback on simulated actions. They are not predictive or scientifically validated scores.</p></details><details><summary>Can I turn off the timer?</summary><p>Yes. The clock is for immersion, not a deadline. You can pause or resume it at any time.</p><button class="button ghost mini" onclick="state.clock=!state.clock;save();notify('Clock '+(state.clock?'resumed':'paused'));closeDialog()">${state.clock?'Pause':'Resume'} timer</button></details><details><summary>Can I restart?</summary><p>Use Restart below. This deletes saved progress for this mission on this device.</p></details><div class="row wrap"><button class="button line mini" onclick="toggleSound();closeDialog()">${state.audio?'Mute':'Enable'} sound</button><button class="button line mini" onclick="closeDialog();exportReport()">Download current report</button><button class="button line mini" onclick="closeDialog();reset()">Restart mission</button></div></div>`,'MISSION OPERATIONS')}
function getHint(){state.hints++;state.score=Math.max(0,state.score-5);save();let hints={office:'Find at least four documents—try the charter, pulse report, workflow audit, and staff email. They provide different perspectives.',evidence:'Verification is different from interpretation. A logged number can be a verified signal; a claim about motives still needs investigating.',team:'Match the descriptions to the order: getting acquainted → experiencing conflict → agreeing on norms → delivering steadily.',coaching:!coachesDone()?'Jordan needs both role clarity and a chance to speak. Chris needs relationship repair and room for expertise, not heavy oversight.':'Read each employee’s expressed concern. Match the support to the need, not to a permanent personality label.',vault:!ethicsDone()?'Secure records and use a fair, confidential review instead of rushing to accuse anyone.':!visionDone()?'A vision joins who you serve, what you hope to achieve, and how people will work together.':!sequenceDone()?'A plan should start by listening and verifying, then clarify roles, and then reinforce through coaching.':'The three digits are in the sidebar, ordered Evidence → Mission → Recovery.'};openDialog('A clue from the mission guide',`<div class="doc"><strong>Field guidance</strong><p>${hints[state.room]}</p></div><div class="alertline">Hint used: 5 game points deducted (score does not go below zero). There is no penalty to your course grade.</div>`,'OPTIONAL HINT')}
function pick(kind,id){if(kind==='evidence'&&state.evidence[id])return;if(kind==='stage'&&Object.values(state.stageSlots).includes(id))return;if(kind==='need'&&Object.values(state.needs).includes(id))return;selected=selected===id?null:id;render();if(selected)notify('Selected: '+(kind==='evidence'?'evidence note':kind==='stage'?'stage card':'support tool')+'. Now choose a target.');}
function place(kind,target){if(!selected){notify('First select a tile, or drag one onto this target.');return;}assign(kind,selected,target)}
function assign(kind,id,target){if(kind==='evidence'){const e=EVIDENCE.find(x=>x.id===id);if(!e||state.evidence[id])return;if(e.cat!==target){state.attempts++;stat({trust:-1});selected=null;render();notify('That statement needs a different category. Check the source and the claim.');return;}state.evidence[id]=target;award('Correctly classified: '+id,12,{clarity:2});if(evidenceDone()){award('Evidence wall complete',25,{clarity:7});awardDigit('3','Verified signals');}selected=null;save();render();return;}
if(kind==='stage'){if(!STAGES.some(s=>s.id===id)||Object.values(state.stageSlots).includes(id))return;if(id!==target){state.attempts++;selected=null;render();notify('Not quite. Compare the description with the team development stage.');return;}state.stageSlots[target]=id;award('Team stage restored: '+id,15,{clarity:2,momentum:2});if(stagesDone()){award('Team development restored',30,{trust:4});awardDigit('1','Shared team mission');}selected=null;save();render();return;}
if(kind==='need'){let answer=NEEDS.find(n=>n.id===target);if(!answer||Object.values(state.needs).includes(id))return;if(answer.key!==id){state.attempts++;selected=null;render();notify('Think about what this colleague actually expressed needing.');return;}state.needs[target]=id;award('Tailored support: '+target,15,{trust:3});if(needsDone()){award('Motivational needs aligned',30,{trust:6});if(coachesDone())awardDigit('4','Four complementary strengths');}selected=null;save();render();return;}
if(kind==='vision'){const item=VISION.find(v=>v.id===id);if(!item||Object.values(state.vision).includes(id))return;if(item.slot!==target){state.attempts++;selected=null;openVision();notify('That phrase does not fulfill this part of a community-service vision.');return;}state.vision[target]=id;award('Vision element: '+target,15,{trust:2,momentum:2});if(visionDone())award('Shared team vision established',30,{trust:4,clarity:3});selected=null;save();openVision();return;}
if(kind==='sequence'){if(!ACTIONS.some(a=>a.id===id)||Object.values(state.sequence).includes(id))return;if(id!==target){state.attempts++;selected=null;render();notify('Consider what must happen before the next action can work.');return;}state.sequence[target]=id;award('Recovery plan phase: '+id,15,{momentum:2,clarity:1});if(sequenceDone())award('30-day recovery blueprint',35,{momentum:9});selected=null;save();openSequence();return;}}
function wireDrag(){document.querySelectorAll('[data-dragkind]').forEach(el=>{el.addEventListener('dragstart',e=>{let kind=el.dataset.dragkind,id=el.dataset.id;if(el.classList.contains('used')||el.classList.contains('solved')){e.preventDefault();return;}dragData={kind,id};e.dataTransfer?.setData('text/plain',kind+':'+id);e.dataTransfer.effectAllowed='move'});});document.querySelectorAll('[data-dropkind]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');let kind=el.dataset.dropkind,value=el.dataset.value,raw=e.dataTransfer?.getData('text/plain');let data=dragData;if(!data&&raw){let [k,...parts]=raw.split(':');data={kind:k,id:parts.join(':')}}if(data&&data.kind===kind)assign(kind,data.id,value);dragData=null;});});}
function setCase(idx){state.coachingIndex=idx;save();render()}
function updateLeader(){const task=$('taskSlider'),support=$('supportSlider');if(!task||!support)return;let t=+task.value,r=+support.value;$('taskVal').textContent=t;$('supportVal').textContent=r;const marker=$('leaderMarker');marker.style.left=t+'%';marker.style.bottom=r+'%';$('styleHint').textContent=`${t>=60?(r>=60?'Coaching approach':'Directing approach'):(r>=60?'Supporting approach':'Empowering / light-touch approach')} · Task direction ${t}/100 · Relationship support ${r}/100. Ask whether this fits the current challenge.`}
function submitCoach(){const id=state.coachingIndex===0?'jordan':'chris';if(state.coaches[id])return;const t=+$('taskSlider').value,r=+$('supportSlider').value;let fit=id==='jordan'?t>=65&&r>=60:t<=60&&r>=65;const feedback=fit?(id==='jordan'?'Clear task ownership plus active listening fit an uncertain new lead.':'Autonomy paired with attentive listening supports an experienced contributor.'):id==='jordan'?'This response may underprovide clarity or support. A new lead caught in competing instructions needs both.':'This response may emphasize direction over rebuilding trust and respecting expertise.';
state.coaches[id]={task:t,support:r,fit,feedback};award('Leadership approach: '+id,fit?35:12,fit?{trust:6,clarity:6,momentum:3}:{trust:-4,clarity:-1});if(coachesDone()){award('Situational leadership lab completed',20,{});if(needsDone())awardDigit('4','Four complementary strengths');}save();render();openDialog(fit?'Your response strengthened leadership fit':'Your decision has consequences',`<div class="doc"><strong>${id==='jordan'?'Jordan Reed':'Chris Williams'} · leadership response</strong><p><b>Direction:</b> ${t}/100. <b>Relationship:</b> ${r}/100.</p><p>${esc(feedback)}</p></div><div class="promptcallout">No single task–relationship score is optimal for every real employee. This simplified exercise highlights situational judgment.</div>`,'LIVE SIMULATION FEEDBACK');}
function openEthics(){const choices=[{key:'review',name:'Secure & review',body:'Preserve records, publish selection standards, appoint a fair reviewer, and protect confidentiality.',delta:{trust:9,clarity:8,momentum:2}},{key:'accuse',name:'Name a suspect',body:'Announce a suspected manager’s identity to reassure the team that leadership is taking action.',delta:{trust:-11,clarity:-3,momentum:1}},{key:'silence',name:'Close the complaint',body:'Dismiss the rumor to protect the team from further disruption; investigate only if another complaint appears.',delta:{trust:-8,clarity:-4,momentum:-3}}];openDialog('The confidential integrity alert',`<div class="doc"><strong>Anonymous report · 16:35</strong><p>“Some employees think assignments are going to favorites. We can’t see how people are selected.”</p><p>There is not enough evidence to confirm favoritism or to identify wrongdoing. The director needs you to act now.</p></div><div class="subheading">Choose an action—its consequences persist</div><div class="ethical-grid">${choices.map(c=>`<button class="ethical ${state.ethics===c.key?'selected':''}" ${state.ethics?'disabled':''} onclick="chooseEthics('${c.key}')"><strong>${c.name}</strong>${c.body}</button>`).join('')}</div>${state.ethics?'<div class="donebar" style="margin-top:12px">✓ Integrity decision on record.</div>':''}`,'LEADERSHIP INTEGRITY PROTOCOL')}
function chooseEthics(key){if(state.ethics)return;state.ethics=key;let delta=key==='review'?{trust:9,clarity:8,momentum:2}:key==='accuse'?{trust:-11,clarity:-3,momentum:1}:{trust:-8,clarity:-4,momentum:-3};award('Integrity protocol response',key==='review'?45:12,delta);save();openEthics();const sentence=key==='review'?'You preserved due process while addressing employee concerns. Trust improves because your team sees transparent standards and fair review.':key==='accuse'?'Publicly identifying a suspect before verifying evidence risks unfair reputational harm and weakens team trust.':'Dismissing the concern avoids short-term discomfort but leaves a genuine fairness risk unresolved.';notify(sentence);}
function openVision(){let body=`<p>A compelling vision connects <b>purpose</b>, <b>the desired outcome</b>, and <b>the values guiding the work</b>. Build a statement that Project Falcon can own. Drag a phrase to each illuminated panel, or tap a phrase and then a panel.</p><div class="console" style="padding:18px"><div class="eyebrow">Project Falcon / Purpose wall</div><div class="stage-pads" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[['purpose','WHO WE SERVE'],['outcome','WHAT SUCCESS LOOKS LIKE'],['values','HOW WE WORK']].map(([k,label])=>`<button class="stage-pad" style="min-height:122px" data-dropkind="vision" data-value="${k}" onclick="place('vision','${k}')"><span class="padnum">✦</span><span class="description">${label}</span>${state.vision[k]?`<span class="placed">${esc(VISION.find(v=>v.id===state.vision[k]).text)}</span>`:'<span class="small">Drop phrase here</span>'}</button>`).join('')}</div></div><div class="token-row">${[VISION[3],VISION[1],VISION[0],VISION[4],VISION[2]].map(v=>`<button class="tooltoken ${Object.values(state.vision).includes(v.id)?'used':selected===v.id?'selected':''}" draggable="${!Object.values(state.vision).includes(v.id)}" data-id="${v.id}" data-dragkind="vision" onclick="pickVision('${v.id}')">${esc(v.text)}</button>`).join('')}</div>${visionDone()?'<div class="donebar">✓ The vision is coherent: purpose, service outcomes, and fair teamwork reinforce one another.</div>':'<div class="promptcallout">A shared vision should be larger than protecting management or achieving speed at any cost.</div>'}`;openDialog('Assemble the shared vision wall',body,'CREATING A VISION');wireDrag();}
function pickVision(id){if(Object.values(state.vision).includes(id))return;selected=selected===id?null:id;openVision();}
function openSequence(){const body=`<p>Put the three 30-day actions on a logical timeline. Drag an action onto its numbered period, or tap an action and then its matching period.</p><div class="timeline">${ACTIONS.map((a,i)=>`<button class="timebox" data-dropkind="sequence" data-value="${a.id}" onclick="place('sequence','${a.id}')"><strong>${['DAYS 1–5','DAYS 6–15','DAYS 16–30'][i]}</strong>${state.sequence[a.id]?`<span class="placed">✓ ${esc(a.label)}</span>`:`<small>${esc(a.desc)}</small>`}</button>`).join('')}</div><div class="token-row">${[ACTIONS[2],ACTIONS[0],ACTIONS[1]].map(a=>`<button class="tooltoken ${Object.values(state.sequence).includes(a.id)?'used':selected===a.id?'selected':''}" draggable="${!Object.values(state.sequence).includes(a.id)}" data-dragkind="sequence" data-id="${a.id}" onclick="pickSequence('${a.id}')">${esc(a.label)}</button>`).join('')}</div>${sequenceDone()?'<div class="donebar">✓ Your recovery plan is recorded in the casebook.</div>':'<div class="promptcallout">The shared vision is timely, fair, accurate service. Which leadership work must come first to make that vision realistic?</div>'}`;
openDialog('Build the 30-day recovery blueprint',body,'EXECUTIVE PLANNING TABLE');wireDrag();}
function pickSequence(id){if(Object.values(state.sequence).includes(id))return;selected=selected===id?null:id;openSequence()}
function openKeypad(){const ready=ethicsDone()&&visionDone()&&sequenceDone()&&state.digits.length===3;if(state.unlocked){closeDialog();render();return;}let shown=(state.code||'').padEnd(3,'_').split('').join(' ');openDialog('The executive exit lock',`<p>Three clues unlock the office. Use the sequence <b>Evidence → Mission → Recovery</b>. The exit checks your security code <em>and</em> your leadership obligations.</p><div class="row wrap"><span class="chip">${ethicsDone()?'✓':'○'} Fair integrity response</span><span class="chip">${visionDone()?'✓':'○'} Shared vision</span><span class="chip">${sequenceDone()?'✓':'○'} Recovery plan</span><span class="chip">${state.digits.length}/3 digits</span></div><div class="keypad"><div id="codefield" class="codefield mono" aria-live="polite">${shown}</div><div class="keys">${['1','2','3','4','5','6','7','8','⌫','0','C','↵'].map(k=>`<button class="key ${['↵','C'].includes(k)?'action':''}" onclick="pressKey('${k==='↵'?'ENTER':k==='⌫'?'BACK':k}')">${k}</button>`).join('')}</div></div>${ready?'<div class="donebar">All leadership protocols are satisfied. The exit will accept the correct three-digit code.</div>':'<div class="alertline">The keypad remains locked until you complete the integrity review, shared vision, recovery blueprint, and all three clues.</div>'}`,'SECURE ACCESS');}
function pressKey(k){if(k==='ENTER'){if(!ethicsDone()||!visionDone()||!sequenceDone()||state.digits.length!==3){notify('Complete the integrity review, team vision, recovery plan, and all three clues first.');return;}if(state.code==='314'){state.unlocked=true;state.completedAt=new Date().toISOString();award('Project Falcon leadership mission complete',75,{trust:4,momentum:5});save();closeDialog();render();setTimeout(()=>openDialog('Director Chen approves the mission',`<div class="outcome"><div class="eyebrow goldtext">MISSION 01 · SUCCESS</div><h2>You've opened the executive vault.</h2><p>You proved that leading a team takes more than finding the answer—it requires investigation, reflection, ethical judgment, and meaningful follow-through.</p><p><b>Your final leadership impact:</b> trust ${state.stats.trust}, clarity ${state.stats.clarity}, momentum ${state.stats.momentum}.</p></div>`,'MISSION SUCCESS','<button class="button gold" onclick="closeDialog();exportReport()">Download debrief report</button><button class="button ghost" onclick="closeDialog()">View final results</button>'),350);return;}state.attempts++;state.code='';save();notify('Access denied. Check the clue order: Evidence → Mission → Recovery.');openKeypad();return;}if(k==='C')state.code='';else if(k==='BACK')state.code=state.code.slice(0,-1);else if(state.code.length<3)state.code+=k;save();const el=$('codefield');if(el)el.textContent=state.code.padEnd(3,'_').split('').join(' ')}
function formatTime(sec){return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec/60)%60).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function refreshClock(){if($('clock'))$('clock').textContent='⏱ '+formatTime(state.time)}
function exportReport(){const avg=Math.round((state.stats.trust+state.stats.clarity+state.stats.momentum)/3);const report=`LEADERSHIP 101 ESCAPE LAB — MISSION 01: THE FRACTURED TEAM\nProject Falcon · fictional Riverton County training simulation\n\nTEAM / PLAYER: ${state.name}\nCOMPLETED: ${state.unlocked?'YES':'IN PROGRESS'}\nDATE: ${new Date().toLocaleString()}\nPLAY TIME: ${formatTime(state.time)}\nPOINTS: ${state.score} · HINTS: ${state.hints} · ATTEMPTS: ${state.attempts}\nTRUST: ${state.stats.trust}/100\nROLE CLARITY: ${state.stats.clarity}/100\nMOMENTUM: ${state.stats.momentum}/100\nCOMPOSITE GAME INDEX: ${avg}/100 (illustrative, not validated)\n\nCOURSE CONCEPTS PRACTICED\n- Foundations and evidence-led leadership\n- Integrity, judgment, accountability and fairness\n- Distinguishing verified information from assumptions\n- Tuckman team development stages\n- Task-versus-relationship orientation\n- Individual strengths and expressed motivational needs\n- Creating and communicating a shared vision; building a 30-day recovery plan\n\nACHIEVEMENTS\nEvidence sources: ${state.seen.length}/6\nEvidence classified: ${Object.keys(state.evidence).length}/6\nStages restored: ${Object.keys(state.stageSlots).length}/4\nCoaching situations: ${Object.keys(state.coaches).length}/2\nMotivational needs aligned: ${Object.keys(state.needs).length}/4\nIntegrity response: ${state.ethics||'not yet selected'}\nVision components: ${Object.keys(state.vision).length}/3\nRecovery phases: ${Object.keys(state.sequence).length}/3\nFinal exit: ${state.unlocked?'OPEN':'LOCKED'}\n\nDECISION HISTORY\n${state.log.map(x=>'- '+x.key+' ('+x.points+' pts)').join('\n')}\n\nINSTRUCTOR DEBRIEF PROMPTS\n1. Which early assumption was most tempting? Which evidence challenged it?\n2. How did you distinguish diagnosing a team system from blaming an individual?\n3. When did the task-versus-relationship balance need to change, and why?\n4. How did fair process influence the integrity decision?\n5. What evidence would make you revise your 30-day plan?\n\nDISCLAIMER\nFictional scenario. Feedback indicators and scoring are illustrative game mechanics, not psychometric tests or validated leadership assessment scores. No grades are transmitted to an LMS.`;
const blob=new Blob([report],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Leadership101_Mission01_'+state.name.replace(/[^a-z0-9-]/gi,'_').slice(0,28)+'.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);notify('Mission report downloaded.');}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('veil').classList.contains('hide'))closeDialog();});$('closeModal').addEventListener('click',closeDialog);$('veil').addEventListener('click',e=>{if(e.target===$('veil'))closeDialog()});
load();if(storage.getItem(SAVEKEY))render();else showLanding();ticker=setInterval(()=>{if(state.clock&&!state.unlocked&&storage.getItem(SAVEKEY)){state.time++;refreshClock();if(state.time%5===0)save()}},1000);
</script></body></html>
