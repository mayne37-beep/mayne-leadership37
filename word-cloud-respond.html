<body>
<a class="brand" href="index.html" aria-label="Mayne Leadership homepage"><img src="assets/jm-leadership-logo.svg" alt=""><span>MAYNE<b>LEADERSHIP</b></span></a>
<main>
<section class="card" aria-labelledby="question">
<div class="card-head"><div id="questionType" class="eyebrow">Classroom Response Studio</div><h1 id="question">Join your classroom</h1></div>
<div id="loading" class="loading hidden" aria-label="Connecting"></div>
<div class="card-body">
<form id="joinForm"><p class="muted">Enter the session code from your teacher, or scan the QR code on the slide.</p><label for="codeInput">Session code</label><input id="codeInput" type="text" inputmode="numeric" pattern="[0-9 ]{6,8}" maxlength="8" placeholder="000 0000" autocomplete="off" required><button class="button" type="submit">Join classroom</button></form>
<section id="responseArea" hidden>
<p id="instructions" class="session-instructions" hidden></p>
<div id="notice" class="notice hidden" role="status"><strong id="noticeTitle"></strong><p id="noticeText"></p></div>
<p id="remaining" class="remaining"></p>
<form id="responseForm"><fieldset id="studentFields"><div id="inputs"></div></fieldset><button id="submitButton" class="button" type="submit">Submit responses</button></form>
<button id="refreshButton" class="button secondary hidden" type="button">Check session again</button>
</section>
<p id="status" class="status" role="status" aria-live="polite"></p>
</div>
<div id="sessionLine" class="session-line hidden"><span>Session <span id="codeDisplay" class="code"></span></span><button id="changeSession" type="button">Join a different session</button></div>
</section>
<p class="foot">No name or account needed. Your teacher sees anonymous responses.<br><a href="facilitation.html">Mayne Leadership Classroom Tools</a></p>
</main>
<script id="classroom-response-core">
'use strict';
const ClassroomCore=(()=>{
  const types={wordcloud:'Word cloud',poll:'Polling',open:'Open-ended question',scale:'Scales',ranking:'Ranking',pin:'Pin on an image',xy:'XY quadrant chart'};
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>crypto.randomUUID(),num=(v,lo,hi,fallback)=>Number.isFinite(Number(v))?Math.max(lo,Math.min(hi,Number(v))):fallback;
  const item=()=>({id:uid(),label:''});
  function defaults(){return{type:'wordcloud',choices:[item(),item(),item()],multiple:false,chart:'bars',percentages:false,statements:[item()],scaleMin:1,scaleMax:5,scaleLow:'Strongly disagree',scaleHigh:'Strongly agree',openLimit:1000,openPage:0,hiddenResponses:[],pinImage:'',pinAspect:16/9,xLabel:'X axis',yLabel:'Y axis',xMin:0,xMax:10,yMin:0,yMax:10,xLow:'Low',xHigh:'High',yLow:'Low',yHigh:'High',quadrants:['','','',''],showAverage:true};}
  function fields(raw){
    const s=defaults();if(Object.hasOwn(types,raw.type))s.type=raw.type;
    for(const k of ['multiple','percentages','showAverage'])if(typeof raw[k]==='boolean')s[k]=raw[k];
    if(['bars','doughnut'].includes(raw.chart))s.chart=raw.chart;if(s.multiple)s.chart='bars';
    for(const k of ['scaleLow','scaleHigh','xLabel','yLabel','xLow','xHigh','yLow','yHigh'])if(typeof raw[k]==='string')s[k]=raw[k].slice(0,80);
    for(const k of ['choices','statements'])if(Array.isArray(raw[k])){const seen=new Set();s[k]=raw[k].slice(0,10).map(x=>{let id=typeof x?.id==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x.id)&&!['__proto__','constructor','prototype'].includes(x.id)&&!seen.has(x.id)?x.id:uid();seen.add(id);return{id,label:String(x?.label||'').slice(0,160)};});if(!s[k].length)s[k]=[item()];}
    s.scaleMin=Math.round(num(raw.scaleMin,0,9,1));s.scaleMax=Math.round(num(raw.scaleMax,s.scaleMin+1,10,5));
    s.openLimit=Math.round(num(raw.openLimit,100,2000,1000));s.openPage=Math.round(num(raw.openPage,0,12500,0));s.pinAspect=num(raw.pinAspect,.05,20,16/9);
    for(const axis of ['x','y']){s[axis+'Min']=num(raw[axis+'Min'],-1000,999,0);s[axis+'Max']=num(raw[axis+'Max'],s[axis+'Min']+.01,1000,10);}
    if(typeof raw.pinImage==='string'&&/^data:image\/(png|jpeg|webp);base64,[a-z\d+/=]+$/i.test(raw.pinImage)&&raw.pinImage.length<2500000)s.pinImage=raw.pinImage;
    if(Array.isArray(raw.hiddenResponses))s.hiddenResponses=raw.hiddenResponses.filter(x=>typeof x==='string').slice(0,50000);
    if(Array.isArray(raw.quadrants)&&raw.quadrants.length===4)s.quadrants=raw.quadrants.map(x=>String(x).slice(0,80));
    return s;
  }
  function config(s){
    const out={id:s.id,type:s.type||'wordcloud',question:s.question.trim(),info:s.info||'',accepting:s.accepting!==false};
    const keys={wordcloud:['responseLimit'],poll:['choices','multiple'],open:['openLimit'],scale:['statements','scaleMin','scaleMax','scaleLow','scaleHigh'],ranking:['choices'],pin:['pinImage','pinAspect'],xy:['xLabel','yLabel','xMin','xMax','yMin','yMax','xLow','xHigh','yLow','yHigh']};
    for(const k of keys[out.type]||[])out[k]=s[k];return out;
  }
  function ready(s){
    if(!s.question?.trim())return 'Write a question first.';
    if(['poll','ranking'].includes(s.type)&&(s.choices.length<2||s.choices.some(x=>!x.label.trim())))return 'Add at least two choices and give each one a label.';
    if(s.type==='scale'&&(!s.statements.length||s.statements.some(x=>!x.label.trim())))return 'Write a label for every scale statement.';
    if(s.type==='pin'&&!s.pinImage)return 'Upload the image your students will pin.';
    return '';
  }
  function normalizeAnswer(s,a){
    if(!a||typeof a!=='object')throw Error('Choose a response before submitting.');const type=s.type||'wordcloud';
    if(type==='wordcloud'){const words=(Array.isArray(a.words)?a.words:[]).filter(x=>typeof x==='string').map(x=>x.trim().replace(/\s+/g,' ').slice(0,65)).filter(Boolean);if(!words.length)throw Error('Enter at least one word or phrase.');if(words.length>s.responseLimit)throw Error('Too many words for this question.');return{words};}
    if(type==='poll'){const ids=Array.isArray(a.choice_ids)?a.choice_ids:[],valid=new Set(s.choices.map(x=>x.id));if(!ids.length||(!s.multiple&&ids.length!==1)||new Set(ids).size!==ids.length||ids.some(x=>!valid.has(x)))throw Error(s.multiple?'Select at least one choice.':'Select one choice.');return{choice_ids:ids};}
    if(type==='open'){const text=typeof a.text==='string'?a.text.trim():'';if(!text)throw Error('Write a response first.');if(text.length>s.openLimit)throw Error('Your response is too long.');return{text};}
    if(type==='scale'){const ratings={};for(const st of s.statements){const value=a.ratings?.[st.id];if(typeof value!=='number'||!Number.isInteger(value)||value<s.scaleMin||value>s.scaleMax)throw Error('Choose a rating for each statement.');ratings[st.id]=value;}return{ratings};}
    if(type==='ranking'){const order=Array.isArray(a.order)?a.order:[],valid=new Set(s.choices.map(x=>x.id));if(order.length!==valid.size||new Set(order).size!==valid.size||order.some(x=>!valid.has(x)))throw Error('Rank every item once.');return{order};}
    if(['pin','xy'].includes(type)){let x=a.x,y=a.y;const xmin=type==='pin'?0:s.xMin,xmax=type==='pin'?100:s.xMax,ymin=type==='pin'?0:s.yMin,ymax=type==='pin'?100:s.yMax;if(typeof x!=='number'||typeof y!=='number'||!Number.isFinite(x)||!Number.isFinite(y)||x<xmin||x>xmax||y<ymin||y>ymax)throw Error(type==='pin'?'Tap the image to place your pin.':'Choose a position on both axes.');return{x:Math.round(x*100)/100,y:Math.round(y*100)/100};}
    throw Error('This question type is unavailable.');
  }
  function response(raw){
    if(!raw||typeof raw!=='object')return null;const kind=Object.hasOwn(types,raw.kind)?raw.kind:'wordcloud';let answer={};
    if(kind==='wordcloud'){const words=Array.isArray(raw.words)?raw.words:Array.isArray(raw.answer?.words)?raw.answer.words:[];answer={words:words.filter(w=>typeof w==='string').map(w=>w.trim().slice(0,65)).filter(Boolean).slice(0,10)};if(!answer.words.length)return null;}
    else if(raw.answer&&typeof raw.answer==='object'&&JSON.stringify(raw.answer).length<15000)answer=JSON.parse(JSON.stringify(raw.answer));else return null;
    return{id:typeof raw.id==='string'?raw.id.slice(0,150):uid(),at:Number(raw.at)||0,kind,answer,words:kind==='wordcloud'?answer.words:[]};
  }
  function visible(s,all=false){let rows=all?s.responses:(s.mode==='private'||!s.resultsVisible?[]:s.mode==='click'?(s.clickSnapshot??s.responses.slice(0,s.revealed)):s.responses);return rows.filter(r=>(r.kind||'wordcloud')===(s.type||'wordcloud')&&(all||!(s.hiddenResponses||[]).includes(r.id)));}
  function summarize(s,rows=visible(s)){
    const valid=[],historical=s.type==='open'?{...s,openLimit:2000}:s;for(const r of rows){try{valid.push({...r,answer:normalizeAnswer(historical,r.answer||{words:r.words})});}catch{}}
    const out={rows:valid,total:valid.length};
    if(s.type==='poll'){out.items=s.choices.map(c=>({...c,count:valid.filter(r=>r.answer.choice_ids.includes(c.id)).length}));}
    if(s.type==='ranking'){out.items=s.choices.map(c=>{let points=0,ranks=0,first=0;for(const r of valid){const index=r.answer.order.indexOf(c.id);points+=s.choices.length-index;ranks+=index+1;if(!index)first++;}return{...c,points,mean:valid.length?ranks/valid.length:null,first};}).sort((a,b)=>b.points-a.points||s.choices.findIndex(c=>c.id===a.id)-s.choices.findIndex(c=>c.id===b.id));}
    if(s.type==='scale'){out.items=s.statements.map(st=>{const counts=Array.from({length:s.scaleMax-s.scaleMin+1},()=>0);let total=0;for(const r of valid){const n=r.answer.ratings[st.id];counts[n-s.scaleMin]++;total+=n;}return{...st,counts,mean:valid.length?total/valid.length:null};});}
    if(['pin','xy'].includes(s.type))out.average=valid.length?{x:valid.reduce((n,r)=>n+r.answer.x,0)/valid.length,y:valid.reduce((n,r)=>n+r.answer.y,0)/valid.length}:null;
    return out;
  }
  function answerText(s,r){
    const a=r.answer||{words:r.words},label=id=>s.choices.find(x=>x.id===id)?.label||'Removed choice';
    if((r.kind||'wordcloud')==='wordcloud')return(a.words||[]).join(', ');
    if(r.kind==='poll')return(a.choice_ids||[]).map(label).join('; ');
    if(r.kind==='open')return String(a.text||'');
    if(r.kind==='ranking')return(a.order||[]).map((id,i)=>(i+1)+'. '+label(id)).join('; ');
    if(r.kind==='scale')return s.statements.map(st=>st.label+': '+(a.ratings?.[st.id]??'—')).join('; ');
    return 'X: '+a.x+(r.kind==='pin'?'%':'')+'; Y: '+a.y+(r.kind==='pin'?'%':'');
  }
  function formFields(s,a={}){
    const type=s.type||'wordcloud';
    if(type==='wordcloud')return `<div class="entry-inputs">${Array.from({length:s.responseLimit},(_,i)=>`<input class="response-input" name="word${i}" type="text" maxlength="65" placeholder="Response ${i+1}" aria-label="Response ${i+1}" autocomplete="off" value="${esc(a.words?.[i]||'')}">`).join('')}</div>`;
    if(type==='poll')return `<div class="answer-options">${s.choices.map((c,i)=>`<label class="answer-option"><input type="${s.multiple?'checkbox':'radio'}" name="choice" value="${esc(c.id)}" ${a.choice_ids?.includes(c.id)?'checked':''} ${s.multiple?'':'required'}><span class="answer-letter">${String.fromCharCode(65+i)}</span><span>${esc(c.label||'Choice '+(i+1))}</span></label>`).join('')}</div><p class="small muted">${s.multiple?'Select all choices that apply.':'Select one choice.'}</p>`;
    if(type==='open')return `<label class="field"><span>Your response</span><textarea class="open-answer" name="text" rows="6" maxlength="${s.openLimit}" placeholder="Share your thoughts" required>${esc(a.text||'')}</textarea></label><p class="small muted" data-text-count>${(a.text||'').length} / ${s.openLimit} characters</p>`;
    if(type==='scale')return s.statements.map(st=>`<fieldset class="scale-question"><legend>${esc(st.label||'Statement')}</legend><div class="scale-buttons">${Array.from({length:s.scaleMax-s.scaleMin+1},(_,i)=>{const n=i+s.scaleMin;return `<label><input type="radio" name="rating_${esc(st.id)}" value="${n}" ${a.ratings?.[st.id]===n?'checked':''} required><span>${n}</span></label>`;}).join('')}</div><div class="scale-ends"><span>${esc(s.scaleLow)}</span><span>${esc(s.scaleHigh)}</span></div></fieldset>`).join('');
    if(type==='ranking'){const order=a.order?.length===s.choices.length?a.order:s.choices.map(c=>c.id);return `<p class="small muted">Move your highest priority to the top. Drag items or use the arrows.</p><ol class="ranking-input">${order.map(id=>{const c=s.choices.find(x=>x.id===id);return c?`<li draggable="true" data-choice-id="${esc(id)}"><span class="drag-grip" aria-hidden="true">⠿</span><span class="rank-label">${esc(c.label||'Ranking item')}</span><button type="button" data-rank="up" aria-label="Move ${esc(c.label)} up">↑</button><button type="button" data-rank="down" aria-label="Move ${esc(c.label)} down">↓</button></li>`:'';}).join('')}</ol>`;}

 const key=JSON.stringify([next.id,next.active_slide_id,next.epoch,shape]);
 if(key!==lastFormKey){const answer=same?draftAnswer(oldSlide):pending?.code===code&&pending.slide_id===next.active_slide_id&&pending.epoch===next.epoch?pending.answer:next.my_answer||{};$('inputs').innerHTML=ClassroomCore.formFields(s,answer);lastFormKey=key;ClassroomCore.refreshForms(document);if(prior&&!same){pending=null;savePending();status(prior.active_slide_id===next.active_slide_id?'Your teacher cleared this question. You can respond again.':'New question. Your previous answer is saved.');}}
 const open=next.status==='open'&&next.ready,ended=['ended','expired'].includes(next.status);$('responseForm').hidden=ended||!next.ready;$('studentFields').disabled=!open||submitting;$('submitButton').disabled=!open||submitting;$('submitButton').textContent=submitting?'Sending…':next.my_answer?'Update response':'Submit response';$('refreshButton').classList.toggle('hidden',open);$('remaining').hidden=s.type!=='wordcloud'||ended||!next.ready;$('remaining').textContent=`Enter up to ${s.responseLimit} words or phrases. Blank boxes are skipped.`;
 if(ended)notice('This session has ended.','Your answers have been saved. Ask your teacher for a new link to join another session.');
 else if(!next.ready)notice('Your teacher is preparing this question.','Keep this page open. The question will appear here when it is ready.');
 else if(!open)notice('Responses are paused.','Keep this page open. Your draft stays here while you wait for your teacher to resume.');
 else if(next.my_answer)notice('Thank you! Your response is saved.','You can update your answer below. Keep this page open for the next question.',true);
 else $('notice').classList.add('hidden');
 if(pending?.code===code&&pending.slide_id===next.active_slide_id&&pending.epoch===next.epoch&&equalAnswer(pending.answer,next.my_answer)){pending=null;savePending();status('Thank you. Your response was received.');}
}
function renderLegacy(next){
 const oldEpoch=session?.epoch;session=next;currentSlide=null;common(next);$('question').textContent=next.question;$('questionType').textContent='Word cloud';$('instructions').textContent=next.info||'';$('instructions').hidden=!next.info;
 const remaining=Math.max(0,next.response_limit-next.used),key=[next.id,next.epoch,next.response_limit,next.used].join(':');
 if(key!==lastFormKey){lastFormKey=key;$('inputs').innerHTML=ClassroomCore.formFields({type:'wordcloud',responseLimit:remaining},pending?.code===code&&pending.epoch===next.epoch&&next.used===(pending.beforeUsed||0)?{words:pending.words}:{});}
 if(oldEpoch&&oldEpoch!==next.epoch){pending=null;savePending();status('Your teacher cleared the results. You can submit new responses.');}
 const open=next.status==='open',ended=['ended','expired'].includes(next.status);$('responseForm').hidden=!remaining||ended;$('remaining').hidden=!remaining||ended;$('remaining').textContent=`${remaining} ${remaining===1?'response':'responses'} remaining. Blank boxes are skipped.`;$('refreshButton').classList.toggle('hidden',open);$('studentFields').disabled=!open||submitting;$('submitButton').disabled=!open||submitting;$('submitButton').textContent=submitting?'Sending…':'Submit responses';
 if(ended)notice('This session has ended.','Ask your teacher for a new link to join another session.');else if(!open)notice('Responses are paused.','Keep this page open. You can respond when your teacher resumes.');else if(!remaining)notice('Thank you!','All your responses have been received.',true);else if(next.used)notice('Your responses were received.','You can add more responses until you reach the limit.',true);else $('notice').classList.add('hidden');
}
const renderSession=next=>code.length===6?renderLegacy(next):renderClassroom(next);
function snapshotArgs(joinedCode,fresh=false){return joinedCode.length===6?['wc_session_info',{p_code:joinedCode,p_participant_id:legacyParticipant}]:['crs_student_snapshot',{p_code:joinedCode,p_participant_id:identity.id,p_participant_token:identity.token,p_known_revision:fresh?null:session?.revision??null}];}
async function join(value){
 const nextCode=String(value).replace(/\s/g,'');if(!/^\d{6,7}$/.test(nextCode)){status('Enter the six- or seven-digit session code from your teacher.',true);return;}if(connecting)return;
 connecting=true;const ticket=++generation;$('loading').classList.remove('hidden');$('joinForm').querySelector('button').disabled=true;status('Connecting to your class…');
 try{const [name,body]=snapshotArgs(nextCode,true),next=await api(name,body);if(ticket!==generation)return;code=nextCode;session=null;currentSlide=null;lastFormKey='';renderSession(next);const url=new URL(location.href);url.searchParams.set('code',code);history.replaceState(null,'',url);status('');}catch(e){if(ticket===generation)status(e.message,true);}finally{connecting=false;$('loading').classList.add('hidden');$('joinForm').querySelector('button').disabled=false;}
}
async function refresh(fresh=false){
 if(!session||connecting||submitting||document.hidden)return;connecting=true;const ticket=generation,joinedCode=code;
 try{const [name,body]=snapshotArgs(joinedCode,fresh),next=await api(name,body);if(ticket!==generation)return;renderSession(next);if($('status').classList.contains('error')&&!pending)status('Connection restored.');}catch(e){if(ticket===generation)status(e.message+' Reconnecting automatically.',true);}finally{connecting=false;}
}
$('joinForm').addEventListener('submit',e=>{e.preventDefault();join($('codeInput').value);});
$('responseForm').addEventListener('submit',async e=>{
 e.preventDefault();if(submitting||!session)return;if(session.status!=='open'){status('Wait for your teacher to resume responses.',true);return;}
 const legacy=code.length===6,s=legacy?{type:'wordcloud',responseLimit:session.response_limit-session.used}:currentSlide;let answer;
 try{answer=ClassroomCore.readForm($('responseForm'),s);}catch(error){status(error.message,true);return;}
 if(legacy){if(!pending||pending.code!==code||pending.epoch!==session.epoch||JSON.stringify(pending.words)!==JSON.stringify(answer.words))pending={code,epoch:session.epoch,words:answer.words,beforeUsed:session.used,request:crypto.randomUUID()};}
 else if(!pending||pending.code!==code||pending.slide_id!==session.active_slide_id||pending.epoch!==session.epoch||pending.revision!==session.revision||JSON.stringify(pending.answer)!==JSON.stringify(answer))pending={code,slide_id:session.active_slide_id,epoch:session.epoch,revision:session.revision,answer,request:crypto.randomUUID()};
 savePending();submitting=true;renderSession(session);status('Sending your response…');
 try{const next=legacy?await api('wc_submit_response',{p_code:code,p_participant_id:legacyParticipant,p_request_id:pending.request,p_epoch:pending.epoch,p_words:pending.words}):await api('crs_submit_response',{p_code:code,p_participant_id:identity.id,p_participant_token:identity.token,p_request_id:pending.request,p_slide_id:pending.slide_id,p_revision:pending.revision,p_epoch:pending.epoch,p_answer:pending.answer});pending=null;savePending();renderSession(next);status('Thank you. Your response was received.');}
 catch(error){status(error.message,true);if(error.server){pending=null;savePending();}}
 finally{submitting=false;if(session)renderSession(session);if($('status').classList.contains('error')&&!pending)await refresh(true);}
});
$('refreshButton').addEventListener('click',()=>refresh(true));
$('changeSession').addEventListener('click',()=>{if(submitting)return;generation++;session=null;currentSlide=null;code='';lastFormKey='';pending=null;savePending();$('joinForm').hidden=false;$('responseArea').hidden=true;$('sessionLine').classList.add('hidden');$('question').textContent='Join your classroom';$('questionType').textContent='Classroom Response Studio';status('');history.replaceState(null,'',location.pathname);$('codeInput').value='';$('codeInput').focus();});
ClassroomCore.wire(document);window.addEventListener('online',()=>refresh(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh(true);});setInterval(()=>refresh(),2200);
const initial=new URL(location.href).searchParams.get('code');if(initial){$('codeInput').value=initial;join(initial);}
})();

</script>
