<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d343b"><meta name="description" content="Respond to your class word cloud on Mayne Leadership. Scan your teacher's QR code or enter a session code.">
<title>Respond to a Word Cloud | Mayne Leadership</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{font-family:"Segoe UI",Arial,sans-serif;color:#202b36;background:#f3f5f8;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,input{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9293ed;outline-offset:3px}.brand{display:flex;gap:12px;align-items:center;justify-content:center;padding:26px 16px 20px;text-decoration:none;color:#17323a}.brand img{height:43px;width:43px}.brand span{font-size:13px;font-weight:650;letter-spacing:.18em}.brand b{display:block;letter-spacing:.12em;font-size:16px;margin-top:2px}main{width:min(560px,calc(100% - 32px));margin:10px auto 42px}.card{background:white;border:1px solid #e4e6ed;box-shadow:0 10px 40px #1b293409;border-radius:22px;overflow:hidden}.card-head{background:#0d343b;color:white;padding:30px}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#b3ced2;font-weight:600;margin-bottom:12px}h1{font-size:clamp(24px,5vw,31px);line-height:1.27;margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.card-body{padding:28px 30px}p{line-height:1.6;margin:0 0 18px}.muted{font-size:14px;color:#697481}.button{min-height:50px;width:100%;border-radius:12px;background:#5b5fdb;color:white;padding:13px 18px;border:0;font-weight:600}.button:hover:enabled{background:#494dcc}.secondary{background:#f0f0f9;color:#585ab4}.secondary:hover:enabled{background:#e6e5f4}label{display:block;font-weight:600;font-size:14px;margin-bottom:10px}input{display:block;width:100%;min-height:50px;padding:12px 14px;border:1px solid #d9dee7;border-radius:12px;color:#202b36;background:white}input:focus{border-color:#5b5fdb}#codeInput{font-size:27px;text-align:center;letter-spacing:.2em;margin-bottom:18px}.input-row{margin-bottom:16px}.input-row label{font-size:13px;color:#697481;margin-bottom:7px}.status{font-size:14px;line-height:1.5;margin-top:16px;color:#596472;min-height:1.5em}.status.error{color:#a33748}.notice{background:#f3f3fc;border:1px solid #e7e6f6;border-radius:14px;padding:18px;margin-bottom:20px}.notice strong{display:block;font-size:17px;margin-bottom:4px}.notice p{font-size:14px;margin:0}.success{background:#edf7f3;color:#215d4b;border-color:#d8eee4}.session-line{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #eceef2;padding:17px 30px;font-size:13px;color:#697481}.session-line button{background:none;border:0;color:#5557b1;padding:5px;font-size:13px}.code{font-weight:650;letter-spacing:.12em}.foot{text-align:center;font-size:12px;color:#7c8792;line-height:1.6;margin:20px auto}.foot a{color:inherit}.session-instructions{white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere}.hidden,[hidden]{display:none!important}.remaining{font-size:14px;color:#697481;margin-bottom:20px}.loading{height:3px;background:linear-gradient(90deg,#5b5fdb,#a7abef,#5b5fdb);background-size:200% 100%;animation:move 1.2s linear infinite}@keyframes move{to{background-position:200% 0}}@media(prefers-reduced-motion:reduce){.loading{animation:none}}@media(max-width:420px){.card-head{padding:24px}.card-body{padding:24px}.session-line{padding:17px 24px}.brand{padding-top:22px}}
</style>
</head>
<body>
<a class="brand" href="index.html" aria-label="Mayne Leadership homepage"><img src="assets/jm-leadership-logo.svg" alt=""><span>MAYNE<b>LEADERSHIP</b></span></a>
<main>
<section class="card" aria-labelledby="question">
<div class="card-head"><div class="eyebrow">Word Cloud Studio</div><h1 id="question">Join your class word cloud</h1></div>
<div id="loading" class="loading hidden" aria-label="Connecting"></div>
<div class="card-body">
<form id="joinForm"><p class="muted">Enter the six-digit code from your teacher, or scan the QR code on the slide.</p><label for="codeInput">Session code</label><input id="codeInput" type="text" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="000 000" autocomplete="off" required><button class="button" type="submit">Join word cloud</button></form>
<section id="responseArea" hidden>
<p id="instructions" class="session-instructions" hidden></p>
<div id="notice" class="notice hidden" role="status"><strong id="noticeTitle"></strong><p id="noticeText"></p></div>
<p id="remaining" class="remaining"></p>
<form id="responseForm"><div id="inputs"></div><button id="submitButton" class="button" type="submit">Submit responses</button></form>
<button id="refreshButton" class="button secondary hidden" type="button">Check session again</button>
</section>
<p id="status" class="status" role="status" aria-live="polite"></p>
</div>
<div id="sessionLine" class="session-line hidden"><span>Session <span id="codeDisplay" class="code"></span></span><button id="changeSession" type="button">Join a different session</button></div>
</section>
<p class="foot">No name or account needed. Your teacher sees anonymous responses.<br><a href="facilitation.html">Mayne Leadership Classroom Tools</a></p>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud';
let participant;try{participant=localStorage.getItem('mayne-word-cloud-participant:v1');if(!/^[\da-f-]{36}$/.test(participant||'')){participant=crypto.randomUUID();localStorage.setItem('mayne-word-cloud-participant:v1',participant);}}catch{participant=crypto.randomUUID();}
let session=null,code='',connecting=false,submitting=false,lastFormKey='',pending=null,connectionGeneration=0;
try{pending=JSON.parse(sessionStorage.getItem('mayne-word-cloud-pending:v1')||'null');}catch{}
function savePending(){try{if(pending)sessionStorage.setItem('mayne-word-cloud-pending:v1',JSON.stringify(pending));else sessionStorage.removeItem('mayne-word-cloud-pending:v1');}catch{}}
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
async function api(name,body){const c=new AbortController(),t=setTimeout(()=>c.abort(),16000);try{const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});const data=await r.json();if(!r.ok){const e=Error(data.message||'Could not complete your request.');e.server=true;throw e;}return data;}catch(e){if(e.name==='AbortError')throw Error('Connection timed out. Try again; your responses will be sent only once.');if(e instanceof TypeError||e instanceof SyntaxError)throw Error('Connection interrupted. Check your internet connection and try again.');throw e;}finally{clearTimeout(t);}}
function notice(title,text,success=false){$('notice').classList.remove('hidden');$('notice').classList.toggle('success',success);$('noticeTitle').textContent=title;$('noticeText').textContent=text;}
function renderSession(next){const oldEpoch=session?.epoch;session=next;$('question').textContent=next.question;$('instructions').textContent=next.info||'';$('instructions').hidden=!next.info;$('joinForm').hidden=true;$('responseArea').hidden=false;$('sessionLine').classList.remove('hidden');$('codeDisplay').textContent=next.code.slice(0,3)+' '+next.code.slice(3);const remaining=Math.max(0,next.response_limit-next.used);const key=[next.id,next.epoch,next.response_limit,next.used].join(':');if(key!==lastFormKey){lastFormKey=key;$('inputs').replaceChildren();for(let i=0;i<remaining;i++){const wrap=document.createElement('div');wrap.className='input-row';const label=document.createElement('label'),input=document.createElement('input');input.id='word'+i;input.name='word'+i;input.type='text';input.maxLength=65;input.autocomplete='off';input.placeholder='A word or short phrase';label.htmlFor=input.id;label.textContent='Response '+(next.used+i+1);wrap.append(label,input);$('inputs').append(wrap);}if(pending?.code===code&&pending.epoch===next.epoch&&next.used===(pending.beforeUsed||0)){[...$('inputs').querySelectorAll('input')].forEach((el,i)=>el.value=pending.words[i]||'');}}
if(oldEpoch&&oldEpoch!==next.epoch){pending=null;savePending();status('Your teacher cleared the results. You can submit new responses.');}
$('changeSession').disabled=submitting;const open=next.status==='open';$('responseForm').hidden=!remaining||['ended','expired'].includes(next.status);$('remaining').hidden=!remaining||['ended','expired'].includes(next.status);$('remaining').textContent=`${remaining} ${remaining===1?'response':'responses'} remaining. Enter a word or short phrase in each box. Blank boxes are skipped.`;$('refreshButton').classList.toggle('hidden',open);$('submitButton').disabled=!open||submitting;$('inputs').querySelectorAll('input').forEach(el=>el.disabled=!open||submitting);
if(['ended','expired'].includes(next.status))notice('This session has ended.','Your teacher has closed this word cloud. Ask for a new link to join another session.');else if(!open)notice('Responses are paused.','Keep this page open. You can respond when your teacher resumes the session.');else if(!remaining)notice('Thank you!','All of your responses have been received. You can leave this page open in case your teacher resets the question.',true);else if(next.used)notice('Your responses were received.','You can add more responses below until you reach the limit.',true);else $('notice').classList.add('hidden');
}
async function join(value){const nextCode=String(value).replace(/\s/g,'');if(!/^\d{6}$/.test(nextCode)){status('Enter a six-digit session code.',true);return;}if(connecting)return;connecting=true;const generation=++connectionGeneration;$('loading').classList.remove('hidden');$('joinForm').querySelector('button').disabled=true;status('Connecting to your class…');try{const next=await api('wc_session_info',{p_code:nextCode,p_participant_id:participant});if(generation!==connectionGeneration)return;code=nextCode;renderSession(next);const url=new URL(location.href);url.searchParams.set('code',code);history.replaceState(null,'',url);status('');}catch(e){status(e.message,true);}finally{connecting=false;$('loading').classList.add('hidden');$('joinForm').querySelector('button').disabled=false;}}
async function refresh(){if(!session||connecting||submitting||document.hidden)return;connecting=true;const generation=connectionGeneration,joinedCode=code;try{const next=await api('wc_session_info',{p_code:joinedCode,p_participant_id:participant});if(generation!==connectionGeneration)return;renderSession(next);if($('status').classList.contains('error')&&!pending)status('Connection restored.');}catch(e){status(e.message+' Reconnecting automatically.',true);}finally{connecting=false;}}
$('joinForm').addEventListener('submit',e=>{e.preventDefault();join($('codeInput').value);});
$('responseForm').addEventListener('submit',async e=>{e.preventDefault();if(submitting||!session)return;const words=[...$('inputs').querySelectorAll('input')].map(el=>el.value.trim().replace(/\s+/g,' ')).filter(Boolean);if(!words.length){status('Enter at least one word or phrase.',true);$('inputs').querySelector('input')?.focus();return;}if(session.status!=='open'){status('Wait for your teacher to resume responses.',true);return;}if(!pending||pending.code!==code||pending.epoch!==session.epoch||JSON.stringify(pending.words)!==JSON.stringify(words)){pending={code,epoch:session.epoch,words,beforeUsed:session.used,request:crypto.randomUUID()};savePending();}submitting=true;renderSession(session);$('submitButton').textContent='Sending…';status('Sending your responses…');try{const next=await api('wc_submit_response',{p_code:code,p_participant_id:participant,p_request_id:pending.request,p_epoch:pending.epoch,p_words:pending.words});pending=null;savePending();renderSession(next);status('Thank you. Your responses were received.');}catch(error){status(error.message,true);if(error.server){pending=null;savePending();}}finally{submitting=false;$('submitButton').textContent='Submit responses';if(session)renderSession(session);}});
$('refreshButton').addEventListener('click',refresh);
$('changeSession').addEventListener('click',()=>{if(submitting)return;connectionGeneration++;session=null;code='';lastFormKey='';$('joinForm').hidden=false;$('responseArea').hidden=true;$('sessionLine').classList.add('hidden');$('question').textContent='Join your class word cloud';status('');history.replaceState(null,'',location.pathname);$('codeInput').value='';$('codeInput').focus();});
window.addEventListener('online',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});setInterval(refresh,3500);
const initial=new URL(location.href).searchParams.get('code');if(initial){$('codeInput').value=initial;join(initial);}
})();
</script>
</body>
</html>
