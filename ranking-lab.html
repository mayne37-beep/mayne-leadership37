<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:310px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:75px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt,.mini{background:#fff;color:var(--n);border:1px solid var(--line)}.choiceRow{display:flex;gap:6px;margin-top:6px}.choiceRow input{margin:0}.mini{border-radius:8px;padding:7px 10px;cursor:pointer}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:30px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 22px;max-width:1000px}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center}.livejoin{display:none;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:7px 11px}.livejoin img{width:60px;height:60px;background:#fff;padding:3px;border-radius:6px}.livejoin b{font-size:22px;letter-spacing:.08em}.rank{width:min(950px,95%);display:grid;gap:12px}.rankitem{display:grid;grid-template-columns:54px 1fr auto;gap:15px;align-items:center;background:#fff;color:var(--n);padding:13px 18px;border-radius:14px;box-shadow:0 7px 18px #0003;transition:transform .55s,box-shadow .35s}.rankitem:first-child{box-shadow:0 0 0 3px #e1af4f,0 9px 22px #0004}.ranknum{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-size:20px;font-weight:900}.rankitem:first-child .ranknum{background:var(--g);color:var(--n)}.score{text-align:right;font-weight:900;color:var(--b)}.score small{display:block;color:#708398;font-weight:700}.track{grid-column:2/4;height:8px;background:#e7eef4;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2767a4,#e1af4f);border-radius:20px;transition:width .55s}.mask{padding:100px 20px;text-align:center;font-size:25px;font-weight:900;color:#dceafa}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.join{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd}.code{text-align:center;font-size:30px;font-weight:900;letter-spacing:.08em}.small{font-size:12px;color:var(--muted)}.join a{color:var(--b);font-weight:800;word-break:break-all}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 40px}.projecting .question{font-size:clamp(34px,4vw,64px)}.projecting .rank{width:min(1300px,95%)}.projecting .livejoin{display:flex}.exitproj{display:none}.projecting .exitproj{display:block;position:fixed;right:15px;bottom:15px;width:auto;z-index:20;opacity:.18}@media(max-width:850px){.layout{grid-template-columns:1fr}}
/* Mayne Live suite refinement */
header{box-shadow:0 6px 24px #102b4b24}.panel{transition:box-shadow .25s,transform .25s}.btn{transition:transform .15s,box-shadow .2s,opacity .2s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 15px #17395a20}.btn:disabled{opacity:.48;cursor:not-allowed}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1af4f88;outline-offset:2px}.stage{overflow:hidden}.question{line-height:1.12}.suitebadge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff25;color:#f2cb78;font-size:11px;font-weight:900;letter-spacing:.08em}.suitebadge:before{content:'●';font-size:8px}.join{box-shadow:inset 0 0 0 1px #fff}.code{font-variant-numeric:tabular-nums}.count{letter-spacing:.02em}.projecting .count{font-size:17px}.projecting .suitebadge{display:none}@media(max-width:600px){header{padding:18px}h1{font-size:27px}.layout{padding:0 10px}.panel{padding:12px}.stage{min-height:560px;padding:20px 12px}.question{font-size:26px}}
</style></head><body>
<header><div class="suitebadge">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>⇅ Ranking</h1><div class="sub">Turn individual priorities into a live collective ranking</div></header><div class="layout"><aside class="panel"><label>Question / Prompt</label><textarea id="q">Rank these options by priority.</textarea><label>Choices</label><div id="editor"></div><button class="btn alt" id="add">+ Add choice</button><label>Scoring</label><select id="scoring"><option value="borda">Weighted ranking</option><option value="average">Average position</option></select>
<button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button><div class="livecontrols" id="controls"><div class="statuspill" id="status">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reveal">Reveal ranking</button><button class="btn alt" id="reset">Reset ranking</button><button class="btn alt" id="copy">Copy join link</button></div><div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div></aside>
<main class="panel"><div class="stage"><div class="projectbar"><div class="suitebadge">MAYNE LEADERSHIP · LIVE</div><div class="livejoin" id="livejoin"><img id="qr"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"></div><div class="count" id="count">0 completed rankings</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],items=['Option 1','Option 2','Option 3','Option 4'],paused=false,revealed=false,resetAt=null,projecting=false;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}function editor(){$('editor').innerHTML=items.map((x,i)=>'<div class="choiceRow"><input data-i="'+i+'" value="'+esc(x)+'"><button class="mini" data-del="'+i+'" '+(items.length<=2?'disabled':'')+'>×</button></div>').join('');$('editor').querySelectorAll('input').forEach(e=>e.oninput=function(){items[+this.dataset.i]=this.value;draw()});$('editor').querySelectorAll('[data-del]').forEach(b=>b.onclick=function(){items.splice(+this.dataset.del,1);editor();draw()})}$('add').onclick=function(){if(items.length<8){items.push('Option '+(items.length+1));editor();draw()}}
function cfg(){return {responseLimit:1,items:items.slice()}}function active(){return resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows}
function draw(){$('showQ').textContent=$('q').value;var ar=active(),n=items.length,s=Array(n).fill(0),positions=Array(n).fill(0),counts=Array(n).fill(0);ar.forEach(r=>{var a=r.response.value||[];a.forEach((idx,pos)=>{idx=Number(idx);if(idx>=0&&idx<n){s[idx]+=n-pos;positions[idx]+=pos+1;counts[idx]++}})});var data=items.map((x,i)=>({x:x,i:i,score:s[i],avg:counts[i]?positions[i]/counts[i]:n}));data.sort($('scoring').value==='average'?(a,b)=>a.avg-b.avg:(a,b)=>b.score-a.score);if(!revealed){$('viz').innerHTML='<div class="mask">'+(ar.length?ar.length+' completed ranking'+(ar.length===1?'':'s'):'Waiting for responses…')+'<br><small>Collecting priorities without showing the room the current order.</small></div>'}else{var top=Math.max(1,...data.map(x=>$('scoring').value==='average'?(n+1-x.avg):x.score));$('viz').innerHTML='<div class="rank">'+data.map((x,i)=>{var val=$('scoring').value==='average'?(n+1-x.avg):x.score,p=val/top*100,label=$('scoring').value==='average'?'Avg position '+x.avg.toFixed(1):x.score+' pts';return '<div class="rankitem"><div class="ranknum">'+(i+1)+'</div><b>'+esc(x.x)+'</b><div class="score">'+label+'<small>'+(i===0?'Current class priority':'')+'</small></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div></div>'}).join('')+'</div>'}$('count').textContent=ar.length+' completed ranking'+(ar.length===1?'':'s')}
document.querySelectorAll('#q,#scoring').forEach(e=>e.oninput=draw);
function project(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=()=>project(!projecting);$('exitproj').onclick=()=>project(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'rank',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('join').style.display='block';$('livejoin').style.display='flex';$('controls').style.display='grid';revealed=false;paused=false;resetAt=null;$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500);draw()}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response,created_at');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('status').textContent=paused?'● Responses paused':'● Accepting responses';this.textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused}};
$('reveal').onclick=function(){revealed=!revealed;this.textContent=revealed?'Hide ranking':'Reveal ranking';draw()};$('reset').onclick=function(){if(session&&confirm('Reset the visible ranking and count only new responses from this point?')){resetAt=new Date();rows=[];revealed=false;$('reveal').textContent='Reveal ranking';draw()}};$('copy').onclick=function(){if($('link').href)navigator.clipboard.writeText($('link').href).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy join link',1200)})};
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('controls').style.display='none'};editor();draw()})();</script></body></html>
