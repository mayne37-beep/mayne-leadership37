<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d2948"><title>Leadership 101 Quiz Studio · Mayne Leadership</title><link rel="icon" href="/assets/favicon.svg"><style>
:root{--navy:#0c2443;--navy2:#173d66;--gold:#e6b457;--blue:#428dc6;--sky:#eaf4ff;--line:#d8e5f0;--ink:#16314f;--muted:#627890;--paper:#f4f8fd;--teal:#1d8a81}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#edf4fb}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}a{color:#2474a4}
.top{background:#0d2948;color:white;padding:18px clamp(16px,3vw,44px);display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;box-shadow:0 8px 26px #0b35531c}
.brand{font-size:11px;letter-spacing:.21em;font-weight:750;color:#f0c87a}.top h1{font-size:clamp(21px,3vw,30px);margin:1px 0 0;line-height:1.16;letter-spacing:-.04em}.top p{font-size:12px;color:#bdcfdf;margin:4px 0 0}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #b8cede;background:white;border-radius:10px;padding:9px 13px;color:#194265;font-weight:700;font-size:13px}.btn:hover{filter:brightness(.96)}.btn.primary{background:#e5b05e;color:#18293e;border-color:#dca65a}.btn.dark{background:#193f68;color:white;border-color:#193f68}.btn.ghost{background:transparent;color:#eaf6ff;border-color:#66829d}.btn.active{background:#f0d195;color:#193149}.btn.small{font-size:12px;padding:7px 10px}.btn.soft{background:#eaf4ff}.btn.warn{color:#8c3838;border-color:#eccbcb;background:#fff4f4}
.shell{max-width:1510px;margin:0 auto;padding:24px clamp(14px,2vw,34px) 60px}.status{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:17px}.status .eyebrow{color:#62819a;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.status h2{font-size:25px;letter-spacing:-.04em;margin:2px 0}.status p{margin:0;color:var(--muted);max-width:820px}
.pill{border:1px solid #cedce8;border-radius:999px;background:#fff;padding:5px 11px;font-size:11px;font-weight:800;color:#52718b}.grid{display:grid;grid-template-columns:minmax(0,1.52fr) minmax(325px,.82fr);gap:16px;align-items:stretch}
.panel{background:white;border:1px solid #d7e3ee;border-radius:19px;box-shadow:0 14px 37px #15355412;overflow:hidden}
.roomHead{background:linear-gradient(100deg,#102e51,#22517d);color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.roomHead b{font-size:14px}.roomHead small{color:#bed3e7;display:block;font-size:11px}
.roomnav{display:flex;gap:6px;flex-wrap:wrap}.roomnav button{font-size:11px;padding:6px 9px;background:#2c5375;border:1px solid #7394b0;border-radius:8px;color:white}.roomnav button.active{background:var(--gold);color:#102d4d}.roomnav button:disabled{opacity:.35}
.scene{height:min(50vw,535px);min-height:370px;position:relative;overflow:hidden;background:#315d87;background-position:center;background-size:cover;isolation:isolate}.scene::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0b264329 0%,#0a223f16 43%,#041426b3 100%),linear-gradient(110deg,#102f50a8 0%,transparent 35%,#05213a20 90%);pointer-events:none}.scene::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 85px #091a3280;pointer-events:none}
.sceneCaption{position:absolute;left:20px;top:20px;background:#061d36b3;color:white;z-index:1;padding:10px 14px;border-left:3px solid var(--gold);border-radius:4px 9px 9px 4px;max-width:65%;backdrop-filter:blur(8px)}.sceneCaption strong{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.sceneCaption span{font-size:11px;color:#dae9f5}
.hotspot{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:white;padding:0;min-width:82px;max-width:132px;text-shadow:0 2px 6px #062342;touch-action:none}
.hotspot .object{width:59px;height:59px;border:2px solid #ffffffdb;border-radius:14px;background:linear-gradient(145deg,#244f77e8,#0b264dd6);display:grid;place-items:center;font-size:28px;box-shadow:0 0 0 6px #dba94e2e,0 12px 28px #071d4fc9,inset 0 1px #fff8;transition:.22s;backdrop-filter:blur(10px);position:relative}
.hotspot .object::after{content:"";position:absolute;inset:-8px;border:1px solid #ffdd8a8c;border-radius:20px;animation:pulse 2s infinite}
.hotspot:hover .object,.hotspot.selected .object{transform:translateY(-4px) scale(1.08);background:#d59b4c;color:#152c48}
.hotspot.done .object{background:#196960;box-shadow:0 0 0 5px #81ebbc40;opacity:.9}.hotspot.done .object::after{display:none}
.hotspot em{font-style:normal;font-size:11px;font-weight:750;background:#0b294bbf;border:1px solid #e0f0ff38;border-radius:999px;padding:4px 9px;max-width:132px;line-height:1.25}
.hotspot.editing .object{cursor:grab}.sceneBottom{position:absolute;z-index:2;bottom:18px;left:18px;right:18px;display:flex;gap:8px;justify-content:space-between;align-items:end;color:#ecf4fc;font-size:12px}
.watermark{background:#09233ab8;border:1px solid #ffffff35;border-radius:10px;padding:8px 11px}.legend{color:#d3e9fc;font-size:11px}
.side{display:flex;flex-direction:column;min-height:440px}.sideTop{padding:20px 21px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#ffffff,#f5faff)}.sideTop span{font-size:10px;font-weight:900;color:#467397;letter-spacing:.12em;text-transform:uppercase}.sideTop h3{font-size:22px;line-height:1.2;margin:7px 0 4px;letter-spacing:-.04em}.sideTop p{color:#638098;font-size:12px;margin:0}.sideBody{padding:19px 22px;flex:1}.question{font-weight:750;font-size:17px;line-height:1.45;margin:0 0 16px}
.choice{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid #d4e1ed;border-radius:12px;background:#f7fbff;padding:12px 14px;color:#193e5e;line-height:1.35}.choice:hover:not(:disabled){border-color:#5c92c1;background:#edf6ff}.choice.correct{border-color:#238375;background:#e8f8f4}.choices small{display:inline-grid;place-items:center;background:#dcebf9;color:#225c91;border-radius:7px;width:24px;height:24px;font-weight:900;margin-right:9px}
.note{background:#eef6fe;border-left:3px solid #6ca7d6;border-radius:8px;padding:12px 14px;color:#355875;font-size:13px}.note.success{background:#e8f7ee;border-color:#36a47e;color:#125643}.note.error{background:#fff1f1;border-color:#db736b;color:#803e3b}.orderItem{display:flex;gap:8px;align-items:center;border:1px solid #dae6ef;background:#f7fbff;border-radius:10px;margin:8px 0;padding:8px 10px}.orderItem span{flex:1}.orderItem button{background:white;border:1px solid #c2d6e5;border-radius:7px;padding:4px 8px}
.sideFoot{border-top:1px solid #dce7ee;padding:15px 21px;background:#fcfdff;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.progress{display:flex;gap:7px;align-items:center}.dot{width:9px;height:9px;border-radius:99px;background:#d3e2ef}.dot.on{background:#319789}.meter{background:#dceaf5;border-radius:20px;height:7px;overflow:hidden;margin-top:10px}.meter>div{height:100%;background:linear-gradient(90deg,#2d79ac,#2daa9a);transition:.3s}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:15px}.quizCard{padding:18px;border:1px solid #cfdfec;background:white;border-radius:16px;text-align:left;box-shadow:0 8px 23px #12385a10}.quizCard strong{display:block;font-size:18px}.quizCard small{color:#67819a;display:block;margin:6px 0 0}.quizCard:hover{border-color:#4993c9}
.editor{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.editPanel{border:1px solid #d6e4f0;background:white;padding:18px;border-radius:17px;box-shadow:0 12px 32px #14365312}.editPanel h3{margin:0 0 10px;font-size:18px}.editPanel h4{font-size:13px;margin:16px 0 5px;color:#436480}.formrow{display:grid;gap:5px;margin:9px 0}.formrow label{font-size:12px;font-weight:800;color:#345777}.formrow input,.formrow select,.formrow textarea{border:1px solid #ccdce9;border-radius:9px;padding:9px 10px;background:#f9fcff;color:#143653;width:100%;min-width:0}.formrow textarea{min-height:75px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editHint{font-size:12px;color:#67849a}.previewMini{aspect-ratio:16/8;background-position:center;background-size:cover;border-radius:12px;border:1px solid #c7d9e8;margin-top:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.footnote{font-size:12px;color:#6e8197;margin-top:13px}
@keyframes pulse{50%{box-shadow:0 0 0 5px #ffc96a1d;opacity:.62}}
@media(max-width:1050px){.grid{grid-template-columns:1fr}.scene{height:min(62vw,560px)}.editor{grid-template-columns:1fr}}
@media(max-width:600px){.scene{min-height:350px;height:77vw}.hotspot{min-width:55px;max-width:82px}.hotspot .object{width:43px;height:43px;font-size:22px;border-radius:11px}.hotspot em{font-size:9px;max-width:86px;padding:3px 5px}.cards{grid-template-columns:1fr}.sideTop h3{font-size:19px}.top{padding:13px}.sceneCaption{left:10px;top:10px;padding:8px}.sceneCaption strong{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.evidence{background:linear-gradient(130deg,#fff9e8,#f7f2e5);border:1px solid #e5d7ae;border-left:4px solid #c9a65d;color:#503e27;box-shadow:0 3px 18px #614b1815}.quizCard[data-pick="2"]{background:linear-gradient(135deg,#fffefa,#ecf6fc);border-color:#d8c99b}.quizCard[data-pick="2"]::before{content:"⚖ ETHICS INVESTIGATION";display:block;color:#8c702f;letter-spacing:.11em;font-size:10px;font-weight:900;margin-bottom:8px;}.quizCard[data-pick="3"]{background:linear-gradient(145deg,#f8feff,#e6f3fb);border-color:#9cbacc}.quizCard[data-pick="3"]::before{content:"◆ LEADERSHIP BREAKTHROUGH";display:block;color:#267a8a;letter-spacing:.10em;font-size:10px;font-weight:900;margin-bottom:8px}.scene:has(.hotspot) .hotspot:focus-visible{outline:3px solid #ffce69;outline-offset:5px;border-radius:12px}.obstacles-scene::before{background:linear-gradient(180deg,#07192c12 0%,#071c3224 45%,#071c3171 100%)}.obstacles-scene::after{box-shadow:inset 0 0 45px #081d2c54}</style></head>
<body><header class="top"><div><div class="brand">MAYNE LEADERSHIP · LEADERSHIP 101</div><h1>Immersive Quiz Studio</h1><p>Explore, edit, and test two leadership escape-room experiences.</p></div><div class="actions"><button id="tabPlay" class="btn ghost" type="button">▶ Student play</button><button id="tabEdit" class="btn ghost" type="button">✎ Edit quizzes</button><button id="goBack" class="btn ghost" type="button">← Mayne Leadership</button></div></header><main id="main" class="shell"></main><input type="file" id="jsonUpload" hidden accept="application/json,.json"><input type="file" id="sceneUpload" hidden accept="image/*"><script>const SEED_QUIZZES=[{"id":"foundations","title":"Unlock the Leadership Files","subtitle":"Investigate leadership foundations, traits, styles, and task–relationship balance.","rooms":[{"name":"Director's Office","subtitle":"The first briefing","image":"https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1600&q=85"},{"name":"People & Culture Suite","subtitle":"Decode team dynamics","image":"https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=85"},{"name":"Strategy Boardroom","subtitle":"Make the final connection","image":"https://images.unsplash.com/photo-1497366858526-0766cadbe8fa?auto=format&fit=crop&w=1600&q=85"}],"questions":[{"id":"foundations-1","name":"The Director's Memo","icon":"document","room":0,"x":24,"y":35,"prompt":"What distinguishes leadership from simply holding an official position?","kind":"choice","options":["Exercising formal authority over staff","Influencing people toward shared objectives","Completing work faster than others","Delegating every difficult decision"],"answer":1,"feedback":"Leadership is influence directed toward a shared purpose, not merely authority.","points":1},{"id":"foundations-2","name":"The Values Folder","icon":"folder","room":0,"x":66,"y":33,"prompt":"Which behavior best demonstrates leadership integrity?","kind":"choice","options":["Applying consistent standards even when inconvenient","Keeping errors quiet to protect team morale","Changing expectations for high performers","Letting personal loyalty decide accountability"],"answer":0,"feedback":"Integrity requires alignment between values and actions.","points":1},{"id":"foundations-3","name":"The Traits Profile","icon":"badge","room":0,"x":46,"y":70,"prompt":"Which statement about leadership traits is most accurate?","kind":"choice","options":["Effective leaders share one fixed personality type","Leadership traits cannot be developed","Traits can help, but behaviors and context also matter","Confidence makes technical competence irrelevant"],"answer":2,"feedback":"Traits matter, but development, practice, and context also influence leadership.","points":1},{"id":"foundations-4","name":"The Four Styles","icon":"terminal","room":0,"x":83,"y":61,"prompt":"A supervisor offers a compelling vision and develops employees to exceed expectations. Which style is most evident?","kind":"choice","options":["Laissez-faire","Transactional","Transformational","Directive-only"],"answer":2,"feedback":"Transformational leadership connects purpose, growth, and change.","points":1},{"id":"foundations-5","name":"The Contract Ledger","icon":"folder","room":1,"x":23,"y":38,"prompt":"Which example is most clearly transactional leadership?","kind":"choice","options":["Providing support with no expectation of return","Using agreed performance targets and contingent rewards","Inviting employees to redefine the organization's mission","Avoiding decisions so the team can operate alone"],"answer":1,"feedback":"Transactional leadership emphasizes clear exchanges, performance expectations, and reinforcement.","points":1},{"id":"foundations-6","name":"The Service Note","icon":"document","room":1,"x":57,"y":28,"prompt":"A leader removes obstacles and helps employees grow while protecting organizational obligations. This most resembles:","kind":"choice","options":["Servant leadership","Laissez-faire leadership","Passive avoidance","Punitive supervision"],"answer":0,"feedback":"Servant leadership places strong emphasis on serving and developing others.","points":1},{"id":"foundations-7","name":"The Silent Desk","icon":"badge","room":1,"x":78,"y":69,"prompt":"When does a laissez-faire approach become harmful?","kind":"choice","options":["When an experienced team has autonomy","When employees coordinate peer-to-peer","When a leader avoids needed guidance and accountability","When the team chooses its own work methods"],"answer":2,"feedback":"Hands-off autonomy differs from passive non-leadership when direction is needed.","points":1},{"id":"foundations-8","name":"Task and Trust Map","icon":"terminal","room":2,"x":23,"y":36,"prompt":"A team is missing deadlines and avoiding feedback. What is the strongest initial response?","kind":"choice","options":["Ignore concerns until output rises","Clarify expectations while listening for obstacles","Focus solely on morale and remove all deadlines","Publicly single out low performers"],"answer":1,"feedback":"Effective leadership attends to tasks and relationships rather than treating them as opposites.","points":1},{"id":"foundations-9","name":"The Coaching Sequence","icon":"folder","room":2,"x":59,"y":35,"prompt":"Arrange these steps for a constructive initial coaching conversation.","kind":"order","options":["Ask for the employee's perspective","Clarify the observed situation","Agree on an action and check-in","Explore causes and options"],"answer":[1,0,3,2],"feedback":"Start with observable facts, listen, explore options, then agree on follow-up.","points":1},{"id":"foundations-10","name":"The Final Leadership Lock","icon":"lock","room":2,"x":77,"y":72,"prompt":"Which statement best summarizes strong leadership judgment?","kind":"choice","options":["Use one leadership style in every situation","Prioritize results regardless of people","Adapt your behavior to the people, task, ethics, and context","Let the most vocal team member choose"],"answer":2,"feedback":"Effective leaders balance context, accountability, relationships, and values.","points":1}]},{"id":"judgment","title":"The Leadership Decision Room","subtitle":"Navigate conflict, motivation, teams, ethics, and organizational obstacles.","rooms":[{"name":"Conflict Response Center","subtitle":"Listen beyond the surface","image":"https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1600&q=85"},{"name":"Team Operations Floor","subtitle":"Develop team capability","image":"https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1600&q=85"},{"name":"Executive Decision Chamber","subtitle":"Stand behind your decisions","image":"https://images.unsplash.com/photo-1497366412874-3415097a27e7?auto=format&fit=crop&w=1600&q=85"}],"questions":[{"id":"judgment-1","name":"The Resistant Employee","icon":"document","room":0,"x":21,"y":36,"prompt":"An employee challenges a new process. What should the leader do first?","kind":"choice","options":["Label the employee resistant","Ask what concerns and needs are driving the response","Threaten corrective action","Cancel the change"],"answer":1,"feedback":"Curious inquiry helps distinguish resistance, unmet needs, and valid concerns.","points":1},{"id":"judgment-2","name":"The Conflict Signals","icon":"badge","room":0,"x":68,"y":33,"prompt":"According to SDI-informed practice, conflict behavior may reflect:","kind":"choice","options":["Only poor attitude","A fixed lack of competence","Changes in how people protect underlying motives when threatened","Proof that relationships no longer matter"],"answer":2,"feedback":"Conflict can change outward behavior as people try to protect underlying motives.","points":1},{"id":"judgment-3","name":"The Difficult Conversation","icon":"terminal","room":0,"x":45,"y":74,"prompt":"Put the opening steps of a difficult conversation in a constructive order.","kind":"order","options":["Invite the employee's perspective","State specific observations without judgment","Agree on next steps","Explore impacts and possible solutions"],"answer":[1,0,3,2],"feedback":"Start with facts, invite perspective, work through options, and agree on action.","points":1},{"id":"judgment-4","name":"The Vision Brief","icon":"folder","room":1,"x":25,"y":34,"prompt":"Which vision statement gives the clearest shared direction?","kind":"choice","options":["We will do more with less","All supervisors must improve immediately","Within 90 days, reduce the backlog while protecting accuracy and employee trust","Leadership expects positive attitudes"],"answer":2,"feedback":"A useful vision names a credible desired future and meaningful priorities.","points":1},{"id":"judgment-5","name":"The Team Charter","icon":"document","room":1,"x":62,"y":34,"prompt":"What is most likely to help a newly forming team work effectively?","kind":"choice","options":["Assume expectations are obvious","Clarify purpose, roles, decision rights, and how conflict will be handled","Let the strongest personality define success","Avoid any disagreement in meetings"],"answer":1,"feedback":"Explicit shared agreements help teams coordinate and resolve differences.","points":1},{"id":"judgment-6","name":"The Accountability Board","icon":"badge","room":1,"x":79,"y":71,"prompt":"A respected high performer repeatedly undermines colleagues. What is the best response?","kind":"choice","options":["Ignore it because results are strong","Address behavior privately, clearly, and consistently","Criticize the employee in front of the team","Transfer responsibility to coworkers"],"answer":1,"feedback":"Results do not excuse harmful conduct; address it fairly and promptly.","points":1},{"id":"judgment-7","name":"The Reporting Anomaly","icon":"terminal","room":2,"x":22,"y":38,"prompt":"A supervisor discovers that some overdue requests were omitted from a report. What is the most responsible first step?","kind":"choice","options":["Quietly change the numbers","Preserve evidence and verify the discrepancy while following reporting procedures","Accuse the analyst publicly","Wait until the quarterly review"],"answer":1,"feedback":"Document and verify concerns, protect records, and use appropriate reporting processes.","points":1},{"id":"judgment-8","name":"The Culture Warning","icon":"folder","room":2,"x":58,"y":30,"prompt":"Which is a warning sign of destructive leadership?","kind":"choice","options":["Inviting respectful disagreement","Documenting performance expectations","Retaliating against employees who raise concerns","Acknowledging personal errors"],"answer":2,"feedback":"Retaliation undermines trust, ethics, and organizational learning.","points":1},{"id":"judgment-9","name":"The Change Barrier","icon":"document","room":2,"x":74,"y":68,"prompt":"Employees say a system rollout is unrealistic because they have not received training. What should the leader do?","kind":"choice","options":["Call resistance insubordination","Listen, verify readiness gaps, and adjust support and sequencing","Proceed without communicating","Cancel technology investment indefinitely"],"answer":1,"feedback":"Realistic change leadership identifies readiness and capability barriers.","points":1},{"id":"judgment-10","name":"The Executive Review Lock","icon":"lock","room":2,"x":42,"y":75,"prompt":"What is the most defensible leadership response to competing priorities?","kind":"choice","options":["Choose the fastest improvement regardless of risk","Hide uncertainty until leaders agree","Explain trade-offs, protect integrity, engage stakeholders, and monitor outcomes","Delegate accountability entirely to the team"],"answer":2,"feedback":"Strong judgment integrates ethics, relationships, results, and ongoing learning.","points":1}]},{"id":"ethics","title":"Ethics in Leadership: The Integrity Protocol","subtitle":"A Cedar Ridge investigation into data integrity, fairness, employee trust, and moral courage. Ten decisions. Three rooms. One reputation.","rooms":[{"name":"The Records Office","subtitle":"The numbers don't add up","briefing":"09:10 AM | The center's performance briefing is due today. Analyst Sam Rivera has flagged work requests that appear to be missing from the reported backlog. You have been asked to determine the facts without jumping to conclusions.","image":"/assets/leadership-101/ethics/records-office.jpg"},{"name":"The People & Trust Suite","subtitle":"Protect the people and the process","briefing":"11:25 AM | Your initial inquiry reveals that employees are afraid of being blamed. A respected supervisor may be involved. You must maintain fairness, protect people who raise concerns, and avoid prejudging anyone.","image":"/assets/leadership-101/ethics/people-trust-suite.jpg"},{"name":"The Executive Review Chamber","subtitle":"Integrity under pressure","briefing":"02:45 PM | Headquarters expects a report in hours. Leaders disagree about whether to disclose unresolved inconsistencies. Your job is to recommend a defensible response, not simply the most convenient one.","image":"/assets/leadership-101/ethics/executive-review.jpg"}],"questions":[{"id":"ethics-1","name":"The Director's Email","icon":"document","room":0,"x":20,"y":33,"evidence":"From: Director Torres | Subject: Board reporting\n“Please make sure the numbers are ready. I need a clear picture of progress, not another round of excuses.”","prompt":"Your team discovers that 37 older requests are omitted from the reported backlog. The executive briefing begins today. What is your best first leadership response?","kind":"choice","options":["Remove the requests permanently because the system classified them that way.","Accuse the operations manager of fraud in the morning briefing.","Preserve the records, verify how the requests were classified, and flag the reporting concern through appropriate channels.","Publish the numbers without qualification and investigate after leadership has left."],"answer":2,"feedback":"Ethical leadership starts with accurate records and proportionate action. Preserve evidence, investigate promptly, and communicate material uncertainty rather than hide it.","points":1},{"id":"ethics-2","name":"The Classification Ledger","icon":"folder","room":0,"x":63,"y":30,"evidence":"A spreadsheet lists 37 work requests with a status of “reassigned.” No corresponding completion entries appear. The status change might have resulted from a workflow defect, an instruction, or misconduct.","prompt":"What can you responsibly conclude from the ledger alone?","kind":"choice","options":["The records raise a concern that requires investigation; motive and responsibility remain uncertain.","The supervisor must have deliberately falsified the data.","Every reassigned request is necessarily overdue.","No investigation is necessary because the spreadsheet is unofficial."],"answer":0,"feedback":"Distinguish evidence from inference. Investigate causes and avoid accusations until the facts support them.","points":1},{"id":"ethics-3","name":"The Vendor Dinner","icon":"badge","room":0,"x":82,"y":69,"evidence":"A vendor bidding to support the new technology program invites a decision-maker to an expensive dinner. The employee says they can remain objective and the invitation is just networking.","prompt":"Which leadership response best protects the integrity of the procurement decision?","kind":"choice","options":["Accept if the vendor promises not to discuss the bid.","Accept privately because no one can prove bias.","Let the employee decide based entirely on personal comfort.","Decline or seek ethics advice, disclose the potential conflict, and follow applicable gift and procurement rules."],"answer":3,"feedback":"Avoiding even the appearance of improper influence can matter. Disclosure and applicable ethics guidance protect fair decisions.","points":1},{"id":"ethics-4","name":"The Evidence Sequence","icon":"terminal","room":0,"x":47,"y":70,"evidence":"You need a defensible response to the backlog discrepancy. The records may be used in a near-term briefing, so the sequence cannot wait for a perfect investigation.","prompt":"Arrange the actions into the most appropriate initial response sequence.","kind":"order","options":["Communicate the verified findings, remaining uncertainty, and corrective plan.","Secure original records and prevent alteration.","Notify the appropriate oversight or management channels promptly.","Compare source entries and clarify the reporting method."],"answer":[1,2,3,0],"feedback":"First protect evidence; promptly escalate the concern through the right channels, verify details, and communicate accurately. Follow agency-specific policy if it requires faster notification.","points":1},{"id":"ethics-5","name":"Sam's Confidential Message","icon":"document","room":1,"x":23,"y":34,"evidence":"Sam Rivera: “I sent the numbers because I thought leadership needed to know. I'm concerned my supervisor will punish me if they find out I raised this.”","prompt":"What should you tell Sam?","kind":"choice","options":["Promise that no one will ever learn anything about the concern.","Explain reporting protections and limits of confidentiality, prevent retaliation, and connect Sam with appropriate channels.","Tell Sam not to discuss concerns until after the briefing.","Disclose Sam's identity to everyone so the process appears transparent."],"answer":1,"feedback":"Take retaliation concerns seriously while avoiding guarantees you cannot make. Use appropriate protected channels and limit disclosures to a legitimate need to know.","points":1},{"id":"ethics-6","name":"The Supervisor's File","icon":"folder","room":1,"x":68,"y":31,"evidence":"Marcus Hale is highly productive and well-liked by the director. Staff allege that Marcus receives exceptions to rules other supervisors must follow. Marcus says his team is held to harder targets.","prompt":"How should leadership evaluate Marcus fairly?","kind":"choice","options":["Excuse any issue because Marcus produces strong results.","Discipline Marcus immediately to prove a point.","Apply consistent standards, examine relevant facts and context, and give Marcus a fair opportunity to respond.","Ask employees to vote on Marcus's punishment."],"answer":2,"feedback":"Ethical accountability is consistent and evidence-based. Procedural fairness protects the workforce and the person under review.","points":1},{"id":"ethics-7","name":"The Names Request","icon":"terminal","room":1,"x":45,"y":75,"evidence":"A senior leader asks you to provide the names of employees who reported concerns. No investigative purpose or authority is given for the request.","prompt":"What is the best initial response?","kind":"choice","options":["Share every name to demonstrate loyalty.","Post a list of complainants for transparency.","Destroy the list so no one can ask again.","Clarify the legitimate need and authority, follow confidentiality and reporting rules, and disclose only what is appropriately required."],"answer":3,"feedback":"Accountability does not require unnecessary disclosure. Verify authority and protect reporting processes under applicable rules.","points":1},{"id":"ethics-8","name":"The Incomplete Brief","icon":"document","room":2,"x":18,"y":33,"evidence":"The board briefing shows a 30% backlog reduction. Your analysis indicates the reduction depends partly on how requests were reclassified, and the underlying records are still being reconciled.","prompt":"How should you describe performance to the executive board?","kind":"choice","options":["Present the reduction without caveats because it is technically a report figure.","Explain the reported improvement, the data limitation, and what is being verified before claiming a confirmed improvement.","Delete the performance slide and refuse to answer any questions.","Use the larger reduction estimate to preserve confidence."],"answer":1,"feedback":"Transparency requires presenting limitations that could materially change the audience's understanding. Accuracy and trust are more important than a polished story.","points":1},{"id":"ethics-9","name":"The Accusation","icon":"badge","room":2,"x":65,"y":30,"evidence":"A team member argues, “Everyone knows Marcus changed the numbers. Remove him today.” Another says, “Leave him alone; he is our best manager.” Neither has reviewed the full evidence.","prompt":"What is the strongest leadership decision?","kind":"choice","options":["Use an impartial, timely review with appropriate safeguards and proportionate interim measures if warranted.","Remove Marcus immediately because speed demonstrates strength.","Ignore the issue because Marcus gets results.","Let the director's friendship with Marcus determine the outcome."],"answer":0,"feedback":"Ethical leaders resist both favoritism and premature punishment. Due process and risk-based interim safeguards can coexist.","points":1},{"id":"ethics-10","name":"The Integrity Lock","icon":"lock","room":2,"x":78,"y":73,"evidence":"FINAL CHOICE | The executive board asks: “What will you do after today's briefing to rebuild an ethical leadership culture?”","prompt":"Which action plan most strongly supports an enduring ethical culture?","kind":"choice","options":["Tell staff that integrity is important and end the discussion.","Rely solely on annual compliance training without checking practice.","Model transparency, standardize fair processes, protect reporting channels, and review whether the organization acts on concerns.","Assign all ethical responsibility to the legal office."],"answer":2,"feedback":"A culture of integrity comes from modeled behavior, fair systems, safe reporting, and continuous follow-through—not slogans alone.","points":1}]},{"id":"obstacles","title":"Overcoming Obstacles: The Breakthrough Challenge","subtitle":"Cedar Ridge's recovery stalls. Investigate bottlenecks, uncover people barriers, and lead a practical turnaround without sacrificing trust.","rooms":[{"name":"The Bottleneck Office","subtitle":"Separate symptoms from causes","briefing":"08:15 AM | Two weeks before the Cedar Ridge process rollout, 210 requests remain overdue. Supervisors blame effort, analysts blame a faulty handoff, and headquarters wants the backlog cleared. Diagnose before prescribing.","image":"/assets/leadership-101/obstacles/bottleneck-office.avif"},{"name":"The Friction Zone","subtitle":"Discover what is slowing your people down","briefing":"11:30 AM | After the workflow review, employees reveal contradictory priorities, uneven training, and a fear of speaking up. Your next challenge is to remove barriers without treating concerns as disloyalty.","image":"/assets/leadership-101/obstacles/friction-zone.avif"},{"name":"The Breakthrough Chamber","subtitle":"Turn constraints into forward movement","briefing":"03:00 PM | You have limited staff hours and a near-term executive check-in. Your team must choose a focused intervention, communicate trade-offs, and measure whether the bottleneck actually improves.","image":"/assets/leadership-101/obstacles/breakthrough-chamber.avif"}],"questions":[{"id":"obstacles-1","name":"The Deadline Alert","icon":"terminal","room":0,"x":24,"y":31,"evidence":"OPERATIONS DASHBOARD | Service completion: 64% on time. Of 210 overdue requests, most spend several days awaiting transfer between two sections. The throughput of both sections looks normal once they receive a case.","prompt":"What is the strongest first leadership response to the missed deadlines?","kind":"choice","options":["Set a blanket overtime requirement for every employee.","Verify the handoff delays and map where work actually waits before selecting a corrective action.","Replace the supervisors responsible for the backlog.","Tell staff the figures will improve once they work harder."],"answer":1,"feedback":"The queue between sections is the likely constraint. Examine the handoff before increasing effort elsewhere.","points":1},{"id":"obstacles-2","name":"The Flow Map","icon":"document","room":0,"x":60,"y":34,"evidence":"CASE ROUTE | Intake completes a request within one day. A handoff queue holds it for four days. Quality review takes another day. The two staffed stages have spare capacity.","prompt":"Which change is most likely to remove the main bottleneck?","kind":"choice","options":["Add a third intake checklist.","Buy new quality-review furniture.","Increase how many requests intake sends to the same queue.","Clarify transfer ownership, simplify handoff rules, and monitor queue age."],"answer":3,"feedback":"The queue is the constraint. Improving flow requires changing transfer rules, responsibilities, and visibility—not optimizing already-capable stages.","points":1},{"id":"obstacles-3","name":"The Priority Wall","icon":"folder","room":0,"x":81,"y":65,"evidence":"THREE DIRECTIVES | Director: 'Clear the backlog.' Technology lead: 'Finish rollout training.' Team manager: 'Do all urgent requests immediately.' Staff report that no one has resolved conflicts among these demands.","prompt":"Which action would most directly reduce priority confusion?","kind":"choice","options":["Agree on a short, ranked set of priorities, decision rights, and escalation rules with the responsible leaders.","Tell employees to decide individually which task matters most.","Announce that everything is equally important.","Post a motivational message about flexibility."],"answer":0,"feedback":"A leader converts competing requests into shared direction, explicit trade-offs, and clear escalation—not another slogan.","points":1},{"id":"obstacles-4","name":"The Diagnosis Lock","icon":"lock","room":0,"x":43,"y":72,"evidence":"WORKFLOW REVIEW | You must brief the director on what is slowing delivery. Several symptoms overlap, and employees fear another quick fix.","prompt":"Arrange these diagnostic actions in a useful sequence.","kind":"order","options":["Test a focused improvement and measure flow.","Map the work and identify where delays accumulate.","Ask frontline staff and supervisors what constrains the work.","Confirm the outcome that needs improvement and a baseline."],"answer":[3,1,2,0],"feedback":"Set a clear performance aim, map the process, hear from those doing the work, then test and measure a focused change. Investigation can iterate as evidence develops.","points":1},{"id":"obstacles-5","name":"The Employee Message","icon":"document","room":1,"x":21,"y":37,"evidence":"EMPLOYEE NOTE | 'I keep hearing we're resisting the change. But my team only had a ten-minute walkthrough of the new system. We're worried a mistake will affect real people.'","prompt":"How should the supervisor respond first?","kind":"choice","options":["Identify the concern as an attitude problem and issue a warning.","Delay the entire rollout indefinitely without reviewing options.","Acknowledge the risk, confirm the training gap, and arrange practice and support before demanding proficiency.","Tell the employee to learn outside working hours."],"answer":2,"feedback":"Apparent resistance may be a capability or safety concern. Effective leadership examines readiness and provides the support needed to perform.","points":1},{"id":"obstacles-6","name":"The Silence Indicator","icon":"badge","room":1,"x":65,"y":29,"evidence":"TEAM PULSE | In a staff poll, 78% say they know what success looks like; only 29% say they feel safe raising a potential error. Errors often surface late.","prompt":"Which leadership behavior will most help remove this obstacle?","kind":"choice","options":["Increase the frequency of public rankings.","Invite concerns without retaliation, thank employees for raising risks, and show what action follows.","Require employees to submit concerns only through their direct supervisor, even when that supervisor is involved.","Avoid mentioning mistakes so people will feel less pressure."],"answer":1,"feedback":"Psychological safety grows when leaders welcome candor, respond constructively, and follow through on valid concerns.","points":1},{"id":"obstacles-7","name":"The Capacity Request","icon":"folder","room":1,"x":80,"y":69,"evidence":"RESOURCE REQUEST | Two qualified employees can help clear the handoff queue for one week, but doing so delays rollout training. Neither objective can be completed at full pace simultaneously.","prompt":"What is the most responsible way to handle the limited capacity?","kind":"choice","options":["Promise both deadlines will be met without changing the work.","Choose whichever supervisor speaks first.","Shift staff quietly and conceal the training delay.","Compare consequences, consult owners, select a time-bound priority, and communicate the trade-off and review date."],"answer":3,"feedback":"Scarce resources demand explicit priorities, transparent trade-offs, and a review point rather than overpromising.","points":1},{"id":"obstacles-8","name":"The Intervention Board","icon":"terminal","room":2,"x":21,"y":34,"evidence":"PILOT RESULT | A one-week handoff pilot reduced average transfer delay from 4.0 to 1.5 days. The sample is small, and staff report that one exception type remains problematic.","prompt":"What should leadership do with the initial pilot finding?","kind":"choice","options":["Examine the small sample and exceptions, continue measuring, and adjust before broader adoption.","Declare the underlying problem permanently solved.","Ignore the improvement because it isn't perfect.","Mandate the same process everywhere immediately without feedback."],"answer":0,"feedback":"Early evidence is promising but not conclusive. Strong leaders combine measures, exceptions, feedback, and gradual improvement.","points":1},{"id":"obstacles-9","name":"The Momentum Check","icon":"document","room":2,"x":59,"y":30,"evidence":"STAKEHOLDER UPDATE | Employees understand the new priorities, but some supervisors continue assigning conflicting 'urgent' tasks. The handoff queue has started growing again.","prompt":"Which leadership action best sustains progress?","kind":"choice","options":["Repeat the vision statement without changing any coordination process.","Ask staff to tolerate the conflicting directives.","Reconfirm decision rights with supervisors, use a visible priority board, and review the queue together on a regular cadence.","Wait until the final report to discuss the breakdown."],"answer":2,"feedback":"Obstacles return when the system that produces them remains unchanged. Reinforce agreements and use recurring feedback to sustain improvement.","points":1},{"id":"obstacles-10","name":"The Breakthrough Lock","icon":"lock","room":2,"x":81,"y":72,"evidence":"EXECUTIVE CHALLENGE | The director asks: 'What is your 30-day plan to overcome barriers without exhausting employees or hiding missed targets?' Your answer must address work, people, and accountability.","prompt":"Which plan best demonstrates leadership through obstacles?","kind":"choice","options":["Order immediate overtime, avoid difficult conversations, and report only wins.","Identify the key constraint, set shared priorities, support staff, test improvements, communicate trade-offs, and track both delivery and trust.","Delegate the entire recovery to one high performer.","Launch several unmeasured initiatives at once to demonstrate urgency."],"answer":1,"feedback":"The strongest plan integrates diagnosis, clear priorities, people support, experimentation, ethical reporting, and measurable follow-through.","points":1}]}];</script><script>
"use strict";
const DEFAULTS = SEED_QUIZZES;
const key="mayne.leadership101.quizPilot.v1";
let projects=loadProjects(),selected=Math.max(0,projects.findIndex(x=>x.id===new URLSearchParams(location.search).get("mission"))),mode=new URLSearchParams(location.search).get("edit")==="1"?"edit":"play";
let run=null,editingRoom=0,editingQuestion=0,dragIndex=-1;
const $=s=>document.querySelector(s);
function clone(v){return JSON.parse(JSON.stringify(v))}
function clean(s){return String(s===undefined?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function goodURL(src){let s=String(src||"");return /^https:\/\/[^"'<> ]+$/i.test(s)||/^\/assets\/leadership-101\/[\w\/-]+\.(?:svg|png|webp|avif|jpe?g)$/i.test(s)||/^data:image\/(?:jpeg|png|webp);base64,[a-zA-Z0-9+/=]+$/.test(s)?s:""}
function loadProjects(){try{let v=JSON.parse(localStorage.getItem(key)||"null");if(Array.isArray(v)&&v.length>=2&&v.every(x=>x&&Array.isArray(x.questions)&&Array.isArray(x.rooms))){return DEFAULTS.map(seed=>{const saved=v.find(p=>p.id===seed.id);if(!saved)return clone(seed);if(seed.id==="ethics"){const previous=["https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=90","https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1800&q=90","https://images.unsplash.com/photo-1497366412874-3415097a27e7?auto=format&fit=crop&w=1800&q=90"];saved.rooms.forEach((room,i)=>{if(room.image===previous[i])room.image=seed.rooms[i].image})}if(seed.id==="obstacles"){const previous=["/assets/leadership-101/obstacles/bottleneck-office.svg","/assets/leadership-101/obstacles/friction-zone.svg","/assets/leadership-101/obstacles/breakthrough-chamber.svg"];saved.rooms.forEach((room,i)=>{if(room.image===previous[i])room.image=seed.rooms[i].image})}return saved})}}catch(e){}return clone(DEFAULTS)}
function persist(){try{localStorage.setItem(key,JSON.stringify(projects));return true}catch(e){alert("Unable to save this draft in this browser. Try a smaller background image or export your JSON file.");return false}}
function q(){return projects[selected]}function qs(r){return q().questions.map((a,i)=>({...a,idx:i})).filter(x=>x.room===r)}
function score(){return (run?.first||[]).reduce((sum,v)=>sum+(v||0),0)}function total(){return q().questions.reduce((sum,x)=>sum+(Number(x.points)||1),0)}
function resetRun(){run={started:false,room:0,active:-1,done:[],attempts:{},first:Array(q().questions.length).fill(0),showGood:false,message:"",order:[],finished:false};}
function setMode(next){mode=next;resetRun();render()}
function setQuiz(i){selected=i;editingRoom=0;editingQuestion=0;resetRun();render()}
function render(){document.querySelector("#tabPlay").classList.toggle("active",mode==="play");document.querySelector("#tabEdit").classList.toggle("active",mode==="edit");$("#main").innerHTML=mode==="edit"?editor():player();}
function badgeIcon(name){return {document:"📄",folder:"🗂️",badge:"🔍",terminal:"🖥️",lock:"🔒"}[name]||"🔎"}
function progressDots(){return q().questions.map((a,i)=>'<span class="dot '+(run.done.includes(i)?"on":"")+'" title="File '+(i+1)+'"></span>').join("")}
function scene(r,inEdit){let room=q().rooms[r],hot=qs(r).map(a=>'<button type="button" class="hotspot '+(inEdit?"editing ":"")+(run?.done.includes(a.idx)?"done ":"")+(run?.active===a.idx&&!inEdit?"selected":"")+'" data-idx="'+a.idx+'" style="left:'+Math.max(3,Math.min(97,Number(a.x)||50))+'%;top:'+Math.max(13,Math.min(90,Number(a.y)||50))+'%" aria-label="'+clean(a.name)+'"><span class="object">'+(run?.done.includes(a.idx)&&!inEdit?"✓":badgeIcon(a.icon))+'</span><em>'+clean(a.name)+'</em></button>').join("");let bg=goodURL(room.image);return '<div class="scene '+(q().id==="obstacles"?"obstacles-scene":"")+'" style="background-image:linear-gradient(130deg,#294f798a,#14365a30),url(&quot;'+clean(bg)+'&quot;)"><div class="sceneCaption"><strong>ROOM 0'+(r+1)+' · '+clean(room.name)+'</strong><span>'+clean(room.subtitle)+'</span></div>'+hot+'<div class="sceneBottom"><div class="watermark">'+(inEdit?"DRAG THE OBJECTS TO REPOSITION":"SELECT A GLOWING OBJECT TO INVESTIGATE")+'</div><span class="legend">CEDAR RIDGE · LEADERSHIP 101</span></div></div>'}
function roomReady(r){return r===0||qs(r-1).every(x=>run.done.includes(x.idx))}
function player(){if(!run)resetRun();if(!run.started){return '<div class="status"><div><span class="eyebrow">LEARN · EXPLORE · DECIDE</span><h2>Choose a leadership mission</h2><p>Ten challenges across three environments. Choose a quiz to start, then interact with evidence inside the rooms.</p></div><span class="pill">TEST EDITION · NO LMS GRADE SYNC</span></div><div class="cards">'+projects.map((a,i)=>'<button class="quizCard" data-pick="'+i+'"><strong>'+clean(a.title)+'</strong><small>'+clean(a.subtitle)+'</small><small><b>'+a.questions.length+' challenges · '+a.rooms.length+' rooms</b></small><span class="btn primary" style="display:inline-block;margin-top:13px">Start mission →</span></button>').join("")+'</div><p class="footnote">Pilot mode: results remain in the browser. Published quiz grades require secure CREASY/LMS integration.</p>'}
 if(run.finished)return '<div class="panel" style="padding:35px;max-width:760px;margin:auto"><div class="brand" style="color:#9c743e">CASE CLOSED · MISSION COMPLETE</div><h2>'+clean(q().title)+'</h2><p>You secured all '+q().questions.length+' leadership files.</p><h1 style="font-size:58px;color:#156f83">'+score()+' / '+total()+'</h1><p>Points are awarded for first-attempt solutions. Use the reflection prompts with your instructor to discuss choices and improvement.</p><div class="toolbar"><button class="btn primary" id="copyResults">Copy results</button><button class="btn" id="restart">Play again</button><button class="btn" id="newQuiz">Choose another quiz</button></div><p class="footnote">This is an instructional pilot. Scores are not authenticated or sent to the LMS.</p></div>';
 let r=run.room,a=run.active>=0?q().questions[run.active]:null;
 let body="";
 if(!a){body='<p class="question">Find the evidence hidden around this room.</p>'+(q().rooms[r].briefing?'<div class="note" style="white-space:pre-line;margin-bottom:12px"><b>Situation update:</b> '+clean(q().rooms[r].briefing)+'</div>':'')+'<p class="note">Choose an illuminated object in the scene to open its leadership challenge. Correct solutions unlock the next environment.</p>'}
 else{body=(a.evidence?'<div class="note evidence" style="white-space:pre-line;margin-bottom:14px"><b>Evidence discovered</b>\n'+clean(a.evidence)+'</div>':'')+'<p class="question">'+clean(a.prompt)+'</p>';if(run.done.includes(run.active)){body+='<div class="note success"><b>Evidence secured.</b> '+clean(run.message||a.feedback)+'</div>';}
 else if(a.kind==="order"){body+='<p style="font-size:12px;color:#5c7691">Rearrange the steps by dragging or using arrows.</p>'+run.order.map((x,i)=>'<div class="orderItem" draggable="true" data-order="'+i+'"><span>'+clean(a.options[x])+'</span><button data-move="'+i+'" data-dir="-1" aria-label="Move up">↑</button><button data-move="'+i+'" data-dir="1" aria-label="Move down">↓</button></div>').join("")+'<button class="btn dark" id="checkOrder">Check sequence</button>';}
 else {body+='<div class="choices">'+a.options.map((text,i)=>'<button class="choice" data-answer="'+i+'"><small>'+String.fromCharCode(65+i)+'</small>'+clean(text)+'</button>').join("")+'</div>'}
 if(run.message&&!run.showGood)body+='<div class="note error">'+clean(run.message)+'</div>';
 }
 let doneRoom=qs(r).every(x=>run.done.includes(x.idx));
 return '<div class="status"><div><span class="eyebrow">MISSION IN PROGRESS · '+(r+1)+' OF 3</span><h2>'+clean(q().title)+'</h2><p>'+clean(q().subtitle)+'</p></div><span class="pill">'+run.done.length+'/'+q().questions.length+' files · '+score()+'/'+total()+' points</span></div><div class="grid"><section class="panel"><div class="roomHead"><div><b>ESCAPE ENVIRONMENT</b><small>Inspect objects, collect evidence, unlock rooms</small></div><div class="roomnav">'+q().rooms.map((room,i)=>'<button data-room="'+i+'" class="'+(r===i?"active":"")+'" '+(roomReady(i)?"":"disabled")+'>'+String(i+1).padStart(2,"0")+'</button>').join("")+'</div></div>'+scene(r,false)+'</section><section class="panel side"><div class="sideTop"><span>CASE FILE '+(a?String(run.active+1).padStart(2,"0"):"· STANDBY")+'</span><h3>'+(a?clean(a.name):"Your next leadership challenge")+'</h3><p>'+(a?String(a.points||1)+" point · "+(a.kind==="order"?"Sequence puzzle":"Decision challenge"):"Select an object to open its evidence file.")+'</p></div><div class="sideBody">'+body+'</div><div class="sideFoot"><div class="progress">'+progressDots()+'</div><button class="btn primary" id="nextFile" '+(doneRoom?"":"disabled")+'>'+(r===2?"Finish mission":"Unlock next room →")+'</button></div></section></div><div class="meter"><div style="width:'+Math.round(100*run.done.length/q().questions.length)+'%"></div></div><div class="toolbar"><button class="btn small" id="restart">Restart</button><button class="btn small" id="newQuiz">Choose another quiz</button></div>';
}
function editInput(label,id,value,extra){return '<div class="formrow"><label for="'+id+'">'+label+'</label><input id="'+id+'" value="'+clean(value)+'" '+(extra||"")+'></div>'}
function editTextarea(label,id,value){return '<div class="formrow"><label for="'+id+'">'+label+'</label><textarea id="'+id+'">'+clean(value)+'</textarea></div>'}
function editor(){let a=q(),room=a.rooms[editingRoom],item=a.questions[editingQuestion];if(!item){editingQuestion=0;item=a.questions[0]}let options=item.options||[],choiceSelect=options.map((x,i)=>'<option value="'+i+'" '+(item.answer===i?"selected":"")+'>'+clean(String.fromCharCode(65+i)+" · "+x)+'</option>').join("");
 let qlist=a.questions.map((x,i)=>'<option value="'+i+'" '+(editingQuestion===i?"selected":"")+'>'+String(i+1).padStart(2,"0")+' · '+clean(x.name)+'</option>').join("");
 return '<div class="status"><div><span class="eyebrow">AUTHORING WORKSPACE · LOCAL DRAFT</span><h2>Edit Leadership 101 quizzes</h2><p>Change questions, feedback, backgrounds, and scene-object positions. Save locally or export JSON. Use Student Play to test your changes.</p></div><span class="pill">PREVIEW · NOT A SECURE LMS EDITOR</span></div><div class="toolbar"><button class="btn primary" id="saveDraft">Save draft</button><button class="btn dark" id="exportJson">Export project JSON</button><button class="btn" id="importJson">Import JSON</button><button class="btn warn" id="resetDraft">Restore original quizzes</button></div><div class="editor"><aside class="editPanel"><h3>Quiz settings</h3><div class="formrow"><label>Choose quiz</label><select id="editQuiz">'+projects.map((x,i)=>'<option value="'+i+'" '+(selected===i?"selected":"")+'>'+clean(x.title)+'</option>').join("")+'</select></div>'+editInput("Quiz title","editTitle",a.title)+editTextarea("Mission description","editSubtitle",a.subtitle)+'<h4>Room settings</h4><div class="formrow"><label>Room to edit</label><select id="editRoom">'+a.rooms.map((x,i)=>'<option value="'+i+'" '+(editingRoom===i?"selected":"")+'>'+clean(x.name)+'</option>').join("")+'</select></div>'+editInput("Room name","roomName",room.name)+editInput("Room subtitle","roomSubtitle",room.subtitle)+editTextarea("Room opening briefing","roomBriefing",room.briefing||"")+editInput("Background image URL","roomImage",room.image)+'<div class="toolbar"><button class="btn small" id="uploadScene">Upload background image</button></div><p class="editHint">Images are stored in this browser draft. Large uploads may fill browser storage; export a backup regularly.</p><div class="previewMini" style="background-image:linear-gradient(30deg,#15345166,#275e8766),url(&quot;'+clean(goodURL(room.image))+'&quot;)"></div></aside><section class="editPanel"><h3>Interactive puzzle editor</h3><div class="formrow"><label>Puzzle</label><select id="editQuestion">'+qlist+'</select></div><div class="row2">'+editInput("Object label","qName",item.name)+'<div class="formrow"><label>Object style</label><select id="qIcon">'+["document","folder","badge","terminal","lock"].map(x=>'<option '+(item.icon===x?"selected":"")+' value="'+x+'">'+x+'</option>').join("")+'</select></div></div><div class="row2"><div class="formrow"><label>Room</label><select id="qRoom">'+a.rooms.map((x,i)=>'<option value="'+i+'" '+(item.room===i?"selected":"")+'>'+clean(x.name)+'</option>').join("")+'</select></div><div class="formrow"><label>Puzzle format</label><select id="qKind"><option value="choice" '+(item.kind==="choice"?"selected":"")+'>Decision / choice</option><option value="order" '+(item.kind==="order"?"selected":"")+'>Drag / sequence</option></select></div></div>'+editTextarea("Evidence card (revealed before question)","qEvidence",item.evidence||"")+editTextarea("Leadership challenge","qPrompt",item.prompt)+editTextarea("Options (one per line)","qOptions",options.join("\n"))+(item.kind==="choice"?'<div class="formrow"><label>Correct option</label><select id="qAnswer">'+choiceSelect+'</select></div>':editTextarea("Correct sequence (one option per line)","qSequence",(item.answer||[]).map(i=>options[i]).join("\n")))+editTextarea("Correct-answer feedback","qFeedback",item.feedback)+'<div class="row2">'+editInput("Hotspot X (%)","qX",item.x,'type="number" min="4" max="96"')+editInput("Hotspot Y (%)","qY",item.y,'type="number" min="13" max="90"')+'</div><p class="editHint">Drag the object inside the room below to update its position. Tap Student Play to test questions and scoring.</p><div class="roomHead" style="margin-top:15px;border-radius:10px 10px 0 0"><b>DRAG OBJECTS TO POSITION</b><small>'+clean(a.rooms[editingRoom].name)+'</small></div>'+scene(editingRoom,true)+'</section></div><p class="footnote"><strong>Prototype limits:</strong> Authoring saves to this browser only; JSON export is your backup. Do not use the score as an official graded result before secure function start(i){selected=i;resetRun();run.started=true;render()}
function solve(correct){let idx=run.active,item=q().questions[idx];run.attempts[idx]=(run.attempts[idx]||0)+1;if(correct){run.done.push(idx);if(run.attempts[idx]===1)run.first[idx]=Number(item.points)||1;run.message=item.feedback;run.showGood=true}else{run.message="That answer does not fit the evidence. Reconsider the leadership principle and try again.";run.showGood=false}render()}
function moveOrder(i,delta){let j=i+delta;if(j<0||j>=run.order.length)return;[run.order[i],run.order[j]]=[run.order[j],run.order[i]];render()}
function selectedPuzzle(idx){run.active=idx;run.message="";run.showGood=false;let item=q().questions[idx];run.order=item.options.map((_,i)=>i);if(item.kind==="order")run.order=run.order.reverse();render()}
function nextRoom(){if(!qs(run.room).every(x=>run.done.includes(x.idx)))return;if(run.room===2){run.finished=true}else{run.room++;run.active=-1;run.message="";}render()}
function finishReport(){return q().title+"\nCompletion: "+new Date().toLocaleString()+"\nFirst attempt score: "+score()+"/"+total()+"\nLearning use only - not authenticated or submitted to LMS."}
function download(name,body,type){let blob=new Blob([body],{type:type||"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function update(field,value){q()[field]=value;persist()}
function setQuestion(field,value){q().questions[editingQuestion][field]=value;persist()}
function setRoomField(field,value){q().rooms[editingRoom][field]=value;persist()}
function normalizeImported(v){if(!Array.isArray(v)||v.length<2||v.length>4||v.some(p=>!p||typeof p.title!=="string"||!Array.isArray(p.rooms)||p.rooms.length!==3||!Array.isArray(p.questions)||p.questions.length!==10))throw Error("The file must contain two to four quizzes, each with 3 rooms and 10 questions.");v=DEFAULTS.map(seed=>v.find(imported=>imported.id===seed.id)||clone(seed));for(let p of v){for(let r of p.rooms){r.name=String(r.name||"Room").slice(0,110);r.subtitle=String(r.subtitle||"").slice(0,180);r.briefing=String(r.briefing||"").slice(0,1200);r.image=goodURL(r.image)}for(let x of p.questions){if(!["choice","order"].includes(x.kind)||!Array.isArray(x.options)||x.options.length<2||x.options.length>10)throw Error("A puzzle has an unsupported format or number of options.");if(!Number.isInteger(Number(x.room))||Number(x.room)<0||Number(x.room)>2)throw Error("A puzzle has an invalid room.");x.name=String(x.name||"Puzzle").slice(0,160);x.prompt=String(x.prompt||"").slice(0,1400);x.evidence=String(x.evidence||"").slice(0,1200);x.feedback=String(x.feedback||"").slice(0,800);x.options=x.options.map(a=>String(a).slice(0,400));x.icon=["document","folder","badge","terminal","lock"].includes(x.icon)?x.icon:"document";x.points=1;x.x=Math.max(4,Math.min(96,Number(x.x)||50));x.y=Math.max(13,Math.min(90,Number(x.y)||55));if(x.kind==="choice"){x.answer=Number(x.answer);if(!Number.isInteger(x.answer)||x.answer<0||x.answer>=x.options.length)throw Error("Invalid correct choice.");}else{if(!Array.isArray(x.answer)||x.answer.length!==x.options.length||new Set(x.answer).size!==x.options.length||x.answer.some(i=>!Number.isInteger(i)||i<0||i>=x.options.length))throw Error("Invalid sequence answer.");}}}return v}
function imageUpload(f){if(!f||!/^image\/(png|jpeg|webp)$/.test(f.type))return alert("Choose a PNG, JPG, or WebP image.");const rdr=new FileReader();rdr.onload=()=>{const img=new Image();img.onload=()=>{const ratio=Math.min(1,1600/img.width,1000/img.height),c=document.createElement("canvas");c.width=Math.round(img.width*ratio);c.height=Math.round(img.height*ratio);c.getContext("2d").drawImage(img,0,0,c.width,c.height);setRoomField("image",c.toDataURL("image/webp",.74));render()};img.src=rdr.result};rdr.readAsDataURL(f)}
document.addEventListener("click",e=>{
 let b=e.target.closest("button");if(!b)return;
 if(b.id==="tabPlay"){setMode("play");return}if(b.id==="tabEdit"){setMode("edit");return}if(b.id==="goBack"){location.href="/create.html";return}
 if(b.dataset.pick!==undefined){start(Number(b.dataset.pick));return}
 if(b.dataset.room!==undefined){let r=Number(b.dataset.room);if(roomReady(r)){run.room=r;run.active=-1;run.message="";render()}return}
 if(b.classList.contains("hotspot")){if(mode==="play"){selectedPuzzle(Number(b.dataset.idx));}else{editingQuestion=Number(b.dataset.idx);editingRoom=q().questions[editingQuestion].room;render()}return}
 if(b.dataset.answer!==undefined){solve(Number(b.dataset.answer)===Number(q().questions[run.active].answer));return}
 if(b.dataset.move!==undefined){moveOrder(Number(b.dataset.move),Number(b.dataset.dir));return}
 if(b.id==="checkOrder"){let x=q().questions[run.active];solve(x.answer.every((v,i)=>run.order[i]===v));return}
 if(b.id==="nextFile"){nextRoom();return}
 if(b.id==="restart"){resetRun();run.started=true;render();return}
 if(b.id==="newQuiz"){resetRun();render();return}
 if(b.id==="copyResults"){navigator.clipboard?.writeText(finishReport()).then(()=>alert("Learning result copied."),()=>download("leadership-quiz-result.txt",finishReport(),"text/plain"));return}
 if(b.id==="saveDraft"){if(persist())alert("Draft saved in this browser. Export a JSON backup to move devices.");return}
 if(b.id==="exportJson"){download("leadership-101-quizzes.json",JSON.stringify(projects,null,2));return}
 if(b.id==="importJson"){$("#jsonUpload").click();return}
 if(b.id==="resetDraft"){if(confirm("Restore both quizzes to their original versions? This overwrites edits saved in this browser.")){projects=clone(DEFAULTS);selected=0;editingRoom=0;editingQuestion=0;persist();render()}return}
 if(b.id==="uploadScene"){$("#sceneUpload").click();return}
});
document.addEventListener("change",e=>{
 let t=e.target;if(t.id==="jsonUpload"){let f=t.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{projects=normalizeImported(JSON.parse(rd.result));persist();selected=0;editingRoom=0;editingQuestion=0;render();alert("Project imported into this browser.")}catch(err){alert("Import failed: "+err.message)}};rd.readAsText(f);t.value="";return}
 if(t.id==="sceneUpload"){imageUpload(t.files?.[0]);t.value="";return}
 if(t.id==="editQuiz"){selected=Number(t.value);editingRoom=0;editingQuestion=0;render();return}
 if(t.id==="editRoom"){editingRoom=Number(t.value);render();return}
 if(t.id==="editQuestion"){editingQuestion=Number(t.value);editingRoom=q().questions[editingQuestion].room;render();return}
 let set={editTitle:()=>update("title",t.value),editSubtitle:()=>update("subtitle",t.value),roomName:()=>setRoomField("name",t.value),roomSubtitle:()=>setRoomField("subtitle",t.value),roomBriefing:()=>setRoomField("briefing",t.value),roomImage:()=>setRoomField("image",goodURL(t.value)),qName:()=>setQuestion("name",t.value),qIcon:()=>setQuestion("icon",t.value),qRoom:()=>{setQuestion("room",Number(t.value));editingRoom=Number(t.value)},qKind:()=>{let x=q().questions[editingQuestion];x.kind=t.value;x.answer=t.value==="choice"?0:x.options.map((_,i)=>i);persist()},qEvidence:()=>setQuestion("evidence",t.value),qPrompt:()=>setQuestion("prompt",t.value),qOptions:()=>{let x=q().questions[editingQuestion];x.options=t.value.split("\n").map(a=>a.trim()).filter(Boolean);x.answer=x.kind==="choice"?0:x.options.map((_,i)=>i);persist()},qAnswer:()=>setQuestion("answer",Number(t.value)),qSequence:()=>{let x=q().questions[editingQuestion],lines=t.value.split("\n").map(s=>s.trim()).filter(Boolean);let order=lines.map(l=>x.options.indexOf(l));if(order.length!==x.options.length||order.includes(-1)||new Set(order).size!==order.length){alert("The correct sequence must list every option exactly once.");return}setQuestion("answer",order)},qFeedback:()=>setQuestion("feedback",t.value),qX:()=>setQuestion("x",Math.max(4,Math.min(96,Number(t.value)||50))),qY:()=>setQuestion("y",Math.max(13,Math.min(90,Number(t.value)||55)))};if(set[t.id]){set[t.id]();render()}
});
document.addEventListener("dragstart",e=>{let el=e.target.closest(".orderItem");if(el){dragIndex=Number(el.dataset.order);e.dataTransfer.effectAllowed="move"}});
document.addEventListener("dragover",e=>{if(e.target.closest(".orderItem"))e.preventDefault()});
document.addEventListener("drop",e=>{let el=e.target.closest(".orderItem");if(el&&dragIndex>=0){e.preventDefault();let n=Number(el.dataset.order),v=run.order.splice(dragIndex,1)[0];run.order.splice(n,0,v);dragIndex=-1;render()}});
let moving=null;
document.addEventListener("pointerdown",e=>{let el=e.target.closest(".hotspot.editing");if(mode!=="edit"||!el)return;moving={el,idx:Number(el.dataset.idx),startX:e.clientX,startY:e.clientY,moved:false};el.setPointerCapture?.(e.pointerId)});
document.addEventListener("pointermove",e=>{if(!moving)return;let sceneEl=moving.el.closest(".scene");if(!sceneEl)return;let box=sceneEl.getBoundingClientRect(),x=Math.max(4,Math.min(96,100*(e.clientX-box.left)/box.width)),y=Math.max(13,Math.min(90,100*(e.clientY-box.top)/box.height));moving.el.style.left=x+"%";moving.el.style.top=y+"%";if(Math.abs(e.clientX-moving.startX)+Math.abs(e.clientY-moving.startY)>5)moving.moved=true;moving.x=x;moving.y=y});
document.addEventListener("pointerup",()=>{if(!moving)return;if(moving.moved){let item=q().questions[moving.idx];item.x=Math.round(moving.x);item.y=Math.round(moving.y);persist()}moving=null});
resetRun();if(mode==="play"&&new URLSearchParams(location.search).get("mission")===q().id)run.started=true;render();
</script></body></html>
