<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
  <title>Organizer | Sign-Up Studio</title>
  <link rel="stylesheet" href="/assets/signup-studio/studio.css">
  <script type="module" src="/assets/signup-studio/organizer.js"></script>
</head>
<body>
  <a class="skip" href="#workspace">Skip to editor</a>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span> Sign-Up Studio</span>
      <span class="topbar-tag">Organizer workspace</span>
    </div>
  </header>
  <main class="workspace" id="workspace">
    <aside class="rail" aria-label="Saved sheets">
      <div class="rail-heading"><h2>Your sheets</h2><button id="new-sheet" type="button" class="quiet">+ New sheet</button></div>
      <div id="sheets"><p class="muted">Loading sheets…</p></div>
      <div id="workspace-tools"></div>
    </aside>
    <div class="editor">
      <div class="editor-heading">
        <p class="eyebrow">Organizer workspace</p>
        <h1 id="title">Create a sign-up</h1>
        <p id="intro" class="muted">Add event details and slots. Publish when you’re ready to share.</p>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="editor"></div>
    </div>
  </main>
  <dialog id="preview-dialog" aria-labelledby="preview-label">
    <div class="dialog-bar"><strong id="preview-label">Participant preview</strong><form method="dialog"><button class="quiet">Close preview</button></form></div>
    <div id="preview-content"></div>
  </dialog>
  <noscript><p class="wrap">Turn on JavaScript to create and manage sign-up sheets.</p></noscript>
</body>
</html>
