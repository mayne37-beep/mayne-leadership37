<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102b4b">
<title>Live Response | Mayne Leadership</title>
<style>
:root{--navy:#102b4b;--blue:#2767a4;--gold:#e1af4f;--ink:#18344f;--muted:#687d90;--line:#d9e5ee;--bg:#f4f8fc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Arial,sans-serif}.wrap{max-width:620px;margin:0 auto;padding:22px}.brand{text-align:center;color:var(--navy);font-size:13px;font-weight:800;letter-spacing:.1em;margin:12px 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 38px rgba(16,43,75,.08)}h1{font-size:28px;margin:0 0 8px;color:var(--navy)}p{color:var(--muted)}.input{width:100%;padding:14px;border:1.5px solid #c8d8e5;border-radius:10px;font:inherit;color:var(--ink);background:#fff}.btn{width:100%;margin-top:14px;border:0;border-radius:10px;padding:14px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55}.status{min-height:20px;margin-top:10px;font-size:13px;color:var(--muted)}.status.error{color:#a33}.session{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}.question{font-size:23px;font-weight:800;color:var(--navy);margin:18px 0}.options{display:grid;gap:9px}.option{width:100%;padding:14px;text-align:left;border:2px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font-weight:700;font-size:15px}.option.selected{border-color:var(--gold);background:#fff9ec}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.scale .option{text-align:center;font-size:20px}.ends{display:flex;justify-content:space-between;gap:10px;margin-top:7px;color:var(--muted);font-size:12px}.rank{display:grid;gap:8px}.rankrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px}.rankrow select{padding:8px;border:1px solid var(--line);border-radius:7px}.sortable{display:grid;gap:9px}.sortitem{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;touch-action:none;cursor:grab;font-weight:700}.sortitem.dragging{opacity:.5;border-color:var(--gold)}.handle{font-size:22px;color:var(--muted);letter-spacing:-3px}.position{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-size:13px;font-weight:800}.done{text-align:center;padding:20px 4px}.done h1{margin-bottom:8px}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
 <div class="brand">MAYNE LEADERSHIP · PRESENTER STUDIO</div>
 <div class="card" id="app">
  <h1>Join a live activity</h1>
  <p>Enter the 6-digit session code shown by your instructor.</p>
  <input class="input" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Session code">
  <button class="btn" id="joinBtn" type="button">Join activity</button>
  <div class="status" id="status"></div>
 </div>
</div>
<script>
(function(){
 var SUPABASE_URL='https://vteamreihsunsllwcphw.supabase.co';
 var API_KEY='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud';
 var app=document.getElementById('app');
 var session=null, selected=null;
 function escapeHtml(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
 function randomId(){return Date.now().toString(36)+'-'+Math.random().toString(36).substring(2,12)}
 function participantId(){try{var p=localStorage.getItem('presenter_pid');if(!p){p=randomId();localStorage.setItem('presenter_pid',p)}return p}catch(e){return randomId()}}
 var pid=participantId();
 function countKey(){return 'presenter_count_'+session.id}
 function used(){try{return Number(localStorage.getItem(countKey())||0)}catch(e){return 0}}
 function setUsed(n){try{localStorage.setItem(countKey(),String(n))}catch(e){}}
 function request(path,method,payload){
  var opts={method:method||'GET',headers:{'apikey':API_KEY,'Content-Type':'application/json','Prefer':'return=representation'}};
  if(payload!==undefined)opts.body=JSON.stringify(payload);
  return fetch(SUPABASE_URL+'/rest/v1/'+path,opts).then(function(res){
   return res.text().then(function(txt){if(!res.ok)throw new Error('Request failed ('+res.status+')');return txt?JSON.parse(txt):[]});
  });
 }
 function status(msg,error){var el=document.getElementById('status');if(el){el.textContent=msg||'';el.className='status'+(error?' error':'')}}
 function join(code){
  code=String(code||'').replace(/[^0-9]/g,'').substring(0,6);
  if(code.length!==6){status('Enter the 6-digit session code.',true);return}
  var b=document.getElementById('joinBtn');if(b)b.disabled=true;
  status('Joining activity…',false);
  request('presenter_sessions?code=eq.'+encodeURIComponent(code)+'&is_open=eq.true&select=*').then(function(rows){
   if(!rows||!rows.length){status('That session is not open. Check the code and try again.',true);if(b)b.disabled=false;return}
   session=rows[0];renderActivity();
  }).catch(function(err){status('Unable to connect to this session. '+err.message,true);if(b)b.disabled=false});
 }
 function renderActivity(){
  selected=null;var cfg=session.config||{},html='<div class="session">LIVE SESSION · '+escapeHtml(session.code)+'</div><div class="question">'+escapeHtml(session.question||'Respond to the prompt')+'</div>';
  var i,items;
  if(session.activity_type==='poll'){
   items=cfg.options||[];html+='<div class="options">';for(i=0;i<items.length;i++)html+='<button type="button" class="option choice" data-value="'+i+'">'+escapeHtml(items[i])+'</button>';html+='</div>';
  }else if(session.activity_type==='rating'||session.activity_type==='agreement'){
   html+='<div class="scale">';for(i=1;i<=5;i++)html+='<button type="button" class="option choice" data-value="'+i+'">'+i+'</button>';html+='</div>';
   var left='',right='';if(session.activity_type==='rating'){left=cfg.low||'';right=cfg.high||''}else{items=cfg.labels||[];left=items[0]||'';right=items[2]||''}
   html+='<div class="ends"><span>'+escapeHtml(left)+'</span><span>'+escapeHtml(right)+'</span></div>';
  }else if(session.activity_type==='rank'){
   items=cfg.items||[];html+='<div class="small" style="margin-bottom:9px">Drag the choices into your preferred order. Top = highest priority.</div><div class="sortable" id="rankList">';for(i=0;i<items.length;i++){html+='<div class="sortitem" draggable="true" data-index="'+i+'"><span class="position">'+(i+1)+'</span><span class="handle">☰</span><strong>'+escapeHtml(items[i])+'</strong></div>'}html+='</div>';
  }else if(session.activity_type==='wordcloud'){
   var wcLimit=Number(cfg.responseLimit||1),wcFields=wcLimit>=99?10:wcLimit;
   html+='<div class="options">';for(i=0;i<wcFields;i++)html+='<input class="input wordResponse" maxlength="80" autocomplete="off" placeholder="Word or phrase '+(i+1)+'">';html+='</div><div class="small" style="margin-top:8px">Enter up to '+wcFields+' words or short phrases, then submit them together.</div>';
  }else{
   html+='<input class="input" id="textResponse" maxlength="160" autocomplete="off" placeholder="Type your response">';
  }
  html+='<button type="button" class="btn" id="submitBtn">Submit response</button><div class="status" id="status"></div>';
  app.innerHTML=html;
  var choices=app.querySelectorAll('.choice');for(i=0;i<choices.length;i++){choices[i].onclick=function(){selected=this.getAttribute('data-value');var all=app.querySelectorAll('.choice');for(var j=0;j<all.length;j++)all[j].className='option choice';this.className='option choice selected'}}
  if(session.activity_type==='rank')initRanking();
  document.getElementById('submitBtn').onclick=submit;
 }
 function initRanking(){
  var list=document.getElementById('rankList');if(!list)return;var dragged=null,touchItem=null,startY=0;
  function renumber(){var a=list.querySelectorAll('.sortitem');for(var i=0;i<a.length;i++)a[i].querySelector('.position').textContent=i+1}
  function moveBefore(item,y){var a=list.querySelectorAll('.sortitem:not(.dragging)'),target=null;for(var i=0;i<a.length;i++){var r=a[i].getBoundingClientRect();if(y<r.top+r.height/2){target=a[i];break}}if(target)list.insertBefore(item,target);else list.appendChild(item);renumber()}
  var a=list.querySelectorAll('.sortitem');for(var i=0;i<a.length;i++){
   a[i].ondragstart=function(){dragged=this;this.classList.add('dragging')};
   a[i].ondragend=function(){this.classList.remove('dragging');dragged=null;renumber()};
   a[i].ondragover=function(e){e.preventDefault();if(dragged)moveBefore(dragged,e.clientY)};
   a[i].ontouchstart=function(e){touchItem=this;startY=e.touches[0].clientY;this.classList.add('dragging')};
   a[i].ontouchmove=function(e){if(!touchItem)return;e.preventDefault();moveBefore(touchItem,e.touches[0].clientY)};
   a[i].ontouchend=function(){if(touchItem)touchItem.classList.remove('dragging');touchItem=null;renumber()};
  }
 }
 function submit(){
  var cfg=session.config||{},limit=Number(cfg.responseLimit||1),value=selected;
  if(limit<99&&used()>=limit){status('You have already submitted the maximum number of responses.',true);return}
  if(session.activity_type==='wordcloud'){var inputs=app.querySelectorAll('.wordResponse'),words=[];for(var wi=0;wi<inputs.length;wi++){var w=inputs[wi].value.replace(/^\s+|\s+$/g,'');if(w)words.push(w)}value=words}else if(session.activity_type==='open'){var input=document.getElementById('textResponse');value=input?input.value.replace(/^\s+|\s+$/g,''):''}
  if(session.activity_type==='rank'){var ranked=app.querySelectorAll('#rankList .sortitem');value=[];for(var i=0;i<ranked.length;i++)value.push(Number(ranked[i].getAttribute('data-index')))}
  if(value===null||value===undefined||value===''||(Object.prototype.toString.call(value)==='[object Array]'&&value.length===0)){status('Choose or enter a response first.',true);return}
  var b=document.getElementById('submitBtn');b.disabled=true;status('Submitting…',false);
  var payload;if(session.activity_type==='wordcloud'){payload=[];for(var pi=0;pi<value.length;pi++)payload.push({session_id:session.id,participant_id:pid+'-'+randomId(),response:{value:value[pi]}})}else{payload={session_id:session.id,participant_id:pid+'-'+randomId(),response:{value:value}}}
  request('presenter_responses','POST',payload).then(function(){
   var added=session.activity_type==='wordcloud'?value.length:1;var now=used()+added;setUsed(now);var remaining=limit>=99?99:Math.max(0,limit-now);
   app.innerHTML='<div class="done"><h1>Response submitted</h1><p>Your response has been sent to the presentation.</p><div class="small">'+(limit>=99?'Additional responses are allowed.':remaining+' response(s) remaining.')+'</div>'+(limit>=99||remaining>0?'<button type="button" class="btn" id="againBtn">Submit another response</button>':'')+'</div>';
   var again=document.getElementById('againBtn');if(again)again.onclick=renderActivity;
  }).catch(function(err){b.disabled=false;status('Unable to submit. '+err.message,true)});
 }
 var joinBtn=document.getElementById('joinBtn'),codeInput=document.getElementById('code');
 joinBtn.onclick=function(){join(codeInput.value)};
 codeInput.onkeydown=function(e){if((e&&e.key==='Enter')||(e&&e.keyCode===13))join(codeInput.value)};
 var match=window.location.search.match(/[?&]code=([0-9]{6})/);
 if(match&&match[1]){codeInput.value=match[1];join(match[1])}
})();
</script>
</body>
</html>
