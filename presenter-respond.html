<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b4b"><title>Respond | Presenter Studio</title><style>:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--line:#d8e4ee}*{box-sizing:border-box}body{margin:0;background:#f3f8fd;color:var(--n);font:16px/1.45 Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px}.brand{text-align:center;font-weight:950;letter-spacing:.08em;margin:15px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 16px 40px #17395a14}h1{font-size:30px;margin:0 0 8px}.code{color:#66798b;font-size:13px}.q{font-size:23px;font-weight:900;margin:24px 0 16px}.options{display:grid;gap:10px}.opt{border:2px solid var(--line);background:#fff;border-radius:13px;padding:16px;text-align:left;font-weight:800;color:var(--n)}.opt.sel{border-color:var(--g);background:#fff8e8}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.scale button{font-size:23px;text-align:center}.input{width:100%;border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit}.submit{width:100%;margin-top:16px;border:0;background:var(--b);color:#fff;border-radius:12px;padding:14px;font-weight:900}.done{text-align:center;padding:30px 10px}.done b{display:block;font-size:26px;margin-bottom:8px}.rank{display:grid;gap:8px}.rankrow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}.rankrow select{padding:8px;border:1px solid var(--line);border-radius:8px}</style></head><body><div class="wrap"><div class="brand">MAYNE LEADERSHIP · PRESENTER STUDIO</div><div class="card" id="app"><h1>Join a live activity</h1><p>Enter the 6-digit code shown by your instructor.</p><input class="input" id="code" inputmode="numeric" maxlength="6" placeholder="Session code"><button type="button" class="submit" id="join">Join activity</button><div id="joinStatus" style="margin-top:10px;font-size:13px;color:#66798b"></div></div></div><script>(()=>{const SB='https://vteamreihsunsllwcphw.supabase.co',KEY='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',app=document.getElementById('app');let s=null,val=null;let pid=localStorage.getItem('presenter_pid')||crypto.randomUUID();localStorage.setItem('presenter_pid',pid);function countKey(){return 'presenter_count_'+s.id}function used(){return +(localStorage.getItem(countKey())||0)}async function api(path,opt={}){opt.headers=Object.assign({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},opt.headers||{});let r=await fetch(SB+'/rest/v1/'+path,opt);if(!r.ok)throw new Error(await r.text());let t=await r.text();return t?JSON.parse(t):[]}async function join(code){code=String(code||'').replace(/\D/g,'').slice(0,6);let st=document.getElementById('joinStatus');if(code.length!==6){if(st)st.textContent='Enter the 6-digit code shown on screen.';return}if(st)st.textContent='Joining…';try{let rows=await api('presenter_sessions?code=eq.'+encodeURIComponent(code)+'&is_open=eq.true&select=*');if(!rows.length){if(st)st.textContent='That session is not open. Check the code and try again.';return}s=rows[0];draw()}catch(e){console.error(e);if(st)st.textContent='Could not join the activity. Please try again.'}}function draw(){let cfg=s.config||{},body='';if(s.activity_type==='poll'){body='<div class="options">'+(cfg.options||[]).map((x,i)=>'<button class="opt" data-v="'+i+'">'+esc(x)+'</button>').join('')+'</div>'}else if(s.activity_type==='rating'){body='<div class="scale">'+[1,2,3,4,5].map(x=>'<button class="opt" data-v="'+x+'">'+x+'</button>').join('')+'</div><div style="display:flex;justify-content:space-between;margin-top:8px"><small>'+esc(cfg.low||'')+'</small><small>'+esc(cfg.high||'')+'</small></div>'}else if(s.activity_type==='agreement'){body='<div class="scale">'+[1,2,3,4,5].map(x=>'<button class="opt" data-v="'+x+'">'+x+'</button>').join('')+'</div><div style="display:flex;justify-content:space-between;margin-top:8px"><small>'+esc((cfg.labels||[])[0]||'')+'</small><small>'+esc((cfg.labels||[])[2]||'')+'</small></div>'}else if(s.activity_type==='rank'){body='<div class="rank">'+(cfg.items||[]).map((x,i)=>'<div class="rankrow"><select data-rank="'+i+'">'+[1,2,3,4].map(n=>'<option value="'+n+'">'+n+'</option>').join('')+'</select><b>'+esc(x)+'</b></div>').join('')+'</div><small>1 = highest priority</small>'}else body='<input class="input" id="textval" placeholder="'+(s.activity_type==='wordcloud'?'One word or short phrase':'Type your response')+'">';app.innerHTML='<div class="code">LIVE SESSION · '+s.code+'</div><div class="q">'+esc(s.question)+'</div>'+body+'<button class="submit" id="send">Submit response</button>';app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{val=b.dataset.v;app.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('sel',x===b))});document.getElementById('send').onclick=send}async function send(){let limit=+(s.config?.responseLimit||1);if(limit<99&&used()>=limit){alert('You have already submitted the maximum number of responses for this activity.');return}if(s.activity_type==='rank'){let a=[...app.querySelectorAll('[data-rank]')].map((x,i)=>({i,n:+x.value})).sort((a,b)=>a.n-b.n).map(x=>x.i);val=a}else if(s.activity_type==='wordcloud'||s.activity_type==='open')val=(document.getElementById('textval').value||'').trim();if(val===null||val===''){alert('Choose or enter a response first.');return}let submissionId=pid+'-'+crypto.randomUUID();await api('presenter_responses',{method:'POST',body:JSON.stringify({session_id:s.id,participant_id:submissionId,response:{value:val}})});localStorage.setItem(countKey(),String(used()+1));let left=limit>=99?'More responses are allowed.':Math.max(0,limit-used())+' response(s) remaining.';app.innerHTML='<div class="done"><b>Response submitted.</b><span>Your instructor will see the updated results.</span><br><small>'+left+'</small><br><br>'+(limit>=99||used()<limit?'<button class="submit" id="edit">Submit another response</button>':'')</div>';let ed=document.getElementById('edit');if(ed)ed.onclick=()=>{val=null;draw()}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('join').addEventListener('click',()=>join(document.getElementById('code').value));document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')join(e.target.value)});let q=new URLSearchParams(location.search).get('code');if(q){document.getElementById('code').value=q;join(q)}})();</script></body></html>
