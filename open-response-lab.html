<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open Response Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:34px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 28px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.bars,.wall,.rank{width:min(900px,94%);display:grid;gap:12px}.barrow{background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:13px}.barhead{display:flex;justify-content:space-between;font-weight:800}.track{height:16px;background:#ffffff18;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e1af4f,#f3d18a);border-radius:20px;transition:width .45s}.cloud{width:min(950px,94%);min-height:430px;background:#fff;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:12px 20px;color:var(--n)}.word{font-weight:900}.rating{display:flex;gap:12px;align-items:flex-end;height:390px;width:min(850px,94%);border-bottom:2px solid #fff8}.col{flex:1;text-align:center}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:4px;transition:height .45s}.num{font-size:20px;font-weight:900;margin-top:8px}.cards{width:min(1000px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;color:var(--n);padding:18px;border-radius:14px;min-height:110px;box-shadow:0 8px 20px #0003}.agree{width:min(900px,94%)}.agreebar{height:34px;border-radius:20px;background:linear-gradient(90deg,#c35a54,#e1af4f,#4a9b73);position:relative}.marker{position:absolute;top:-8px;width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid var(--g);transform:translateX(-50%)}.ends{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}.rankitem{display:flex;gap:14px;align-items:center;background:#fff;color:var(--n);padding:16px;border-radius:13px}.ranknum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-weight:900}.score{margin-left:auto;font-weight:900;color:var(--b)}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center}.livejoin{display:none;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:7px 11px}.livejoin img{width:60px;height:60px;background:#fff;padding:3px;border-radius:6px}.livejoin b{font-size:22px;letter-spacing:.08em}.ideaWall{width:min(1100px,97%);display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}.idea{position:relative;background:#fff;color:var(--n);padding:20px 18px 16px;border-radius:15px;min-height:120px;box-shadow:0 8px 20px #0003;animation:pop .35s ease;cursor:pointer;transition:transform .3s,opacity .3s,box-shadow .3s}.idea:hover{transform:translateY(-3px)}.idea.pinned{box-shadow:0 0 0 3px var(--g),0 10px 25px #0004}.idea.dim{opacity:.22}.idea .tag{font-size:10px;font-weight:900;color:#9a6b16;letter-spacing:.08em;margin-bottom:8px}.idea .text{font-size:17px;font-weight:700}.idea .actions{display:flex;gap:6px;margin-top:14px}.idea .actions button{border:1px solid #d6e0e8;background:#f7fafc;border-radius:7px;padding:5px 7px;font-size:11px;cursor:pointer}.spotlight{width:min(1000px,95%);background:#fff;color:var(--n);border:4px solid var(--g);border-radius:22px;padding:45px;text-align:center;font-size:clamp(25px,3vw,44px);font-weight:800;box-shadow:0 14px 40px #0005}.mask{padding:100px 20px;text-align:center;font-size:25px;font-weight:900;color:#dceafa}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 40px}.projecting .question{font-size:clamp(34px,4vw,64px)}.projecting .ideaWall{width:min(1500px,97%);grid-template-columns:repeat(4,1fr)}.projecting .livejoin{display:flex}.projecting .actions{display:none}.exitproj{display:none}.projecting .exitproj{display:block;position:fixed;right:15px;bottom:15px;width:auto;z-index:20;opacity:.18}@media(max-width:850px){.ideaWall{grid-template-columns:1fr 1fr}}
</style></head><body><header><div style="color:#f2cb78;font-size:12px;font-weight:900">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>☰ Open Response</h1><div class="sub">Independent activity lab · live student responses</div></header><div class="layout"><aside class="panel">
<label>Question / Prompt</label><textarea id="q">What should we consider?</textarea><label>Responses per student</label><select id="limit"><option>1</option><option>2</option><option>3</option><option>5</option></select>
<label>Display</label><select id="display"><option value="wall">Idea Wall</option><option value="newest">Newest First</option></select><button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button><div class="livecontrols" id="controls"><div class="statuspill" id="status">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reveal">Reveal responses</button><button class="btn alt" id="clearSpot">Clear spotlight</button><button class="btn alt" id="reset">Reset wall</button><button class="btn alt" id="copy">Copy join link</button></div>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div>
</aside><main class="panel"><div class="stage"><div class="projectbar"><b>MAYNE LEADERSHIP · LIVE</b><div class="livejoin" id="livejoin"><img id="qr"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"></div><div class="count" id="count">0 responses</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],paused=false,revealed=false,resetAt=null,projecting=false,pinned=new Set(),hidden=new Set(),spotlight=null;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function esc(x){var d=document.createElement('div');d.textContent=x;return d.innerHTML}function cfg(){return {responseLimit:Number($('limit').value)}}function active(){return (resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows).filter((r,i)=>!hidden.has(r.id||i))}
function draw(){$('showQ').textContent=$('q').value;var ar=active();if(!revealed){$('viz').innerHTML='<div class="mask">'+(ar.length?ar.length+' response'+(ar.length===1?'':'s')+' received':'Waiting for responses…')+'<br><small>Ideas are being collected privately until you reveal them.</small></div>'}else if(spotlight){$('viz').innerHTML='<div class="spotlight"><div style="font-size:12px;color:#9a6b16;letter-spacing:.12em;margin-bottom:15px">SPOTLIGHT RESPONSE</div>'+esc(spotlight)+'</div>'}else{var list=ar.slice();if($('display').value==='newest')list.reverse();list.sort((a,b)=>(pinned.has(b.id)?1:0)-(pinned.has(a.id)?1:0));$('viz').innerHTML='<div class="ideaWall">'+(list.map((r,i)=>{var id=r.id||String(i),val=String(r.response.value||'');return '<div class="idea '+(pinned.has(id)?'pinned':'')+'" data-id="'+id+'"><div class="tag">'+(pinned.has(id)?'★ PINNED':'RESPONSE')+'</div><div class="text">'+esc(val)+'</div><div class="actions"><button data-act="spot">Spotlight</button><button data-act="pin">'+(pinned.has(id)?'Unpin':'Pin')+'</button><button data-act="hide">Hide</button></div></div>'}).join('')||'<div class="mask">Waiting for responses…</div>')+'</div>';document.querySelectorAll('.idea').forEach(card=>card.querySelectorAll('button').forEach(b=>b.onclick=function(ev){ev.stopPropagation();var id=card.dataset.id,r=rows.find((x,j)=>(x.id||String(j))===id);if(this.dataset.act==='spot'&&r){spotlight=String(r.response.value||'');draw()}if(this.dataset.act==='pin'){pinned.has(id)?pinned.delete(id):pinned.add(id);draw()}if(this.dataset.act==='hide'){hidden.add(id);draw()}}))}$('count').textContent=ar.length+' visible response'+(ar.length===1?'':'s')+' · '+rows.length+' collected'}
document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);
function project(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=()=>project(!projecting);$('exitproj').onclick=()=>project(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'open',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('join').style.display='block';$('livejoin').style.display='flex';$('controls').style.display='grid';revealed=false;paused=false;resetAt=null;pinned.clear();hidden.clear();spotlight=null;$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500);draw()}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=id,response,created_at&order=created_at.asc');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('status').textContent=paused?'● Responses paused':'● Accepting responses';this.textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused}};
$('reveal').onclick=function(){revealed=!revealed;this.textContent=revealed?'Hide responses':'Reveal responses';draw()};$('clearSpot').onclick=function(){spotlight=null;draw()};$('reset').onclick=function(){if(session&&confirm('Reset the visible wall and begin with new responses?')){resetAt=new Date();pinned.clear();hidden.clear();spotlight=null;rows=[];revealed=false;$('reveal').textContent='Reveal responses';draw()}};$('copy').onclick=function(){if($('link').href)navigator.clipboard.writeText($('link').href).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy join link',1200)})};
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('controls').style.display='none'};draw()})();</script></body></html>
