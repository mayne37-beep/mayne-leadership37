<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilitator Access | Mayne Leadership</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px Arial,sans-serif;background:linear-gradient(130deg,#112f55,#326b9f);color:#1a3656}.card{width:min(420px,90vw);background:white;padding:34px;border-radius:20px;box-shadow:0 22px 55px #071b3b60}h1{margin:0 0 8px}p{line-height:1.5;color:#5b6f88}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #b5c8de;border-radius:10px;font-size:20px;letter-spacing:.3em}button{width:100%;margin-top:15px;padding:14px;background:#205d95;color:white;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}.error{color:#a62439;min-height:1.4em}a{color:#25669c}</style></head><body><main class="card"><h1>🔒 Facilitator Access</h1><p>World in Balance · Instructor console</p><form id="form"><label for="pin">Enter facilitator PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus required><button>Open Facilitator Console →</button><div class="error" id="error" role="alert"></div></form><p><a href="simulations.html">← Back to simulations</a></p></main><script>document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pin').value==='3737'){sessionStorage.setItem('ml-world-in-balance-facilitator-pin','3737');location.href='world-in-balance-facilitator.html'}else{document.getElementById('error').textContent='Incorrect PIN. Please try again.';document.getElementById('pin').value=''}});</script></body></html>
