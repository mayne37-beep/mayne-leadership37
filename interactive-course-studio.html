<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf4fa"><meta name="description" content="Build slide-based interactive courses with scenes, layers, states, triggers, variables, and a shared preview and export player."><title>Interactive Course Studio · Mayne Leadership</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/interactive-studio.css"></head>
<body><a class="skip" href="#canvas">Skip to slide editor</a>
<header class="studio-header"><a href="/facilitation.html" class="brand"><img src="/assets/jm-leadership-logo.svg" alt="Mayne Leadership" width="38" height="38"></a><div><span>MAYNE LEADERSHIP</span><strong>Interactive Course Studio</strong></div><span class="release">Foundation release</span><div class="header-actions"><button data-action="projects">Projects</button><button data-action="new">New course</button><button data-action="import">Import project</button><button data-action="backup">Download project</button><button data-action="save" class="primary">Save to website</button></div></header>
<div class="project-bar"><label class="project-title-label">Course title <input id="project-title" maxlength="200" aria-label="Course title"></label><span id="save-status" role="status" aria-live="polite">Opening editor…</span><div class="actions"><button data-action="variables">Variables</button><button data-action="check">Check project</button><button data-action="preview">Preview course</button><button data-action="export" class="primary">Export HTML</button><button data-action="help" aria-label="How to use Interactive Course Studio">?</button></div></div>
<main class="workspace"><aside class="outline-panel" aria-label="Scenes and slides"><div class="panel-title"><strong>Course outline</strong><button data-action="scene-add" aria-label="Add scene">+ Scene</button></div><div id="outline"></div><p class="panel-note">Use scenes to organize paths. Select a slide, then edit directly on the canvas.</p></aside>
<section class="editor-panel" aria-label="Slide workspace"><div class="insert-bar"><button data-action="object-add" data-type="text">T &nbsp; Text</button><button data-action="object-add" data-type="shape">▢ &nbsp; Shape</button><button data-action="object-add" data-type="button">▣ &nbsp; Button</button><button data-action="image-add">▧ &nbsp; Image</button><span class="divider"></span><button data-action="undo" id="undo" aria-label="Undo">↶</button><button data-action="redo" id="redo" aria-label="Redo">↷</button><button data-action="object-copy">Duplicate</button><button data-action="object-delete">Delete</button><button data-action="forward" title="Bring forward">↑ Front</button><button data-action="backward" title="Send backward">↓ Back</button><span id="slide-label"></span></div>
<div class="canvas-well" id="canvas-well"><div id="canvas-viewport"><div id="canvas" tabindex="0" aria-label="Editable slide canvas"></div></div></div>
<div class="layers-bar"><strong>Layers</strong><div id="layer-tabs"></div><button data-action="layer-add">+ Layer</button></div>
<section class="timeline-panel" aria-label="Slide timeline"><div class="timeline-heading"><strong>Timeline</strong><button id="timeline-play" data-action="timeline-play">Play timing</button><input id="time-slider" type="range" min="0" step=".1" aria-label="Editor timeline playhead"><output id="time-output">0.0s</output><label><input id="timing-visible" type="checkbox"> Show timing</label></div><div id="timeline"></div></section></section>
<aside class="inspector-panel" aria-label="Properties and interaction logic"><div class="inspector-tabs"><button data-action="tab" data-tab="object">Object</button><button data-action="tab" data-tab="states">States</button><button data-action="tab" data-tab="triggers">Triggers</button><button data-action="tab" data-tab="slide">Slide</button></div><div id="inspector"></div></aside></main>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button data-action="close-modal" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog><dialog id="preview-modal"><div class="modal-head"><h2>Course preview</h2><button id="close-preview" aria-label="Close preview">×</button></div><div id="preview-host"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><input id="project-file" type="file" accept=".json,application/json" hidden><input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script type="module" src="/assets/interactive-author.js"></script></body></html>
