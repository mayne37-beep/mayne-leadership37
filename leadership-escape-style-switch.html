const storageKey='leadership101_escape_mission02_v1';
function fresh(){return {name:'Team Orion',stage:0,started:Date.now(),seen:[],styles:{},stylesDone:false,profileViewed:[],dials:{},dialSelect:'marcus',direction:45,support:55,incidents:{},incidentDone:false,plan:{clarity:3,coaching:3,autonomy:4},planDone:false,code:'',unlocked:false,metrics:{trust:51,clarity:39,engagement:44,performance:61},score:0,hints:0,notes:[],endings:[],sound:true}}

const esc=(v)=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');

function notify(m,delta=0){if(delta){state.score=Math.max(0,Math.min(100,state.score+delta))}state.notes.unshift(m);if(state.notes.length>30)state.notes.length=30;save();toast(m)}
function adjust(change){for(const [k,n] of Object.entries(change))state.metrics[k]=clamp(state.metrics[k]+n)}

function launch(){let n=document.getElementById('teamName');state=fresh();state.name=(n?.value.trim()||'Team Orion').slice(0,54);save();render()}

function renderLanding(){document.getElementById('landing').innerHTML=`<div class="start-shell"><div><div class="brand"><span class="emblem"></span><span>LEADERSHIP 101 · ESCAPE LAB</span></div><div class="upper" style="color:#f2ca81;margin-top:39px">MISSION 02 · PROJECT ORION</div><h1>THE <em>STYLE</em><br>SWITCH</h1><div class="subtitle">Four employees. One approaching launch. Every leader has a default style—but can you adapt yours when the situation changes?</div><div class="start-facts"><span>✦ Five cinematic stations</span><span>◆ Real interactive puzzles</span><span>◷ 35–50 minutes</span><span>◎ Four leadership approaches</span></div><p style="font-size:12px;color:#bcd3df;line-height:1.6">Focus: Leadership Styles · Attending to Task & Relationship · Developing Leadership Skills · Team Leadership · Ethical Judgment</p></div><div class="start-card"><div class="upper" style="color:#f4cf8c">Mission briefing</div><h2>Lead differently to unlock the office.</h2><p>Project Orion's new service platform launches in 60 days. The team is missing targets. Staff have different needs, but management has been using one approach for everyone. Investigate, test leadership styles, navigate two emergencies, and present a defensible plan to open the executive vault.</p><label for="teamName">Your team or learner name</label><input id="teamName" maxlength="54" placeholder="e.g. Blue Team"><button class="btn gold full" style="margin-top:16px" onclick="launch()">▶ Start the mission</button><button class="btn full" style="margin-top:8px;background:#244861" onclick="resume()">↩ Resume saved mission</button><p style="font-size:11px;margin-bottom:0">Progress saves to this browser when storage is available. All data stays on this device.</p></div></div>`}
function objectives(){const o=[['Collect all five clues',state.seen.length===5],['Analyze four team members',state.stylesDone],['Calibrate four leadership approaches',Object.keys(state.dials).length===4],['Respond to two shifting incidents',state.incidentDone],['Defend your plan and open the vault',state.unlocked]];return o.map(([t,d])=>`<div class="objective ${d?'met':''}"><span class="check">${d?'✓':'○'}</span><span>${esc(t)}</span></div>`).join('')}
function aside(){return `<aside class="side"><div class="sidehead"><h3>▤ Your objectives</h3>${objectives()}</div><div class="sidewhite"><h3>▣ Evidence inventory · ${state.seen.length}/5</h3>${state.seen.length?state.seen.map(id=>{let e=EVIDENCE.find(p=>p.id===id);return `<div class="collected">${e.icon} <span>${esc(e.name)}</span> <span style="margin-left:auto;color:#178b6b">✓</span></div>`}).join(''):'<p class="hint">Find glowing objects in the Situation Room.</p>'}<button class="btn ghost mini full" onclick="showJournal()">Open casebook</button></div><div class="sidewhite"><h3>◷ Mission support</h3><button class="btn line mini full" onclick="showHint()">✦ Request a hint</button><button class="btn line mini full" style="margin-top:7px" onclick="showGuide()">Leadership style guide</button></div></aside>`}
function metric(k,label){let n=state.metrics[k];const color={trust:'#2e9b89',clarity:'#2b86b5',engagement:'#c59648',performance:'#736db1'}[k];return `<div class="statrow"><div class="row between"><span>${label}</span><b>${n}%</b></div><div class="track"><div class="fill" style="width:${n}%;background:${color}"></div></div></div>`}
function rightside(){return `<aside class="side right"><div class="sidewhite"><h3>◈ Team impact monitor</h3>${metric('trust','Trust')}${metric('clarity','Role clarity')}${metric('engagement','Engagement')}${metric('performance','Readiness / results')}<div class="pill" style="margin-top:6px">Illustrative simulation data</div></div><div class="sidewhite"><h3>▥ Mission telemetry</h3><div class="row between small" style="margin-bottom:10px"><span>Progress</span><b>${Math.min(unlockedStage()*20,100)}%</b></div><div class="track"><div class="fill" style="width:${Math.min(unlockedStage()*20,100)}%;background:#e3b65d"></div></div><div style="margin-top:12px" class="row between small"><span>Leadership points</span><b>${state.score}</b></div><div class="row between small" style="margin-top:9px"><span>Hints used</span><b>${state.hints}</b></div><div class="row between small" style="margin-top:9px"><span>Clue fragments</span><b>${[state.seen.length===5,state.stylesDone,Object.keys(state.dials).length===4,state.incidentDone].filter(Boolean).length}/4</b></div><button class="btn line mini full" style="margin-top:14px" onclick="showJournal()">◫ View decision log</button></div></aside>`}
function chrome(){return `<div class="topbar"><div class="topinner"><div class="topbrand">◆ LEADERSHIP 101 <small>ESCAPE LAB · MISSION 02</small></div><div class="steps">${SCENES.map((t,i)=>`<button class="step ${state.stage===i?'active':i<state.stage?'done':''}" onclick="nav(${i})"><b>${i+1}</b>${t.short}</button>`).join('')}</div><div class="topmeta">★ ${state.score} points</div><button class="btn mini" onclick="showJournal()">▤ Casebook</button><button class="btn mini" style="background:#38536b" onclick="backLanding()">≡ Menu</button></div></div>`}
function scene(){let d=SCENES[state.stage],hots='';if(state.stage===0)hots=HOTS.map(p=>`<button class="hot ${state.seen.includes(p.id)?'seen':''}" style="left:${p.x}%;top:${p.y}%" onclick="documentItem('${p.id}')">${esc(p.label)}<span class="sub">${state.seen.includes(p.id)?'Collected':'Inspect object'}</span></button>`).join('');
if(state.stage===1)hots=STAFF.map((p,i)=>`<button class="hot ${state.profileViewed.includes(p.id)?'seen':''}" style="left:${[20,43,66,85][i]}%;top:${[53,73,54,75][i]}%" onclick="profile('${p.id}')">Meet ${p.name}<span class="sub">Read the dossier</span></button>`).join('');
if(state.stage===2)hots=`<button class="hot" style="left:58%;top:51%" onclick="showGuide()">Style handbook<span class="sub">Compare approaches</span></button><button class="hot" style="left:85%;top:69%" onclick="showJournal()">Review evidence<span class="sub">Your case notes</span></button>`;
if(state.stage===3)hots=`<button class="hot" style="left:34%;top:57%" onclick="crisisInfo('security')">Security alert<span class="sub">Urgent notice</span></button><button class="hot" style="left:72%;top:55%" onclick="crisisInfo('ideas')">Staff proposal<span class="sub">Improvement opportunity</span></button>`;
if(state.stage===4)hots=`<button class="hot" style="left:77%;top:57%" onclick="showJournal()">Review evidence<span class="sub">All four clues</span></button>`;
return `<div class="scene" style="--sceneimg:var(--bg-${d.bg})"><div class="scene-label"><b>${esc(d.title)}</b><span>${esc(d.subtitle)}</span></div>${hots}</div><div class="roombar">${SCENES.map((t,i)=>`<button class="roomtab ${i===state.stage?'current':''} ${i>unlockedStage()?'locked':''}" onclick="nav(${i})">${i>unlockedStage()?'🔒 ':i<state.stage?'✓ ':i===state.stage?'◆ ':'◇ '}${t.short}</button>`).join('')}</div>`}
function render(){if(!state.started)state.started=Date.now();document.getElementById('landing').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('game').innerHTML=chrome()+`<main class="app-grid">${aside()}<div class="scene-column">${scene()}<section class="desk" id="station">${[briefing,dossiers,consoleDesk,crisisDesk,vault][state.stage]()}</section></div>${rightside()}</main><div class="footer">Leadership 101 Escape Lab · Mission 02 — The Style Switch · Simulated consequences are for learning, not predictive or psychological assessments.</div>`;save();bindDrops()}
function briefing(){return `<div class="eyebrow">Station 01 · Leadership foundations</div><h2>Investigate before choosing your style.</h2><p>Director Elena has asked you to stabilize Project Orion. Management has treated every employee the same, even though their skill, confidence, and experience differ. Inspect the five glowing objects in the room to learn what's really happening.</p><div class="four">${EVIDENCE.slice(0,4).map(e=>`<div class="case ${state.seen.includes(e.id)?'done':''}"><div class="symbol">${e.icon}</div><div><strong>${e.name}</strong><small>${state.seen.includes(e.id)?'Evidence collected':'Find it in the scene'}</small></div></div>`).join('')}</div><div style="height:12px"></div><div class="msg">You will need to differentiate <b>task direction</b> from <b>relationship support</b>. A leadership style is a choice to be adapted, not a personality label or permanent employee category.</div><div class="row between wrap" style="margin-top:16px"><span class="pill">${state.seen.length} of 5 clues investigated</span><button class="btn gold" ${state.seen.length<5?'disabled':''} onclick="nav(1)">Enter Personnel Lab →</button></div>`}
function documentItem(id){let e=EVIDENCE.find(x=>x.id===id);if(!e)return;if(!state.seen.includes(id)){state.seen.push(id);state.score=Math.min(100,state.score+2);state.notes.unshift(`Found ${e.name}: ${e.insight}`);save()};showModal(`${e.icon} ${e.name}`,`<div class="paper"><div class="upper" style="color:#9a713d;margin-bottom:12px">CONFIDENTIAL · PROJECT ORION</div>${esc(e.body)}</div><div class="msg good" style="margin-top:14px"><strong>Leadership clue:</strong> ${esc(e.insight)}</div><button class="btn gold" style="margin-top:14px" onclick="closeModal();render()">${state.seen.length===5?'All evidence collected — continue':'Return to the room'}</button>`);}
function dossiers(){return `<div class="eyebrow">Station 02 · Leadership styles / Employee readiness</div><h2>Read the people—not just their job titles.</h2><p>Open each personnel file. Then drag a leadership-style card to the employee it best fits <b>for the current assignment</b>. On mobile, tap the style and then the employee's assignment slot.</p><div class="people-grid">${STAFF.map(p=>`<div class="person"><img alt="Portrait of ${p.name}" src="${assets[p.id]}"><div class="body"><h4>${p.name} ${state.profileViewed.includes(p.id)?'✓':''}</h4><span class="filetag">${p.role}</span><p>${p.blurb}</p><button class="btn mini ghost" onclick="profile('${p.id}')">▤ Inspect dossier</button></div></div>`).join('')}</div><div class="board"><div class="upper" style="color:#744c22;margin-bottom:10px">Magnetic leadership assignment board</div><div class="style-row">${STYLE_INFO.map(s=>`<button draggable="true" ondragstart="dragStyle(event,'${s.id}')" class="style-chip ${selectedStyle===s.id?'selected':''}" data-style="${s.id}" style="background:${s.color}" onclick="selectStyle('${s.id}')"><strong>${s.icon} ${s.id}</strong><small>${s.desc}</small></button>`).join('')}</div><div class="drop-row">${STAFF.map(p=>`<button class="drop ${state.styles[p.id]?'assigned':''}" data-person="${p.id}" ondragover="allowDrop(event)" ondrop="dropStyle(event,'${p.id}')" onclick="applyStyle('${p.id}')"><strong>${p.name}</strong><span>${state.styles[p.id]?'◈ '+state.styles[p.id]:'Drop or tap a style here'}</span></button>`).join('')}</div></div>${state.stylesDone?`<div class="msg good" style="margin-top:14px">The personnel board is locked in. Your leadership assignments have been recorded and their implications carried into the console.</div>`:`<div class="row between wrap" style="margin-top:15px"><span class="pill">${Object.keys(state.styles).length}/4 assigned · ${state.profileViewed.length}/4 files read</span><button class="btn gold" ${Object.keys(state.styles).length<4||state.profileViewed.length<4?'disabled':''} onclick="confirmStyles()">Commit assignments →</button></div>`}<div class="row" style="margin-top:10px">${state.stylesDone?'<button class="btn gold" onclick="nav(2)">Open Leadership Console →</button>':''}</div></div>`}
function profile(id){let p=STAFF.find(x=>x.id===id);if(!p)return;if(!state.profileViewed.includes(id)){state.profileViewed.push(id);save()};showModal(`${p.name} · ${p.role}`,`<div class="row" style="align-items:start;gap:18px"><img src="${assets[p.id]}" alt="${p.name}" style="width:135px;height:155px;object-fit:cover;border-radius:12px"><div><div class="upper">Personnel dossier · Project Orion</div><h3 style="margin:9px 0">${p.name}</h3><p style="font-size:13px;line-height:1.7;color:#405b6e">${p.detail}</p></div></div><div class="paper" style="margin-top:12px"><i>“${p.quote}”</i></div><div class="msg" style="margin-top:14px"><b>What matters:</b> ${p.prompt}.</div><button class="btn gold" style="margin-top:15px" onclick="closeModal();render()">Add insights to my casebook</button>`)}
function dragStyle(e,id){selectedStyle=id;e.dataTransfer?.setData('text/plain',id)}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function dropStyle(e,id){e.preventDefault();e.currentTarget.classList.remove('dragover');applyStyle(id,e.dataTransfer?.getData('text/plain'))}
function selectStyle(id){if(state.stylesDone)return;selectedStyle=id;document.querySelectorAll('.style-chip').forEach(el=>el.classList.toggle('selected',el.dataset.style===id));toast(`${id} selected. Tap a person to assign.`)}
function applyStyle(id,style){if(state.stylesDone)return;let v=style||selectedStyle;if(!v){toast('Select one of the four leadership styles first.');return}state.styles[id]=v;selectedStyle=null;save();render()}
function confirmStyles(){if(state.stylesDone)return;if(Object.keys(state.styles).length<4||state.profileViewed.length<4){toast('Read every dossier and assign all four employees.');return}let right=0;for(const p of STAFF){if(state.styles[p.id]===p.level)right++};let points=right*4;state.score=Math.min(100,state.score+points);adjust({trust:(right-2)*2,clarity:(right-2)*3,engagement:(right-2)*2});state.stylesDone=true;notify(`Personnel board committed: ${right} of 4 contextual matches.`,0);showModal('Personnel board: decision impact',`<div class="pill gold">${right}/4 evidence-aligned assignments · ${points} points</div><p style="line-height:1.7">Your decisions will influence the team's starting confidence in the next room. These aren't personality labels: each employee's need may change as they learn or the task changes.</p><div class="stack">${STAFF.map(p=>`<div class="case"><div class="symbol">${state.styles[p.id]===p.level?'✓':'↗'}</div><div><strong>${p.name}: ${state.styles[p.id]}</strong><small>${p.ideal}</small></div></div>`).join('')}</div><button class="btn gold" style="margin-top:14px" onclick="closeModal();nav(2)">Enter the Style Console →</button>`);save()}
function bindDrops(){document.querySelectorAll('.drop').forEach(el=>{el.addEventListener('dragleave',()=>el.classList.remove('dragover'))})}
function currentPerson(){return STAFF.find(p=>p.id===state.dialSelect)||STAFF[0]}
function styleFrom(dir,sup){return dir>=50?(sup>=50?'Coaching':'Directing'):(sup>=50?'Supporting':'Delegating')}
function consoleDesk(){const p=currentPerson();const already=state.dials[p.id];let d=Number(state.direction),su=Number(state.support);return `<div class="eyebrow">Station 03 · Task and relationship behaviors</div><h2>The live leadership console</h2><p>Try a leadership conversation before committing. Move both controls. The quadrant shows the approach you're signaling. Notice how the same setting might help one person but hurt another.</p><div class="row wrap" style="margin:13px 0">${STAFF.map(v=>`<button class="rosterbtn ${v.id===p.id?'selected':''}" onclick="setDialPerson('${v.id}')">${v.name} ${state.dials[v.id]?'✓':''}</button>`).join('')}</div><div class="console-grid"><div><div class="quadrant" aria-label="Task direction versus relationship support quadrant"><span class="quadlabel" style="left:4%;top:4%">SUPPORTING</span><span class="quadlabel" style="right:4%;top:4%">COACHING</span><span class="quadlabel" style="left:4%;bottom:4%">DELEGATING</span><span class="quadlabel" style="right:4%;bottom:4%">DIRECTING</span><span class="target-dot" style="left:${d}%;top:${100-su}%"></span></div><div class="row between" style="margin:9px 0 12px;font-size:11px;color:#738692"><span>← Lower task direction</span><span>More →</span></div><div class="pill gold">Current approach: ${styleFrom(d,su)}</div></div><div class="sliderbox"><div class="row" style="align-items:start;margin-bottom:12px"><img src="${assets[p.id]}" style="width:75px;height:78px;object-fit:cover;border-radius:10px" alt="${p.name}"><div><b>${p.name} · ${p.role}</b><div class="hint" style="margin-top:6px">“${p.quote}”</div></div></div><label class="row between label" for="dir">Task direction <b id="dlabel">${d}%</b></label><input type="range" min="0" max="100" value="${d}" id="dir" oninput="updateDial()"><p class="tiny muted" style="margin:2px 0 15px">Clear goals, show the process, give instructions, set checkpoints</p><label class="row between label" for="sup">Relationship support <b id="slabel">${su}%</b></label><input type="range" min="0" max="100" value="${su}" id="sup" oninput="updateDial()"><p class="tiny muted" style="margin:2px 0 15px">Listen, encourage, ask questions, build confidence and voice</p><div class="msg" id="dialPrediction"><b>Predicted effect:</b> ${predict(p,d,su)}</div><button style="margin-top:12px" class="btn gold full" ${already?'disabled':''} onclick="commitDial()">${already?'Decision recorded ✓':'Have the conversation →'}</button></div></div><div class="row between wrap" style="margin-top:19px"><span class="pill">${Object.keys(state.dials).length}/4 conversations held</span><button class="btn gold" ${Object.keys(state.dials).length<4?'disabled':''} onclick="nav(3)">Go to Operations Floor →</button></div>`}
function setDialPerson(id){state.dialSelect=id;const v=state.dials[id];if(v){state.direction=v.direction;state.support=v.support}else{state.direction=45;state.support=55}save();render()}
function predict(p,d,s){let label=styleFrom(d,s);if(label===p.level)return 'This approach is closely aligned to the employee’s current need. Expect clearer commitment and appropriate support.';if(label==='Directing')return p.level==='Delegating'?'Heavy instruction may reduce ownership for an already-capable employee.':'More clarity, but too little space for the employee’s questions or expertise.';if(label==='Coaching')return p.level==='Delegating'?'Collaborative direction may feel like unnecessary review.':'Combined direction and support may build confidence, but check whether this much guidance is required.';if(label==='Supporting')return p.level==='Directing'?'Listening helps, but this newcomer still needs clear standards and step-by-step training.':'The employee has a voice, but may need firmer task expectations.';return 'Autonomy can be powerful, but the employee may be left without needed clarity or reassurance.'}
function updateDial(){let d=Number(document.getElementById('dir').value),su=Number(document.getElementById('sup').value);state.direction=d;state.support=su;document.getElementById('dlabel').textContent=d+'%';document.getElementById('slabel').textContent=su+'%';let dot=document.querySelector('.target-dot');if(dot){dot.style.left=d+'%';dot.style.top=(100-su)+'%'}document.querySelector('.pill.gold').textContent='Current approach: '+styleFrom(d,su);document.getElementById('dialPrediction').innerHTML='<b>Predicted effect:</b> '+esc(predict(currentPerson(),d,su));save()}
function commitDial(){let p=currentPerson();if(state.dials[p.id])return;let d=state.direction,su=state.support;let match=styleFrom(d,su)===p.level;let dist=Math.hypot(d-p.target[0],su-p.target[1]);let points=match?(dist<28?9:7):2;state.dials[p.id]={direction:d,support:su,approach:styleFrom(d,su),match,points};state.score=Math.min(100,state.score+points);adjust(match?{trust:3,clarity:3,engagement:3,performance:2}:{trust:-3,clarity:-1,engagement:-3,performance:0});notify(`${p.name}: ${styleFrom(d,su)} approach · ${match?'aligned':'partial mismatch'} · ${points} pts.`);let c=`<div class="pill ${match?'':'gold'}">${points} leadership points</div><h3 style="margin:15px 0">${match?'Strong situational alignment':'A useful leadership lesson'}</h3><p style="line-height:1.65">${esc(predict(p,d,su))}</p><div class="paper"><b>${p.name} responds:</b><p>“${match?(p.id==='marcus'?'Thank you for letting me help shape the plan.':p.id==='daniel'?'Now I know what good performance looks like.':p.id==='priya'?'The practice and feedback help me grow into this role.':'I appreciate the trust. I’ll own the outcome and send an update.'):(p.id==='daniel'?'I still need to know the exact steps.':'I’m not sure this approach quite addresses what I need right now.') }”</p></div><div class="msg" style="margin-top:13px"><b>Facilitator insight:</b> ${p.ideal}</div><button class="btn gold" style="margin-top:15px" onclick="closeModal();nextPerson()">Continue →</button>`;showModal(`${p.name} · Conversation outcome`,c);save();}
function nextPerson(){closeModal();let next=STAFF.find(x=>!state.dials[x.id]);if(next)state.dialSelect=next.id;save();render()}
const CRISIS=[{id:'security',title:'The security escalation',tag:'High urgency · Low tolerance for ambiguity',body:'During a live pilot, an employee spots a possible exposure of sensitive case records. Team members are improvising different responses.',options:[{id:'direct',name:'Use clear, protocol-based direction',detail:'Pause the workflow, follow incident procedures, assign responsibilities, and confirm escalation.'},{id:'group',name:'Hold a broad team brainstorm first',detail:'Invite creative ideas from the full team before deciding how to contain the issue.'},{id:'delegate',name:'Let each unit decide separately',detail:'Allow experienced staff to choose their own containment approach.'}],good:'direct',right:'Immediate coordination and established protocols are appropriate when time-sensitive safety and information protection are at stake.'},{id:'ideas',title:'The improvement opportunity',tag:'Moderate urgency · High local expertise',body:'After the immediate issue is contained, senior staff propose a new way to reduce intake delays. They have strong data and are eager to experiment within defined guardrails.',options:[{id:'direct',name:'Issue a complete redesign from leadership',detail:'Write the new workflow without additional employee input.'},{id:'involve',name:'Set outcomes and co-design the pilot',detail:'Invite employee recommendations, define success measures, and give the experienced team authority to test.'},{id:'wait',name:'Postpone until the launch has passed',detail:'Do not explore any changes until the rollout is complete.'}],good:'involve',right:'When knowledgeable staff can own improvement work, participative decision-making and delegation within boundaries build ownership.'}];
function crisisDesk(){return `<div class="eyebrow">Station 04 · Situational flexibility / Decision-making</div><h2>The shift in command</h2><p>Leadership style cannot stay fixed all day. Two events have arrived. Open the live incident feed, choose an action, and observe the different effect on team readiness.</p><div class="scenario-grid">${CRISIS.map(c=>{let outcome=state.incidents[c.id];return `<div class="scenario"><div class="upper" style="color:#b07b3e">${c.tag}</div><h3>${c.title} ${outcome?'✓':''}</h3><p>${c.body}</p>${outcome?`<div class="msg ${outcome.correct?'good':'warn'}">Selected: ${esc(outcome.name)}<div class="small" style="margin-top:5px">${esc(c.right)}</div></div>`:`<button class="btn gold" onclick="crisisInfo('${c.id}')">Review active incident →</button>`}</div>`}).join('')}</div><div style="margin-top:14px" class="msg">The goal is not to be a “directive leader” or a “participative leader.” It is to diagnose the stakes and people, then choose the behavior that fits the moment.</div>${state.incidentDone?'<button style="margin-top:14px" class="btn gold" onclick="nav(4)">Enter Executive Vault →</button>':`<div class="pill" style="margin-top:15px">${Object.keys(state.incidents).length}/2 incidents resolved</div>`}`}
function crisisInfo(id){let c=CRISIS.find(v=>v.id===id);if(!c)return;let done=state.incidents[id];showModal('⚠ '+c.title,`<div class="upper" style="color:#ad7433">Incident feed · ${c.tag}</div><p style="font-size:14px;line-height:1.7">${esc(c.body)}</p>${done?`<div class="msg good">Response already recorded. ${c.right}</div>`:`<div class="stack">${c.options.map(o=>`<button class="choice" onclick="chooseIncident('${id}','${o.id}')"><b>${esc(o.name)}</b><div class="hint" style="margin-top:4px">${esc(o.detail)}</div></button>`).join('')}</div>`}`)}
function chooseIncident(id,chosen){let c=CRISIS.find(v=>v.id===id);if(!c||state.incidents[id])return;let o=c.options.find(v=>v.id===chosen);let correct=chosen===c.good;state.incidents[id]={name:o.name,correct};state.score=Math.min(100,state.score+(correct?8:2));adjust(correct?{trust:3,clarity:4,engagement:2,performance:4}:{trust:-4,clarity:-3,engagement:-3,performance:-4});if(Object.keys(state.incidents).length===2)state.incidentDone=true;notify(`${c.title}: ${correct?'well aligned':'trade-off detected'}.`);showModal('Incident response: consequences',`<div class="pill ${correct?'':'gold'}">${correct?'Response aligned to the context':'Trade-off to reflect on'}</div><h3 style="margin-top:14px">${o.name}</h3><p style="line-height:1.7">${esc(c.right)}</p><div class="paper"><b>What happens next</b><p>${correct?(id==='security'?'The team immediately pauses affected work, roles become clear, and the response is documented.':'Experienced staff propose a measured pilot, and the team begins recovering ownership and momentum.'):(id==='security'?'Different staff follow different interpretations of the problem. The organization loses precious coordination time.':'Experienced employees withdraw. The team misses an opportunity to rebuild engagement and test an evidence-informed improvement.')}</p></div><button class="btn gold" style="margin-top:15px" onclick="closeModal();render()">Return to Operations Floor</button>`);save()}
function planPart(k,label){return `<div class="allocation"><div class="row between"><label for="${k}" class="label">${label}</label><b id="v_${k}">${state.plan[k]}</b></div><input id="${k}" type="range" min="0" max="10" step="1" value="${state.plan[k]}" oninput="changePlan('${k}',this.value)"></div>`}
function vault(){const ready=state.planDone;return `<div class="eyebrow">Station 05 · Final challenge / Leadership judgment</div><h2>The executive decision vault</h2><p>You have 10 leadership investment tokens to support the next 30 days. Allocate them across clarity, developmental coaching, and trusted autonomy. Then justify your approach and use your four collected fragments to unlock the executive chamber.</p><div class="scenario-grid"><div><div class="pane inset"><h3>30-day leadership investment plan</h3><p class="hint">You must allocate exactly 10. Different balances lead to different organizational outcomes.</p>${planPart('clarity','Process clarity & onboarding')}${planPart('coaching','Coaching and employee support')}${planPart('autonomy','Ownership and delegated pilots')}<div class="row between"><span class="pill" id="budgetLeft">${10-Object.values(state.plan).reduce((a,b)=>a+b,0)} tokens remaining</span><button class="btn gold" ${ready?'disabled':''} id="commitPlan" onclick="commitPlan()">${ready?'Plan submitted ✓':'Submit plan'}</button></div></div><div class="msg" style="margin-top:13px">The plan should protect standards <i>and</i> support employee growth. Over-investing in a single approach creates vulnerabilities.</div></div><div class="door-visual"><div class="door ${state.unlocked?'open':''}"></div><div style="position:absolute;bottom:27px;left:50%;transform:translateX(-50%);background:#0a2236e8;border:1px solid #e6bf77;color:white;padding:8px 13px;border-radius:8px;font-size:11px;white-space:nowrap">${state.unlocked?'ACCESS GRANTED':'4-DIGIT SECURITY ACCESS'}</div></div></div><div class="pane inset" style="margin-top:14px"><div class="row between wrap"><h3 style="margin:0">Security console · Find four clues</h3><span class="pill gold">${[state.seen.length===5,state.stylesDone,Object.keys(state.dials).length===4,state.incidentDone].filter(Boolean).length}/4 fragments recovered</span></div><div class="four" style="margin:14px 0">${[['1','Briefing','4',state.seen.length===5],['2','Dossiers','2',state.stylesDone],['3','Console','3',Object.keys(state.dials).length===4],['4','Incidents','1',state.incidentDone]].map(([num,name,digit,got])=>`<div class="case" style="display:block;text-align:center"><div class="upper">Fragment ${num}</div><strong style="font-size:27px;display:block;margin:6px;color:#164c6d">${got?digit:'?'}</strong><small>${name}</small></div>`).join('')}</div><div class="row wrap" style="align-items:start;gap:20px"><div style="min-width:230px"><div class="keydisplay" id="keydisplay">${(state.code||'').padEnd(4,'·')}</div><div class="codekeys">${['1','2','3','4','5','6','7','8','9','CLEAR','0','↵'].map(v=>`<button class="key" onclick="pressKey('${v}')">${v}</button>`).join('')}</div></div><div style="flex:1"><h3>Decode the room sequence</h3><p>The digits are printed on the four recovered fragments, in the order in which you investigated them. The door responds only after your investment plan has been submitted.</p><button class="btn ghost" onclick="showJournal()">▤ Review the casebook</button>${state.unlocked?'<div class="msg good" style="margin-top:12px">The executive door is open. Your leadership debrief is ready.</div><button class="btn gold full" style="margin-top:12px" onclick="showReport()">View mission debrief →</button>':''}</div></div></div>`}
function changePlan(k,v){if(state.planDone)return;v=Number(v);let others=Object.entries(state.plan).filter(([x])=>x!==k).reduce((a,[,b])=>a+b,0);state.plan[k]=Math.min(v,10-others);document.getElementById('v_'+k).textContent=state.plan[k];document.getElementById('budgetLeft').textContent=10-Object.values(state.plan).reduce((a,b)=>a+b,0)+' tokens remaining';save()}
function commitPlan(){if(state.planDone)return;let total=Object.values(state.plan).reduce((a,b)=>a+b,0);if(total!==10){toast('Assign all 10 leadership investment tokens.');return}let {clarity,coaching,autonomy}=state.plan;let balance=(Math.min(clarity,4)+Math.min(coaching,4)+Math.min(autonomy,4));let pts=Math.round(balance*1.2);state.score=Math.min(100,state.score+pts);adjust({clarity:Math.round(clarity*1.7-3),trust:Math.round(coaching*1.4+autonomy*.5-4),engagement:Math.round(coaching*.7+autonomy*1.2-4),performance:Math.round(clarity*.8+autonomy*.8-4)});state.planDone=true;notify(`30-day plan submitted · ${pts} points.`);showModal('Executive plan submitted',`<div class="pill gold">30-day leadership plan approved for review</div><h3>Your investment pattern</h3><div class="stack">${[['Clarity & onboarding',clarity],['Coaching & support',coaching],['Delegation & autonomy',autonomy]].map(([a,b])=>`<div class="row between"><b>${a}</b><span>${b}/10</span></div>`).join('')}</div><p>Different blends have benefits and vulnerabilities. A balanced approach typically protects immediate standards while growing ownership over the longer term.</p><button class="btn gold" onclick="closeModal();render()">Approach the vault keypad →</button>`);save()}
function pressKey(v){if(state.unlocked){showReport();return}if(v==='CLEAR')state.code='';else if(v==='↵'){if(!state.planDone){toast('Submit your leadership investment plan before attempting the vault.');return}if(state.code==='4231'){state.unlocked=true;state.score=Math.min(100,state.score+12);notify('Executive office unlocked. Mission accomplished.');showReport()}else{state.code='';toast('Access denied. Arrange the four clue fragments in room order.')}}else if(state.code.length<4)state.code+=v;save();let d=document.getElementById('keydisplay');if(d)d.textContent=state.code.padEnd(4,'·');if(state.unlocked)render()}
function overall(){let avg=Object.values(state.metrics).reduce((a,b)=>a+b,0)/4;return avg>=67?'Adaptable leader':avg>=52?'Developing adaptive leader':'Reflective leader in progress'}
function showReport(){render();showModal('Mission 02 · Leadership after-action report',`<div class="upper">PROJECT ORION · FINAL BRIEFING</div><h2 style="font-size:29px;letter-spacing:-.04em">${state.unlocked?'ACCESS GRANTED':'MISSION IN PROGRESS'}</h2><p style="font-size:14px">${esc(state.name)} · ${overall()}</p><div class="four" style="margin:14px 0">${Object.entries(state.metrics).map(([k,v])=>`<div class="meter"><strong>${v}%</strong><small>${k}</small></div>`).join('')}</div><div class="pill gold">${state.score} leadership points · ${state.hints} hints used</div><h3>What your decisions show</h3><div class="paper">${STAFF.map(p=>`<div style="margin-bottom:10px"><b>${p.name}</b> — ${state.dials[p.id]?.approach||'Not yet assessed'}<div style="font-size:11px;color:#526879">${p.ideal}</div></div>`).join('')}</div><h3>Three debrief questions</h3><ol style="line-height:1.8;font-size:13px"><li>When was high task direction appropriate—and when would it undermine an employee?</li><li>Where did your choices protect both accountability and employee dignity?</li><li>What signals would tell you to change your style after two weeks?</li></ol><div class="row wrap"><button class="btn gold" onclick="downloadReport()">↓ Download learner report</button><button class="btn line" onclick="window.print()">Print</button><button class="btn ghost" onclick="closeModal()">Return to game</button></div>`)}
function downloadReport(){let lines=['Leadership 101 Escape Lab - Mission 02: The Style Switch','Team: '+state.name,'Score: '+state.score,'Completed: '+new Date().toISOString(),'Hints: '+state.hints,'',...Object.entries(state.metrics).map(([k,v])=>k+': '+v),'','Employee decisions',...STAFF.map(p=>`${p.name}: ${state.dials[p.id]?.approach||'Not completed'}; best fit: ${p.level}`),'','Personnel board',...STAFF.map(p=>`${p.name}: ${state.styles[p.id]||'None'}`),'','Incidents',...CRISIS.map(c=>`${c.title}: ${state.incidents[c.id]?.name||'Not completed'}`),'','30-day plan',...Object.entries(state.plan).map(([k,v])=>`${k}: ${v}`),'','Decision log',...state.notes.map(x=>'- '+x)];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Leadership_Styles_Mission02_'+state.name.replace(/[^a-z0-9-]/gi,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function showModal(title,body){const root=document.getElementById('modal');root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalbar"><h3>${esc(title)}</h3><button class="close" onclick="closeModal()" aria-label="Close dialog">✕</button></div><div class="modalbody">${body}</div></div>`;root.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function showJournal(){const fragments=[['Situation Room',state.seen.length===5?'4':'?'],['Personnel Lab',state.stylesDone?'2':'?'],['Leadership Console',Object.keys(state.dials).length===4?'3':'?'],['Operations Floor',state.incidentDone?'1':'?']];showModal('▤ Project Orion casebook',`<div class="upper">Mission evidence / personal notes</div><h3>Security clue fragments</h3><div class="four">${fragments.map(([a,b])=>`<div class="case" style="display:block;text-align:center"><strong style="font-size:25px">${b}</strong><small>${a}</small></div>`).join('')}</div><h3>Collected information</h3><div class="stack">${state.seen.map(id=>{let e=EVIDENCE.find(v=>v.id===id);return `<div class="case"><b>${e.icon}</b><div><strong>${e.name}</strong><small>${e.insight}</small></div></div>`}).join('')||'<p class="hint">No evidence yet. Investigate the first room.</p>'}</div><h3>Action history</h3><div class="paper">${state.notes.map(n=>`<div style="margin-bottom:8px">• ${esc(n)}</div>`).join('')||'No leadership decisions recorded yet.'}</div>`)}
function showGuide(){showModal('Field guide: four leadership approaches',`<p style="font-size:13px;line-height:1.7">A simplified task-and-relationship framework for Leadership 101. These are situational behaviors rather than fixed personality types. They are not universal labels for employees or a validated psychological assessment.</p><div class="setgrid">${STYLE_INFO.map(s=>`<div class="case" style="background:${s.color}"><div class="symbol">${s.icon}</div><div><strong>${s.id}</strong><small>${s.desc}</small></div></div>`).join('')}</div><div class="msg" style="margin-top:15px"><b>Rule of thumb:</b> First identify the task, urgency, proficiency, commitment, and risk. Then adapt how much direction and support you provide. Consider organizational policy and the employee's voice.</div>`)}
function showHint(){state.hints++;save();let hints=[['Inspect five pulsing objects, including the launch schedule.','The last overlooked item is often the small launch calendar.'],['Read each employee’s quote and examine their present task confidence.','Direction is most useful for someone learning a high-risk process; autonomy is useful when capability and commitment are established.'],['Use the two slider axes as a grid.','Marcus needs support; Daniel needs direction; Priya needs both; Ryan needs trusted autonomy.'],['For urgent sensitive-data incidents, established procedures come before brainstorming.','For longer-term redesigns with expert contributors, invite participation within guardrails.'],['Use all 10 tokens, then read your four fragments in room order.','The code is displayed in the casebook when you’ve completed all four rooms.']][state.stage];showModal('✦ Instructor-guided hint',`<div class="paper">${hints[state.hints%3===0?1:0]}</div><p class="hint">Hints are available any time. Your total hint use appears in the final report.</p><button class="btn ghost" onclick="closeModal()">Back to the mission</button>`)}
function bindEscape(){document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})}
load();renderLanding();bindEscape();
</script>
