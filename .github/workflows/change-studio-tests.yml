name: Change Management Studio tests
on:
  push:
    paths:
      - 'change-management-studio.html'
      - 'assets/change-studio-*.js'
      - 'assets/change-studio.css'
      - 'tests/change-studio/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/change-studio-tests.yml'
  pull_request:
    paths:
      - 'change-management-studio.html'
      - 'assets/change-studio-*.js'
      - 'assets/change-studio.css'
      - 'tests/change-studio/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/change-studio-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  change-management-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run change management model and UI interactions
        run: npm run test:change-studio
      - name: Verify production site includes Change Management Studio
        run: |
          npm run build
          test -f public/change-management-studio.html
          test -f public/assets/change-studio-model.js
          test -f public/assets/change-studio-render.js
          test -f public/assets/change-studio.js
          test -f public/assets/change-studio.css
