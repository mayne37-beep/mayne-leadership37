name: Collaboration Canvas smoke tests
on:
  push:
    paths:
      - 'assets/collaboration-canvas.js'
      - 'assets/collaboration-canvas.css'
      - 'assets/vendor/**'
      - 'collaboration-canvas.html'
      - 'collaboration-join.html'
      - 'tests/collaboration-canvas-smoke.cjs'
      - '.github/workflows/collaboration-canvas-tests.yml'
  pull_request:
    paths:
      - 'assets/collaboration-canvas.js'
      - 'assets/collaboration-canvas.css'
      - 'collaboration-canvas.html'
      - 'collaboration-join.html'
      - 'tests/collaboration-canvas-smoke.cjs'
permissions:
  contents: read
jobs:
  canvas-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Canvas JavaScript, assets and geometry
        run: node tests/collaboration-canvas-smoke.cjs
