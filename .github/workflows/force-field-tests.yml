name: Force Field Analysis Studio tests
on:
  push:
    paths:
      - 'force-field-studio.html'
      - 'assets/force-field-*.js'
      - 'assets/force-field-studio.css'
      - 'tests/force-field/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/force-field-tests.yml'
  pull_request:
    paths:
      - 'force-field-studio.html'
      - 'assets/force-field-*.js'
      - 'assets/force-field-studio.css'
      - 'tests/force-field/**'
      - 'tools.html'
      - 'package.json'
      - '.github/workflows/force-field-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  force-field-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check analysis engine and browser interactions
        run: npm run test:force-field
      - name: Verify production build includes Force Field Studio
        run: |
          npm run build
          test -f public/force-field-studio.html
          test -f public/assets/force-field-model.js
          test -f public/assets/force-field-render.js
          test -f public/assets/force-field-studio.js
          test -f public/assets/force-field-studio.css
