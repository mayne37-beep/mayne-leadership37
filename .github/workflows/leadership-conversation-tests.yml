name: Leadership Conversation Simulator tests
on:
  push:
    paths:
      - 'leadership-conversation-simulator.html'
      - 'assets/leadership-conversation*.js'
      - 'assets/leadership-conversation.css'
      - 'assets/leadership-character*.js'
      - 'assets/leadership-characters.js'
      - 'tests/leadership-conversation/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/leadership-conversation-tests.yml'
  pull_request:
    paths:
      - 'leadership-conversation-simulator.html'
      - 'assets/leadership-conversation*.js'
      - 'assets/leadership-conversation.css'
      - 'assets/leadership-character*.js'
      - 'assets/leadership-characters.js'
      - 'tests/leadership-conversation/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/leadership-conversation-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run leadership scenario and UI workflow tests
        run: npm run test:leadership-conversations
      - name: Verify production site contains the simulator
        run: |
          npm run build
          test -f public/leadership-conversation-simulator.html
          test -f public/assets/leadership-conversation-model.js
          test -f public/assets/leadership-conversation-render.js
          test -f public/assets/leadership-conversation.js
          test -f public/assets/leadership-conversation.css
          test -f public/assets/leadership-characters.js
          test -f public/assets/leadership-character-view.js
          test -f public/assets/leadership-character-controller.js
