name: SWOT and TOWS Studio tests
on:
  push:
    paths:
      - 'swot-tows-studio.html'
      - 'assets/swot-*.js'
      - 'assets/swot-studio.css'
      - 'tests/swot/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/swot-tests.yml'
  pull_request:
    paths:
      - 'swot-tows-studio.html'
      - 'assets/swot-*.js'
      - 'assets/swot-studio.css'
      - 'tests/swot/**'
      - 'tools.html'
      - 'package.json'
      - '.github/workflows/swot-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swot-studio-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test mapping, strategies, scenarios and interactions
        run: npm run test:swot
      - name: Verify production website assets
        run: |
          npm run build
          test -f public/swot-tows-studio.html
          test -f public/assets/swot-model.js
          test -f public/assets/swot-render.js
          test -f public/assets/swot-studio.js
          test -f public/assets/swot-studio.css
