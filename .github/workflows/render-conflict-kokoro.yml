name: Render Leadership 101 Conflict Kokoro Narration
on:
  push:
    branches:
      - feature/render-conflict-kokoro-audio
    paths:
      - 'scripts/render-conflict-kokoro.mjs'
      - '.github/workflows/render-conflict-kokoro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies and Kokoro (open-source, no paid API)
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund kokoro-js@1.2.1
      - name: Generate 20 character-specific scene WAVs with matching Voice Director settings
        run: node scripts/render-conflict-kokoro.mjs output/conflict-kokoro
      - name: Publish downloadable full-audio asset pack
        uses: actions/upload-artifact@v4
        with:
          name: Leadership_101_Conflict_Kokoro_Narration
          path: output/conflict-kokoro/
          if-no-files-found: error
          retention-days: 30
