name: Root Cause Studio tests
on:
  push:
    paths:
      - 'root-cause-studio.html'
      - 'assets/root-cause-*.js'
      - 'assets/root-cause-studio.css'
      - 'tests/root-cause/**'
      - '.github/workflows/root-cause-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'root-cause-studio.html'
      - 'assets/root-cause-*.js'
      - 'assets/root-cause-studio.css'
      - 'tests/root-cause/**'
      - '.github/workflows/root-cause-tests.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root-cause-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate model and interactive workflow
        run: npm run test:root-cause
