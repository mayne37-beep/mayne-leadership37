name: Stakeholder Mapping Studio tests
on:
  push:
    paths:
      - 'stakeholder-mapping-studio.html'
      - 'assets/stakeholder-*.js'
      - 'assets/stakeholder-studio.css'
      - 'tests/stakeholder/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stakeholder-tests.yml'
  pull_request:
    paths:
      - 'stakeholder-mapping-studio.html'
      - 'assets/stakeholder-*.js'
      - 'assets/stakeholder-studio.css'
      - 'tests/stakeholder/**'
      - 'tools.html'
      - 'package.json'
      - '.github/workflows/stakeholder-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stakeholder-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test stakeholder maps and browser editing interactions
        run: npm run test:stakeholder
      - name: Verify static website build and page assets
        run: |
          npm run build
          test -f public/stakeholder-mapping-studio.html
          test -f public/assets/stakeholder-studio.js
          test -f public/assets/stakeholder-model.js
          test -f public/assets/stakeholder-svg.js
          test -f public/assets/stakeholder-studio.css
