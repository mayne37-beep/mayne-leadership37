name: Video Studio Phase 1
on:
  push:
    paths:
      - 'video-studio.html'
      - 'assets/video-studio*.js'
      - 'assets/video-studio.css'
      - 'tests/video-studio.test.mjs'
      - '.github/workflows/video-studio.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'video-studio.html'
      - 'assets/video-studio*.js'
      - 'assets/video-studio.css'
      - 'tests/video-studio.test.mjs'
      - '.github/workflows/video-studio.yml'
      - 'package.json'
jobs:
  studio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:video
      - name: Ensure editor and authoring assets can be deployed
        run: |
          test -f video-studio.html
          test -f assets/video-studio.js
          test -f assets/video-studio-core.js
          test -f assets/video-studio.css
