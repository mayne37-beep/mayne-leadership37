name: Video Studio
on:
  push:
    paths:
      - 'video-studio.html'
      - 'assets/video-studio*.js'
      - 'assets/video-studio.css'
      - 'assets/video-studio-editor.css'
      - 'assets/video-studio/**'
      - 'tests/video-studio*.mjs'
      - 'tests/video-ai.test.mjs'
      - 'api/video-ai.js'
      - '.github/workflows/video-studio.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'video-studio.html'
      - 'assets/video-studio*.js'
      - 'assets/video-studio.css'
      - 'assets/video-studio/**'
      - 'tests/video-studio*.mjs'
      - '.github/workflows/video-studio.yml'
      - 'package.json'
jobs:
  studio-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:video
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Smoke test actual browser preview and export
        run: node tests/video-studio-browser.mjs
      - name: Test redesigned homepage, storyboard creation, and responsive editor
        run: node tests/video-studio-shell-browser.mjs
      - name: Verify included characters on new devices and in rendered video
        run: node tests/video-studio-characters-browser.mjs
      - name: Ensure editor and authoring assets can be deployed
        run: |
          test -f video-studio.html
          test -f assets/video-studio.js
          test -f assets/video-studio-core.js
          test -f assets/video-studio.css
          test -f assets/video-studio-editor.css
