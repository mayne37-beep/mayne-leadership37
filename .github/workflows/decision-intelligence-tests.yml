name: Decision Intelligence Studio tests
on:
  push:
    paths:
      - 'decision-intelligence-studio.html'
      - 'assets/decision-intelligence*.js'
      - 'assets/decision-intelligence.css'
      - 'assets/operations-crisis-scenario.js'
      - 'tests/decision-intelligence/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/decision-intelligence-tests.yml'
  pull_request:
    paths:
      - 'decision-intelligence-studio.html'
      - 'assets/decision-intelligence*.js'
      - 'assets/decision-intelligence.css'
      - 'assets/operations-crisis-scenario.js'
      - 'tests/decision-intelligence/**'
      - 'tools.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/decision-intelligence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decision-intelligence-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run analytical model and browser editing tests
        run: npm run test:decision-intelligence
      - name: Verify production site build contains decision studio
        run: |
          npm run build
          test -f public/decision-intelligence-studio.html
          test -f public/assets/decision-intelligence-model.js
          test -f public/assets/decision-intelligence-render.js
          test -f public/assets/decision-intelligence.js
          test -f public/assets/decision-intelligence.css
          test -f public/assets/operations-crisis-scenario.js
