<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rating Scale Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:310px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:30px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 22px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center}.livejoin{display:none;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:7px 11px}.livejoin img{width:60px;height:60px;background:#fff;padding:3px;border-radius:6px}.livejoin b{font-size:22px;letter-spacing:.08em}.summary{display:flex;gap:12px;margin-bottom:18px;justify-content:center;flex-wrap:wrap}.metric{background:#ffffff12;border:1px solid #ffffff25;border-radius:14px;padding:12px 22px;text-align:center;min-width:130px}.metric strong{display:block;font-size:34px;color:#f2cb78}.rating{display:flex;gap:10px;align-items:flex-end;height:370px;width:min(900px,95%);border-bottom:2px solid #fff7}.col{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:3px;transition:height .55s cubic-bezier(.2,.8,.2,1)}.n{font-weight:900;margin-bottom:5px}.num{font-size:20px;font-weight:900;margin-top:8px}.ends{display:flex;justify-content:space-between;width:min(900px,95%);margin-top:10px;color:#dceafa;font-weight:800}.mask{padding:90px 20px;text-align:center;font-size:25px;font-weight:900;color:#dceafa}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 40px}.projecting .question{font-size:clamp(34px,4vw,64px)}.projecting .livejoin{display:flex}.projecting .rating{width:min(1300px,95%);height:52vh}.projecting .ends{width:min(1300px,95%)}.exitproj{display:none}.projecting .exitproj{display:block;position:fixed;right:15px;bottom:15px;width:auto;z-index:20;opacity:.18}.projecting .exitproj:hover{opacity:1}@media(max-width:850px){.layout{grid-template-columns:1fr}}</style></head><body>
<header><div style="color:#f2cb78;font-size:12px;font-weight:900">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>★ Rating Scale</h1><div class="sub">Live confidence, readiness, effectiveness, and sentiment measurement</div></header>
<div class="layout"><aside class="panel"><label>Question / Prompt</label><textarea id="q">How confident are you?</textarea>
<div class="grid"><div><label>Scale</label><select id="scale"><option value="5">1–5</option><option value="7">1–7</option><option value="10">1–10</option></select></div><div><label>Visualization</label><select id="display"><option value="distribution">Distribution</option><option value="average">Average spotlight</option></select></div></div>
<label>Low label</label><input id="low" value="Not at all"><label>High label</label><input id="high" value="Very confident">
<button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button>
<div class="livecontrols" id="controls"><div class="statuspill" id="status">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reveal">Reveal results</button><button class="btn alt" id="reset">Reset scale</button><button class="btn alt" id="copy">Copy join link</button></div>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div></aside>
<main class="panel"><div class="stage"><div class="projectbar"><b>MAYNE LEADERSHIP · LIVE</b><div class="livejoin" id="livejoin"><img id="qr"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="summary" class="summary"></div><div id="viz" style="width:100%;display:flex;flex-direction:column;align-items:center"></div><div class="count" id="count">0 responses</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],paused=false,revealed=false,resetAt=null,projecting=false;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function cfg(){return {responseLimit:1,low:$('low').value,high:$('high').value,scale:Number($('scale').value),max:Number($('scale').value)}}function active(){return resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows}
function draw(){$('showQ').textContent=$('q').value;var max=Number($('scale').value),v=Array(max).fill(0),ar=active(),vals=[];ar.forEach(r=>{var x=Number(r.response.value);if(x>=1&&x<=max){v[x-1]++;vals.push(x)}});var total=vals.length,avg=total?vals.reduce((a,b)=>a+b,0)/total:0;$('summary').innerHTML=revealed&&total?'<div class="metric"><span>AVERAGE</span><strong>'+avg.toFixed(1)+'</strong></div><div class="metric"><span>RESPONSES</span><strong>'+total+'</strong></div>':'';if(!revealed){$('viz').innerHTML='<div class="mask">'+(total?total+' response'+(total===1?'':'s')+' received':'Waiting for responses…')+'<br><small>Results hidden until instructor reveal.</small></div>'}else if($('display').value==='average'){$('viz').innerHTML='<div style="text-align:center;padding:55px 20px"><div style="font-size:110px;font-weight:900;color:#f2cb78;line-height:1">'+(total?avg.toFixed(1):'—')+'</div><div style="font-size:24px;margin-top:14px">out of '+max+'</div><div class="ends" style="gap:150px;margin-top:35px"><span>'+$('low').value+'</span><span>'+$('high').value+'</span></div></div>'}else{var peak=Math.max(1,...v);$('viz').innerHTML='<div class="rating">'+v.map((n,i)=>'<div class="col"><div class="n">'+n+'</div><div class="stick" style="height:'+(n/peak*290)+'px"></div><div class="num">'+(i+1)+'</div></div>').join('')+'</div><div class="ends"><span>'+$('low').value+'</span><span>'+$('high').value+'</span></div>'}$('count').textContent=total+' response'+(total===1?'':'s')}
document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);
function project(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=()=>project(!projecting);$('exitproj').onclick=()=>project(false);document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'rating',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('join').style.display='block';$('livejoin').style.display='flex';$('controls').style.display='grid';revealed=false;paused=false;resetAt=null;$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500);draw()}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response,created_at');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('status').textContent=paused?'● Responses paused':'● Accepting responses';this.textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused}};
$('reveal').onclick=function(){revealed=!revealed;this.textContent=revealed?'Hide results':'Reveal results';draw()};$('reset').onclick=function(){if(session&&confirm('Reset the visible scale and count only new responses from this point?')){resetAt=new Date();rows=[];revealed=false;$('reveal').textContent='Reveal results';draw()}};$('copy').onclick=function(){if($('link').href)navigator.clipboard.writeText($('link').href).then(()=>{this.textContent='Copied!';setTimeout(()=>this.textContent='Copy join link',1200)})};
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('controls').style.display='none'};draw()})();</script></body></html>
