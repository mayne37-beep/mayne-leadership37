<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Cloud Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:34px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 28px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.livejoin{display:none;align-items:center;gap:12px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:8px 12px}.livejoin b{font-size:22px;letter-spacing:.08em}.livejoin img{width:62px;height:62px;background:#fff;border-radius:7px;padding:3px}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 38px}.projecting .question{font-size:clamp(34px,4vw,64px);margin:4px 0 18px}.projecting .cloud{width:min(1400px,96%);min-height:68vh}.projecting .projectbar{display:flex}.projecting .livejoin{display:flex}.projecting .count{font-size:18px}.exitproj{display:none}.projecting .exitproj{display:inline-block;position:fixed;right:16px;bottom:16px;z-index:20;width:auto;opacity:.18}.projecting .exitproj:hover{opacity:1}.bars,.wall,.rank{width:min(900px,94%);display:grid;gap:12px}.barrow{background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:13px}.barhead{display:flex;justify-content:space-between;font-weight:800}.track{height:16px;background:#ffffff18;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e1af4f,#f3d18a);border-radius:20px;transition:width .45s}.cloud{width:min(950px,94%);min-height:430px;background:#fff;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:12px 20px;color:var(--n)}.word{font-weight:900;position:absolute;white-space:nowrap;line-height:1;transition:font-size .45s,opacity .35s,transform .45s;animation:pop .35s ease both}.cloud{position:relative;overflow:hidden}.emptycloud{position:absolute;inset:0;display:grid;place-items:center;color:#8293a3;font-weight:800;text-align:center;padding:30px}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}.rating{display:flex;gap:12px;align-items:flex-end;height:390px;width:min(850px,94%);border-bottom:2px solid #fff8}.col{flex:1;text-align:center}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:4px;transition:height .45s}.num{font-size:20px;font-weight:900;margin-top:8px}.cards{width:min(1000px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;color:var(--n);padding:18px;border-radius:14px;min-height:110px;box-shadow:0 8px 20px #0003}.agree{width:min(900px,94%)}.agreebar{height:34px;border-radius:20px;background:linear-gradient(90deg,#c35a54,#e1af4f,#4a9b73);position:relative}.marker{position:absolute;top:-8px;width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid var(--g);transform:translateX(-50%)}.ends{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}.rankitem{display:flex;gap:14px;align-items:center;background:#fff;color:var(--n);padding:16px;border-radius:13px}.ranknum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-weight:900}.score{margin-left:auto;font-weight:900;color:var(--b)}@media(max-width:850px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><header><div style="color:#f2cb78;font-size:12px;font-weight:900">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>☁ Word Cloud</h1><div class="sub">Independent activity lab · live student responses</div></header><div class="layout"><aside class="panel">

<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],hidden=false,projecting=false;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function cfg(){return {responseLimit:Number($('limit').value)}}function safe(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}function hash(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h)}function draw(){ $('showQ').textContent=$('q').value;var a=rows.map(r=>String(r.response.value||'').trim().replace(/\s+/g,' ')).filter(Boolean),f={};a.forEach(w=>{var k=w.toLocaleLowerCase();if(!f[k])f[k]={w:w,n:0};f[k].n++});var words=Object.values(f).sort((a,b)=>b.n-a.n),max=words.length?words[0].n:1,pals={mixed:['#2767a4','#b8862d','#2f8f83','#8b5fbf','#d6654f'],cool:['#2767a4','#3f7fb8','#2f8f83','#6c63a8'],warm:['#b85c38','#d28b35','#b36b7a','#c59b32'],brand:['#102b4b','#2767a4','#b8862d','#52708d']},pal=pals[$('palette').value],cloud=$('cloud');cloud.style.background=$('theme').value==='dark'?'#0b1c30':'#fff';if(hidden){cloud.innerHTML='<div class="emptycloud" style="color:'+( $('theme').value==='dark'?'#dceafa':'#8293a3')+'">Results hidden<br><small>Responses are still being collected.</small></div>'}else if(!words.length){cloud.innerHTML='<div class="emptycloud">Waiting for responses…</div>'}else if($('display').value==='top'){cloud.innerHTML='<div style="position:absolute;inset:25px;display:grid;align-content:center;gap:10px">'+words.slice(0,10).map((x,i)=>'<div style="display:flex;align-items:center;gap:12px;color:'+pal[i%pal.length]+'"><b style="font-size:'+(34-i*1.5)+'px">'+safe(x.w)+'</b><span style="margin-left:auto;font-weight:900">'+x.n+'</span></div>').join('')+'</div>'}else{var W=900,H=400,placed=[];cloud.innerHTML='';words.slice(0,55).forEach((x,i)=>{var size=Math.round(18+54*Math.sqrt(x.n/max)),el=document.createElement('span');el.className='word';el.textContent=x.w;el.style.fontSize=size+'px';el.style.color=pal[hash(x.w)%pal.length];cloud.appendChild(el);var ew=Math.min(330,x.w.length*size*.56),eh=size*1.08,found=null;for(var t=0;t<800;t++){var ang=t*.52,r=3+2.2*Math.sqrt(t),cx=W/2+Math.cos(ang)*r,cy=H/2+Math.sin(ang)*r*.62,left=cx-ew/2,top=cy-eh/2,box={l:left,t:top,r:left+ew,b:top+eh};if(left<4||top<4||box.r>W-4||box.b>H-4)continue;var hit=placed.some(p=>!(box.r+5<p.l||box.l-5>p.r||box.b+4<p.t||box.t-4>p.b));if(!hit){found=box;placed.push(box);break}}if(found){el.style.left=(found.l/W*100)+'%';el.style.top=(found.t/H*100)+'%'}else el.style.display='none'})}$('count').textContent=a.length+' response'+(a.length===1?'':'s')+' · '+words.length+' unique'}
document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);$('hide').onclick=function(){hidden=!hidden;this.textContent=hidden?'Show results':'Hide results';draw()};
function setProject(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=function(){setProject(!projecting)};$('exitproj').onclick=function(){setProject(false)};document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000));var r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'wordcloud',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('livejoin').style.display='flex';$('join').style.display='block';$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500)}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response');draw()}catch(e){}}
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true};draw()})();</script></body></html>
