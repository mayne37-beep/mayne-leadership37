<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Cloud Lab | Mayne Leadership</title><style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:300px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea,select{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:34px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 28px;max-width:1000px}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}.count{margin-top:auto;padding-top:18px;font-weight:800;color:#dceafa}.projectbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.livejoin{display:none;align-items:center;gap:12px;background:#ffffff12;border:1px solid #ffffff2c;border-radius:12px;padding:8px 12px}.livejoin b{font-size:22px;letter-spacing:.08em}.livejoin img{width:62px;height:62px;background:#fff;border-radius:7px;padding:3px}.projecting header,.projecting aside{display:none}.projecting .layout{display:block;max-width:none;margin:0;padding:0}.projecting main.panel{padding:0;border:0;border-radius:0;box-shadow:none}.projecting .stage{min-height:100vh;border-radius:0;padding:24px 38px}.projecting .question{font-size:clamp(34px,4vw,64px);margin:4px 0 18px}.projecting .cloud{width:min(1400px,96%);min-height:68vh}.projecting .projectbar{display:flex}.projecting .livejoin{display:flex}.projecting .count{font-size:18px}.livecontrols{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:8px}.livecontrols .btn{margin:0}.statuspill{grid-column:1/-1;text-align:center;padding:7px;border-radius:999px;background:#edf5fb;font-weight:900;color:var(--b)}.word.selected{outline:3px solid #e1af4f;outline-offset:5px;z-index:5}.focuscard{display:none;position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#102b4be8;color:#fff;border:1px solid #ffffff33;border-radius:12px;padding:10px 16px;z-index:10;font-weight:800}.exitproj{display:none}.projecting .exitproj{display:inline-block;position:fixed;right:16px;bottom:16px;z-index:20;width:auto;opacity:.18}.projecting .exitproj:hover{opacity:1}.bars,.wall,.rank{width:min(900px,94%);display:grid;gap:12px}.barrow{background:#ffffff12;border:1px solid #ffffff28;border-radius:12px;padding:13px}.barhead{display:flex;justify-content:space-between;font-weight:800}.track{height:16px;background:#ffffff18;border-radius:20px;margin-top:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#e1af4f,#f3d18a);border-radius:20px;transition:width .45s}.cloud{width:min(950px,94%);min-height:430px;background:#fff;border-radius:20px;padding:28px;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:12px 20px;color:var(--n)}.word{font-weight:900;position:relative;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;padding:3px 4px;border:0;background:transparent;cursor:pointer;transition:font-size .35s,color .25s,transform .2s}.word:hover{transform:scale(1.06)}.cloud{position:relative;overflow:visible;min-width:0}.wordflow{display:flex;align-items:center;align-content:center;justify-content:center;flex-wrap:wrap;gap:10px 15px;min-height:350px;width:100%}.projecting .wordflow{min-height:60vh}.emptycloud{position:relative;min-height:350px;width:100%}.emptycloud{position:absolute;inset:0;display:grid;place-items:center;color:#8293a3;font-weight:800;text-align:center;padding:30px}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}.rating{display:flex;gap:12px;align-items:flex-end;height:390px;width:min(850px,94%);border-bottom:2px solid #fff8}.col{flex:1;text-align:center}.stick{background:linear-gradient(#f1c568,#d99e32);border-radius:10px 10px 0 0;min-height:4px;transition:height .45s}.num{font-size:20px;font-weight:900;margin-top:8px}.cards{width:min(1000px,96%);display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;color:var(--n);padding:18px;border-radius:14px;min-height:110px;box-shadow:0 8px 20px #0003}.agree{width:min(900px,94%)}.agreebar{height:34px;border-radius:20px;background:linear-gradient(90deg,#c35a54,#e1af4f,#4a9b73);position:relative}.marker{position:absolute;top:-8px;width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid var(--g);transform:translateX(-50%)}.ends{display:flex;justify-content:space-between;margin-top:14px;font-weight:800}.rankitem{display:flex;gap:14px;align-items:center;background:#fff;color:var(--n);padding:16px;border-radius:13px}.ranknum{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--n);color:#fff;font-weight:900}.score{margin-left:auto;font-weight:900;color:var(--b)}@medi header{box-shadow:0 6px 24px #102b4b24}.panel{transition:box-shadow .25s,transform .25s}.btn{transition:transform .15s,box-shadow .2s,opacity .2s}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 15px #17395a20}.btn:disabled{opacity:.48;cursor:not-allowed}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1af4f88;outline-offset:2px}.stage{overflow:hidden}.question{line-height:1.12}.suitebadge{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff25;color:#f2cb78;font-size:11px;font-weight:900;letter-spacing:.08em}.suitebadge:before{content:'●';font-size:8px}.join{box-shadow:inset 0 0 0 1px #fff}.code{font-variant-numeric:tabular-nums}.count{letter-spacing:.02em}.projecting .count{font-size:17px}.projecting .suitebadge{display:none}@media(max-width:600px){header{padding:18px}h1{font-size:27px}.layout{padding:0 10px}.panel{padding:12px}.stage{min-height:560px;padding:20px 12px}.question{font-size:26px}}
</style></head><body><header><div class="suitebadge">MAYNE LEADERSHIP · LIVE ENGAGEMENT</div><h1>☁ Word Cloud</h1><div class="sub">Independent activity lab · live student responses</div></header><div class="layout"><aside class="panel">
<label>Question / Prompt</label><textarea id="q">What word comes to mind?</textarea><label>Responses per student</label><select id="limit"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option></select><label>Word colors</label><select id="palette"><option value="mixed">Mixed</option><option value="cool">Cool</option><option value="warm">Warm</option><option value="brand">Blue & Gold</option></select><label>Cloud background</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select><label>Display</label><select id="display"><option value="cloud">Organic cloud</option><option value="top">Top responses</option></select><button class="btn alt" id="hide">Hide results</button>
<button class="btn" id="start">Start live session</button><button class="btn alt" id="project">Projector / Full Screen</button><button class="btn alt" id="stop" disabled>Stop session</button><div class="livecontrols" id="livecontrols"><div class="statuspill" id="liveStatus">● Accepting responses</div><button class="btn alt" id="pause">Pause responses</button><button class="btn alt" id="reset">Reset cloud</button><button class="btn alt" id="clearFocus">Clear highlight</button><button class="btn alt" id="copy">Copy join link</button></div>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div>
</aside><main class="panel"><div class="stage"><div class="projectbar"><div class="suitebadge">MAYNE LEADERSHIP · LIVE</div><div class="livejoin" id="livejoin"><img id="qr" alt="QR code"><div><div style="font-size:11px;color:#dceafa">JOIN · SCAN OR ENTER CODE</div><b id="pcode">------</b></div></div></div><div class="question" id="showQ"></div><div id="viz" style="width:100%;display:flex;justify-content:center"><div class="cloud" id="cloud"></div></div><div class="count" id="count">0 responses</div></div></main></div><button class="btn exitproj" id="exitproj">Exit projector</button>
<script>(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,rows=[],hidden=false,projecting=false,cloudState={},paused=false,resetAt=null,focusKey=null;
function $(id){return document.getElementById(id)}function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function cfg(){return {responseLimit:Number($('limit').value)}}function safe(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}function hash(s){var h=0;for(var i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i)|0;return Math.abs(h)}
function frequencies(){
 var sourceRows=resetAt?rows.filter(r=>new Date(r.created_at)>resetAt):rows;
 var all=[],map=Object.create(null);
 sourceRows.forEach(function(r){
  var raw=r&&r.response&&r.response.value;
  if(raw===null||raw===undefined)return;
  var word=String(raw).trim().replace(/\s+/g,' ').replace(/^[.,!?;:"'“”‘’]+|[.,!?;:"'“”‘’]+$/g,'').trim();
  if(!word)return;
  all.push(word);
  var key=word.toLocaleLowerCase();
  if(!map[key])map[key]={key:key,w:word,n:0};
  map[key].n++;
 });
 return {all:all,words:Object.values(map).sort((x,y)=>y.n-x.n||x.w.localeCompare(y.w))};
}
function displayWordSize(word,index,total,maxCount,containerWidth){
 var density=Math.max(.57,Math.min(1,Math.sqrt(20/Math.max(12,total))));
 var mobile=Math.max(.62,Math.min(1,containerWidth/780));
 var weight=maxCount>1?Math.sqrt(word.n/maxCount):(.52+.48*(1-index/Math.max(1,total)));
 return Math.max(15,Math.round((17+50*weight)*density*mobile));
}
function draw(){
 $('showQ').textContent=$('q').value;
 var d=frequencies(),all=d.all,words=d.words,max=words.length?words[0].n:1;
 var pals={mixed:['#2767a4','#b8862d','#2f8f83','#8b5fbf','#d6654f'],cool:['#2767a4','#3f7fb8','#2f8f83','#6c63a8'],warm:['#b85c38','#d28b35','#b36b7a','#c59b32'],brand:['#102b4b','#2767a4','#b8862d','#52708d']};
 var pal=pals[$('palette').value]||pals.mixed, cloud=$('cloud'),dark=$('theme').value==='dark';
 cloud.style.background=dark?'#0b1c30':'#fff';
 var mode=$('display').value;
 if(hidden){
  cloud.innerHTML='<div class="emptycloud" style="display:grid;place-items:center;color:'+(dark?'#dceafa':'#8293a3')+'">Results hidden — responses are still being collected.</div>';
 }else if(!words.length){
  cloud.innerHTML='<div class="emptycloud" style="display:grid;place-items:center;color:'+(dark?'#dceafa':'#8293a3')+'">Waiting for responses…</div>';
 }else if(mode==='top'){
  cloud.innerHTML='<div style="width:min(100%,720px);display:grid;align-content:center;gap:10px;min-height:340px">'+words.slice(0,10).map((x,i)=>'<div style="display:flex;align-items:center;gap:12px;color:'+pal[i%pal.length]+'"><b style="font-size:'+Math.max(18,34-i*1.5)+'px;overflow-wrap:anywhere">'+safe(x.w)+'</b><span style="margin-left:auto;font-weight:900">'+x.n+'</span></div>').join('')+'</div>';
 }else{
  var flow=cloud.querySelector('.wordflow');
  if(!flow){cloud.replaceChildren();flow=document.createElement('div');flow.className='wordflow';cloud.appendChild(flow)}
  var chosen=words.slice(0,65), existing=new Map(Array.from(flow.querySelectorAll('.word')).map(el=>[el.dataset.key,el]));
  chosen.forEach((x,i)=>{
   var el=existing.get(x.key);if(!el){el=document.createElement('button');el.type='button';el.className='word';el.dataset.key=x.key}
   el.textContent=x.w;
   el.title=x.w+' — '+x.n+' response'+(x.n===1?'':'s')+' (click to highlight)';
   el.setAttribute('aria-pressed',String(focusKey===x.key));
   el.classList.toggle('selected',focusKey===x.key);
   var hue=pal[hash(x.key)%pal.length];
   // Use higher-contrast variants on the dark background.
   var lightColors={ '#102b4b':'#a5cfff','#2767a4':'#8fc6fc','#b8862d':'#f5ce77','#52708d':'#bad6ee','#2f8f83':'#81e0c7','#3f7fb8':'#a9d7ff','#6c63a8':'#d2c7ff','#b85c38':'#ffa580','#d28b35':'#ffd084','#b36b7a':'#f6a9bc','#c59b32':'#f6d47f','#8b5fbf':'#dec0ff','#d6654f':'#ffc1ac' };
   el.style.color=dark?(lightColors[hue]||'#f1cd79'):hue;
   el.style.fontSize=displayWordSize(x,i,chosen.length,max,cloud.clientWidth||900)+'px';
   el.onclick=function(){focusKey=focusKey===x.key?null:x.key;draw()};
   flow.appendChild(el);
   existing.delete(x.key);
  });
  existing.forEach(el=>el.remove());
  var fc=cloud.querySelector('#focuscard');
  var focused=chosen.find(w=>w.key===focusKey);
  if(!fc){fc=document.createElement('div');fc.className='focuscard';fc.id='focuscard';cloud.appendChild(fc)}
  fc.style.display=focused?'block':'none';
  if(focused)fc.textContent=focused.w+' · '+focused.n+' response'+(focused.n===1?'':'s');
 }
 $('count').textContent=all.length+' response'+(all.length===1?'':'s')+' · '+words.length+' unique'+(words.length>65&&mode==='cloud'&&!hidden?' · showing top 65':'');
}

document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=draw);window.addEventListener('resize',draw);$('hide').onclick=function(){hidden=!hidden;this.textContent=hidden?'Show results':'Hide results';draw()};
function setProject(on){projecting=on;document.body.classList.toggle('projecting',on);$('project').textContent=on?'Exit Projector':'Projector / Full Screen';if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});draw()}$('project').onclick=function(){setProject(!projecting)};$('exitproj').onclick=function(){setProject(false)};document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&projecting){projecting=false;document.body.classList.remove('projecting');$('project').textContent='Projector / Full Screen'}});$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000));var r=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'wordcloud',question:$('q').value,config:cfg()})});session=r[0];$('code').textContent=code;$('pcode').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url);$('livejoin').style.display='flex';$('join').style.display='block';$('livecontrols').style.display='grid';paused=false;resetAt=null;focusKey=null;$('liveStatus').textContent='● Accepting responses';$('pause').textContent='Pause responses';$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500)}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response,created_at');draw()}catch(e){}}
$('pause').onclick=async function(){if(!session)return;paused=!paused;try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:!paused})});$('liveStatus').textContent=paused?'● Responses paused':'● Accepting responses';$('pause').textContent=paused?'Resume responses':'Pause responses'}catch(e){paused=!paused;alert('Could not change response status')}};$('reset').onclick=function(){if(!session)return;if(confirm('Clear the visible cloud and begin counting new responses from this point?')){resetAt=new Date();focusKey=null;rows=[];draw()}};$('clearFocus').onclick=function(){focusKey=null;var fc=$('focuscard');if(fc)fc.style.display='none';draw()};$('copy').onclick=function(){var a=$('link');if(a&&a.href)navigator.clipboard.writeText(a.href).then(()=>{$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy join link',1200)})};$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true;$('livecontrols').style.display='none'};draw()})();</script></body></html>
