<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Pressure Office</title><desc id="desc">Fictional Cedar Ridge workplace leadership simulation environment with evidence objects, dramatic but accessible blue and gold lighting.</desc><defs>
