<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Accountability Review Boardroom</title><desc id="desc">Fictional Cedar Ridge workplace leadership simulation environment with evidence objects, dramatic but accessible blue and gold lighting.</desc><defs>
<linearGradient id="wall" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142d49"/><stop offset=".53" stop-color="#31577c"/><stop offset="1" stop-color="#748a96"/></linearGradient>
<linearGradient id="glass" x1="0" x2="0.2" y1="0" y2="1"><stop stop-color="#aac9da"/><stop offset=".65" stop-color="#668dab"/><stop offset="1" stop-color="#163c5d"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#253f59"/><stop offset="1" stop-color="#132337"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#815b42"/><stop offset=".55" stop-color="#382e36"/><stop offset="1" stop-color="#121f31"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173854"/><stop offset="1" stop-color="#06182f"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8dfa0"/><stop offset=".52" stop-color="#d3a55e"/><stop offset="1" stop-color="#8d6133"/></linearGradient>
<radialGradient id="spot"><stop stop-color="#f5c67a" stop-opacity=".58"/><stop offset="1" stop-color="#f5c67a" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-30%" y="-40%" width="170%" height="200%"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dx="0" dy="18"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="lines" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M 42 0 L0 0 0 42" fill="none" stroke="#ffffff" opacity=".055"/></pattern>
</defs>
