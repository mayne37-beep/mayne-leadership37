<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XY Quadrant Lab | Mayne Leadership</title>
<style>
:root{--n:#102b4b;--b:#2767a4;--g:#e1af4f;--bg:#f4f8fc;--line:#d8e4ee;--muted:#627487}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 Segoe UI,Arial,sans-serif;color:var(--n)}header{background:linear-gradient(120deg,#102b4b,#2767a4);color:#fff;padding:22px max(20px,calc((100% - 1400px)/2))}h1{margin:2px 0;font-size:32px}.sub{color:#dceafa}.layout{max-width:1400px;margin:18px auto;padding:0 18px;display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 10px 30px #17395a12}label{display:block;font-weight:800;margin-top:11px}input,textarea{width:100%;padding:10px;border:1px solid #c8d8e5;border-radius:9px;font:inherit}textarea{height:70px}.btn{border:0;border-radius:9px;padding:11px 13px;background:var(--b);color:#fff;font-weight:800;cursor:pointer;margin-top:12px;width:100%}.btn.alt{background:#fff;color:var(--n);border:1px solid var(--line)}.code{font-size:30px;font-weight:900;letter-spacing:.08em;text-align:center}.small{font-size:12px;color:var(--muted)}.stage{min-height:700px;background:radial-gradient(circle at 18% 20%,#e1af4f3d,transparent 28%),radial-gradient(circle at 82% 78%,#4a9bd647,transparent 32%),linear-gradient(135deg,#091d35,#123f69 46%,#0d2947);border-radius:14px;color:#fff;padding:28px;display:flex;flex-direction:column;align-items:center}.question{font-size:clamp(25px,3vw,42px);font-weight:900;text-align:center;margin:8px 0 22px}.chartwrap{width:min(850px,86%);position:relative;padding-left:60px;padding-bottom:48px}.chart{height:500px;position:relative;border:2px solid #ffffffbb;border-radius:10px;background:linear-gradient(90deg,#ffffff0a 50%,#e1af4f18 50%),linear-gradient(0deg,#ffffff0a 50%,#2767a426 50%)}.chart:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid #ffffff88}.chart:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px solid #ffffff88}.dot{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--g);border:3px solid #fff;transform:translate(-50%,50%);box-shadow:0 2px 10px #0008}.xaxis{font-weight:900;text-align:center;margin-top:12px}.yaxis{position:absolute;left:0;top:245px;transform:rotate(-90deg) translateX(-50%);transform-origin:left top;font-weight:900}.edge{position:absolute;font-size:12px;font-weight:800}.xl{left:62px;bottom:24px}.xh{right:0;bottom:24px}.yl{left:4px;bottom:55px}.yh{left:4px;top:4px}.count{margin-top:8px;font-weight:800;color:#dceafa}.join{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fbfd;display:none}.join a{color:var(--b);font-weight:800;word-break:break-all}@media(max-width:850px){.layout{grid-template-columns:1fr}.chart{height:420px}}
</style></head><body>
<header><div class="small" style="color:#f2cb78;font-weight:900">ISOLATED TEST TOOL</div><h1>XY Quadrant Lab</h1><div class="sub">A standalone live-response prototype. It does not modify Presenter Studio.</div></header>
<div class="layout"><aside class="panel">
<label>Prompt</label><textarea id="q">Where would you place yourself?</textarea>
<label>X axis</label><input id="x" value="Level of Support"><input id="xl" value="Low Support"><input id="xh" value="High Support">
<label>Y axis</label><input id="y" value="Power / Influence"><input id="yl" value="Low Power"><input id="yh" value="High Power">
<button class="btn" id="start">Start test session</button><button class="btn alt" id="stop" disabled>Stop session</button><button class="btn alt" id="clear">Clear plotted responses</button>
<div class="join" id="join"><div class="small">STUDENT CODE</div><div class="code" id="code"></div><div class="small">Open on a phone:</div><a id="link" target="_blank"></a></div>
</aside><main class="panel"><div class="stage"><div class="question" id="showQ"></div><div class="chartwrap"><div class="yaxis" id="showY"></div><span class="edge yh" id="showYH"></span><span class="edge yl" id="showYL"></span><div class="chart" id="chart"></div><span class="edge xl" id="showXL"></span><span class="edge xh" id="showXH"></span><div class="xaxis" id="showX"></div></div><div class="count" id="count">0 responses</div></div></main></div>
<script>
(function(){var U='https://vteamreihsunsllwcphw.supabase.co',K='sb_publishable_dFlcGsz0Fu1TifebqIu4fQ_6aLjG7ud',session=null,timer=null,points=[];
function $(id){return document.getElementById(id)}function esc(v){var d=document.createElement('div');d.textContent=v;return d.innerHTML}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'apikey':K,'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});return fetch(U+'/rest/v1/'+path,opt).then(r=>r.text().then(t=>{if(!r.ok)throw Error(t);return t?JSON.parse(t):[]}))}
function draw(){ $('showQ').textContent=$('q').value;$('showX').textContent=$('x').value;$('showY').textContent=$('y').value;$('showXL').textContent=$('xl').value;$('showXH').textContent=$('xh').value;$('showYL').textContent=$('yl').value;$('showYH').textContent=$('yh').value;$('chart').innerHTML=points.map(p=>'<span class="dot" title="X '+p.x+', Y '+p.y+'" style="left:'+((p.x-1)/9*100)+'%;bottom:'+((p.y-1)/9*100)+'%"></span>').join('');$('count').textContent=points.length+' response'+(points.length===1?'':'s')}
['q','x','y','xl','xh','yl','yh'].forEach(id=>$(id).oninput=draw);
$('start').onclick=async function(){try{var code=String(Math.floor(100000+Math.random()*900000)),config={responseLimit:1,x:$('x').value,y:$('y').value,xLow:$('xl').value,xHigh:$('xh').value,yLow:$('yl').value,yHigh:$('yh').value};var rows=await api('presenter_sessions',{method:'POST',body:JSON.stringify({code:code,activity_type:'quadrant',question:$('q').value,config:config})});session=rows[0];$('code').textContent=code;var url='https://mayneleadership.com/presenter-respond.html?code='+code;$('link').href=url;$('link').textContent=url;$('join').style.display='block';$('start').disabled=true;$('stop').disabled=false;poll();timer=setInterval(poll,1500)}catch(e){alert('Could not start session: '+e.message)}};
async function poll(){if(!session)return;try{var rows=await api('presenter_responses?session_id=eq.'+session.id+'&select=response');points=rows.map(r=>r.response.value).filter(v=>v&&v.x>=1&&v.x<=10&&v.y>=1&&v.y<=10);draw()}catch(e){}}
$('stop').onclick=async function(){if(session)try{await api('presenter_sessions?id=eq.'+session.id,{method:'PATCH',body:JSON.stringify({is_open:false})})}catch(e){}session=null;clearInterval(timer);$('start').disabled=false;$('stop').disabled=true};
$('clear').onclick=function(){points=[];draw()};draw()})();
</script></body></html>
