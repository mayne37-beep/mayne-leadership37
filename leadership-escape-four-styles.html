const SCENE_HINTS={hub:['Find the three glowing hotspots and read the evidence.','Read the Director’s message, delivery dashboard, and unsent staff messages.','The investigation needs three different sources before the four labs unlock.'],vision:['Build a vision that connects purpose, direction, and ownership.','Use the three strongest actions, leaving empty slogans and threats unused.','Order them: the reason for change, a credible future, then employee involvement.'],performance:['Transactional leadership needs clear expectations and fair feedback.','Extremely high monitoring with no recognition can erode trust.','Try expectations 65–90, check-ins 40–75, and recognition 40–85.'],service:['The people closest to the work can identify obstacles.','Ask three open questions and use your ten support tokens carefully.','Choose listening, bottleneck removal, and coaching. Their combined cost is nine.'],autonomy:['Find the difference between autonomy and abandoned responsibilities.','Investigate all three risk signals before building a delegation agreement.','Set decision rights, check-ins, and leader availability. The “vanish” options are not guardrails.'],vault:['Four leadership dilemmas need different responses.','Transformational, transactional, and servant styles address different needs; absent leadership is a danger sign.','The expert team needs delegated authority with check-ins, not laissez-faire neglect; code digits come from the four completed labs.']};
const KEY='Leadership101_FourStyles_Protocol_v1';
const init=()=>({started:false,name:'',scene:'hub',evidence:[],vision:['','',''],selectedPiece:'',performance:{expect:50,checkins:50,reward:50},interviewed:[],selectedSupport:[],risk:[],rails:[],finalCases:{},solved:{},digits:[],metrics:{trust:54,clarity:51,engagement:49,delivery:59},log:[],usedHints:0,attempts:0,seconds:0,finished:false,code:'',message:'',firstWrong:0});
let s=init();try{const saved=localStorage.getItem(KEY);if(saved){const j=JSON.parse(saved);if(j&&j.metrics&&Array.isArray(j.evidence)&&j.performance){s={...init(),...j}}}}catch(e){}
const $=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function journal(t){s.log.push(t);s.log=s.log.slice(-80)}
function metrics(o){for(const [k,v] of Object.entries(o))s.metrics[k]=clamp(s.metrics[k]+v)}
let toastTimeout;function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('on'),3500)}
function modal(html){$('modalContent').innerHTML=html;$('modalBackdrop').classList.add('open');$('closeModal').focus()}
function closeModal(){$('modalBackdrop').classList.remove('open')}
function done(id,pin,change,why){if(s.solved[id])return;s.solved[id]=true;s.digits.push({scene:id,digit:pin});metrics(change);journal('✓ '+why+' · Access fragment '+pin);persist();toast('Challenge complete! Security fragment '+pin+' recovered.');render()}
function pic(face){return IMG[face]||IMG.hub}
function progress(){return Object.keys(s.solved).length}
function phase(){return SCENES.find(x=>x[0]===s.scene)||SCENES[0]}
function sceneButton(id){const item=SCENES.find(x=>x[0]===id),current=s.scene===id,solved=s.solved[id],locked=id!=='hub'&&id!=='vault'&&s.evidence.length<3;return `<button class="navButton ${current?'active':''} ${solved?'done':''}" data-nav="${id}" ${locked?'disabled title="Investigate three sources first"':''}><b><span class="number">${SCENES.indexOf(item)+1}</span> ${esc(item[1])}</b><span class="sm">${solved?'✓ Solved':locked?'🔒 Locked':esc(item[2])}</span></button>`}
function objectiveList(){const arr=[['hub','Investigate the organization',s.evidence.length>=3],['vision','Create a meaningful vision',!!s.solved.vision],['performance','Calibrate performance systems',!!s.solved.performance],['service','Remove employee barriers',!!s.solved.service],['autonomy','Repair absent leadership',!!s.solved.autonomy],['vault','Resolve the final crisis and escape',s.finished]];return arr.map((a,i)=>`<div class="objective ${a[2]?'done':a[0]===s.scene?'active':''}"><span class="roundmark">${a[2]?'✓':i+1}</span><span>${esc(a[1])}</span></div>`).join('')}
function render(){ $('hintNum').textContent=3-s.usedHints; if(!s.started){renderIntro();return}const item=phase(), allowed=s.evidence.length>=3;
$('content').innerHTML=`<div class="game"><aside class="sidebar sideLeft"><section class="pane"><div class="sectionlabel">Mission objectives</div>${objectiveList()}<div class="rule"></div><div class="small">Completed laboratories: <b>${progress()}/4</b></div><div class="progress" style="margin-top:8px"><div class="fill green" style="width:${progress()*25}%"></div></div></section><section class="pane"><div class="sectionlabel">Recovered fragments</div>${['vision','performance','service','autonomy'].map((id,i)=>`<div class="objective"><span class="roundmark">${s.solved[id]?PIN[id]:'?'}</span>${esc(STYLE[id==='vision'?'transformational':id==='performance'?'transactional':id==='service'?'servant':'laissez'].name)}</div>`).join('')}</section></aside><main class="main"><header class="missionTitle"><div><div class="eyebrow">The Meridian Service Initiative · Field operation ${SCENES.indexOf(item)+1} of 6</div><h1>${esc(item[1])}</h1><p>${esc(item[2])} ${s.solved[s.scene]?'· Challenge completed':''}</p></div><span class="tag">${progress()} / 4 labs cleared</span><select id="mobileScene" aria-label="Choose room">${SCENES.map(x=>`<option value="${x[0]}" ${x[0]===s.scene?'selected':''}>${esc(x[1])}</option>`).join('')}</select></header>${stageHTML()}<section class="workspace" id="workspace">${workHTML()}</section><nav class="sceneNav" aria-label="Mission rooms">${SCENES.map(x=>sceneButton(x[0])).join('')}</nav></main><aside class="sidebar sideRight"><section class="pane"><div class="sectionlabel">Live organizational signals</div>${measure('Trust','trust','green')}${measure('Clarity','clarity','')}${measure('Engagement','engagement','gold')}${measure('Service delivery','delivery','')}</section><section class="pane"><div class="sectionlabel">Leadership field note</div><div class="small" style="line-height:1.65">${sceneNote()}</div><div class="rule"></div><button class="btn sm full" data-casebook="1">▤ Review casebook</button></section></aside></div>`;persist();}
function sceneNote(){return ({hub:'Diagnose before choosing a style. One leader cannot solve every need with a single habitual response.',vision:'Transformational leadership inspires purpose, encourages new thinking, and develops commitment.',performance:'Transactional leadership can make expectations and fair exchanges explicit; overcontrol can damage trust.',service:'Servant leadership asks what people need to succeed, and takes action to remove constraints.',autonomy:'Laissez-faire leadership involves avoidance or non-intervention. Empowering delegation still requires accountability.',vault:'A leadership response should fit the problem. These styles are lenses, not boxes for labeling people.'})[s.scene]}
function measure(label,k,color){return `<div class="measure"><div class="measureHead"><span>${label}</span><b>${s.metrics[k]}</b></div><div class="progress"><div class="fill ${color}" style="width:${s.metrics[k]}%"></div></div></div>`}
function stageHTML(){let img=IMG[s.scene]||IMG.hub,spots='';if(s.scene==='hub')spots=EVIDENCE.map(e=>hotspot(e.id,e.title,e.x,e.y,s.evidence.includes(e.id),'evidence')).join('');if(s.scene==='autonomy')spots=RISK.map(e=>hotspot(e.id,e.name,e.x,e.y,s.risk.includes(e.id),'risk')).join('');if(s.scene==='service')spots=PEOPLE.map((p,i)=>hotspot(p.id,'Talk to '+p.name,27+i*22,59,s.interviewed.includes(p.id),'person')).join('');const headlines={hub:['The organization is divided','Diagnose what the employees really need before selecting a style.'],vision:['The Vision Atrium','Restore purpose, a credible future, and employee ownership.'],performance:['The Performance Bay','Clear standards. Fair check-ins. Recognition people can trust.'],service:['The People First Studio','Employees are blocked by systems they did not design.'],autonomy:['The Silent Leadership Loft','The expert team has freedom—and no one to turn to.'],vault:['The Executive Vault','Apply leadership judgment to four urgent moments, then enter the access code.']};return `<div class="stage"><div class="stageBg" style="background-image:url('${img}')"></div><div class="stageBanner"><h2>${headlines[s.scene][0]}</h2><p>${headlines[s.scene][1]}</p></div>${spots}<div class="stageBottom"><span class="tip">${s.scene==='hub'?'Find 3 glowing pieces of evidence':s.scene==='service'?'Interview all three employees':s.scene==='autonomy'?'Locate 3 ignored warning signs':'Complete the interactive challenge below'}</span><span class="tag">${s.solved[s.scene]?'✓ ACCESS GRANTED':s.scene==='hub'?s.evidence.length+'/3 SOURCES':'LIVE SIMULATION'}</span></div></div>`}
function hotspot(id,label,x,y,seen,kind){return `<button class="spot ${seen?'seen':''}" data-${kind}="${id}" style="--x:${x}%;--y:${y}%">${seen?'✓ ':''}${esc(label)}</button>`}
function workHTML(){switch(s.scene){case 'hub':return hubHTML();case 'vision':return visionHTML();case 'performance':return performanceHTML();case 'service':return serviceHTML();case 'autonomy':return autonomyHTML();case 'vault':return vaultHTML()}}
function hubHTML(){return `<div class="workhead"><div><div class="eyebrow">Assignment briefing</div><h2>Four leadership habits. One system under pressure.</h2><p>You are interim director at Meridian Community Services. With 45 days until the citizen-service portal launches, employees are asking for guidance, voice, support, and accountability.</p></div><span class="tag">${s.evidence.length} / 3 files</span></div><div class="grid">${EVIDENCE.map(e=>`<button class="choice ${s.evidence.includes(e.id)?'ok':''}" data-evidence="${e.id}"><b>${s.evidence.includes(e.id)?'✓':'◉'} ${esc(e.title)}</b><span class="shade">${esc(e.short)}</span></button>`).join('')}</div><div class="notice ${s.evidence.length===3?'success':''}">${s.evidence.length===3?'The four laboratory doors are unlocked. Choose any room along the bottom.':'Collect all three intelligence sources to unlock the four laboratory doors.'}</div><div class="explain"><b>Mission question:</b> When is each leadership style useful, where are its limits, and what should a leader do when “hands off” becomes absence?</div></div>`}
function visionHTML(){let chosen=s.vision;return `<div class="workhead"><div><div class="eyebrow">Lab 1 · transformational leadership</div><h2>Rebuild the vision projector</h2><p>Move the three credible building blocks into the hologram, in sequence. Two proposals are distractions. Drag a tile, or tap a tile and then a socket.</p></div><span class="tag">${s.solved.vision?'ACCESS 7':'3 vision sockets'}</span></div><div class="grid">${VISION_PIECES.map(p=>`<button draggable="true" data-piece="${p.id}" class="tile ${s.selectedPiece===p.id?'selected':''} ${['slogan','pressure'].includes(p.id)?'decoy':''}" aria-pressed="${s.selectedPiece===p.id}"><span>${p.icon} ${esc(p.title)}</span></button>`).join('')}</div><div class="rule"></div><div class="grid">${['1 · Why we serve','2 · What success looks like','3 · Who will shape the journey'].map((a,i)=>`<button class="slot ${chosen[i]?'filled':''}" data-slot="${i}"><b>${esc(a)}</b><span class="shade">${esc(VISION_PIECES.find(p=>p.id===chosen[i])?.title||'Drop or tap a vision piece')}</span></button>`).join('')}</div><div class="toolrow"><button class="btn gold" data-checkvision ${s.solved.vision?'disabled':''}>Activate vision projector →</button><button class="btn muted sm" data-clearvision>Clear sockets</button></div>${s.solved.vision?'<div class="notice success">Projector online. Transformational leadership can connect employees to purpose and invite them into change, rather than relying on slogans.</div>':''}`}
function performanceHTML(){let o=s.performance;let qualified=o.expect>=65&&o.expect<=90&&o.checkins>=40&&o.checkins<=75&&o.reward>=40&&o.reward<=85;let predicted=clamp(45+(o.expect-50)*.23+Math.min(o.checkins,75)*.16+o.reward*.17-Math.max(0,o.checkins-75)*.65-Math.max(0,40-o.reward)*.25);return `<div class="workhead"><div><div class="eyebrow">Lab 2 · transactional leadership</div><h2>Calibrate the service standard</h2><p>An audit found unclear expectations and uneven recognition. Set a fair operating system without sliding into surveillance or rewarding only speed.</p></div><span class="tag">${s.solved.performance?'ACCESS 2':'3 calibration dials'}</span></div><div class="grid">${rangeCard('expect','Standards & expectations',o.expect,'How clear are the targets and procedures?')}${rangeCard('checkins','Monitoring & feedback',o.checkins,'How frequently is performance reviewed?')}${rangeCard('reward','Fair recognition',o.reward,'How reliably is strong work acknowledged?')}</div><div class="card" style="margin-top:13px"><div class="measureHead"><b>Projected operating stability</b><b id="stabilityOutput">${predicted}/100</b></div><div class="progress"><div class="fill gold" id="stabilityBar" style="width:${predicted}%"></div></div><div class="small" style="margin-top:7px">Projected result is an illustrative teaching model. Real outcomes depend on implementation and context.</div></div><div class="toolrow"><button class="btn gold" data-checkperformance ${s.solved.performance?'disabled':''}>Run quality-control test →</button></div><div class="notice ${qualified?'success':'warning'}" id="performanceNote">${s.solved.performance?'Service standard stabilized.':'A strong calibration includes clear expectations, reasonable monitoring, and equitable feedback—not maximum supervision.'}</div>`}
function rangeCard(key,title,val,desc){return `<div class="card"><h3>${esc(title)}</h3><p>${esc(desc)}</p><div class="setting"><label for="range-${key}"><span>Control level</span><span id="val-${key}">${val}</span></label><input id="range-${key}" data-range="${key}" type="range" min="0" max="100" step="5" value="${val}"></div></div>`}
function serviceHTML(){let spent=s.selectedSupport.reduce((a,id)=>a+SUPPORT.find(t=>t.id===id).cost,0),got=s.interviewed.length;return `<div class="workhead"><div><div class="eyebrow">Lab 3 · servant leadership</div><h2>The barrier-removal challenge</h2><p>Meet Maya, Leo, and Imani. Ask useful questions, uncover the needs behind their statements, then invest no more than 10 support tokens.</p></div><span class="tag">${s.solved.service?'ACCESS 9':`${got} / 3 heard`}</span></div><div class="grid">${PEOPLE.map(p=>`<button class="person" data-person="${p.id}"><div class="portrait" style="background-image:url('${pic(p.face)}')"></div><div><b>${esc(p.name)}</b><small>${esc(p.role)} · ${s.interviewed.includes(p.id)?'✓ Heard':'Tap to interview'}</small></div></button>`).join('')}</div><div class="rule"></div><div class="workhead"><div><h3>Choose tangible support</h3><p style="margin:0">What will you actually change for employees?</p></div><div class="tag">${10-spent} / 10 tokens left</div></div><div class="grid two">${SUPPORT.map(c=>`<button class="choice ${s.selectedSupport.includes(c.id)?'selected':''}" data-support="${c.id}"><b>${c.icon} ${esc(c.name)} <span style="color:var(--gold)">[${c.cost}]</span></b><span class="shade">${esc(c.detail)}</span></button>`).join('')}</div><div class="toolrow"><button class="btn gold" data-checkservice ${s.solved.service?'disabled':''}>Deploy employee-support plan →</button><button class="btn muted sm" data-clearsupport>Reset investment</button></div>${s.solved.service?'<div class="notice success">Barriers removed. You used employee insight to improve the work, rather than confusing servant leadership with simply being agreeable.</div>':''}`}
function autonomyHTML(){const o=s.rails;return `<div class="workhead"><div><div class="eyebrow">Lab 4 · laissez-faire leadership</div><h2>Repair the silent leadership signal</h2><p>Senior experts have the skills to act, but their manager has stopped making decisions or responding to risk. Investigate all three warning lights in the room.</p></div><span class="tag">${s.solved.autonomy?'ACCESS 4':`${s.risk.length} / 3 risks`}</span></div><div class="notice warning"><b>Leadership distinction:</b> Laissez-faire leadership is non-intervention or avoidance. Deliberate delegation means autonomy <em>with</em> boundaries, access to support, and accountability.</div><h3 style="margin-top:16px">Install three guardrails</h3><p>Select actions that preserve autonomy without abandoning employees. Avoid unnecessary control and leader disappearance.</p><div class="grid two">${RAILS.map(r=>`<button class="choice ${o.includes(r.id)?'selected':''}" data-rail="${r.id}"><b>${o.includes(r.id)?'✓ ':'◯ '}${esc(r.title)}</b><span class="shade">${esc(r.note)}</span></button>`).join('')}</div><div class="toolrow"><button class="btn gold" data-checkautonomy ${s.solved.autonomy?'disabled':''}>Reestablish leadership contact →</button></div>${s.solved.autonomy?'<div class="notice success">Signal restored. The solution is intentional delegation, not disappearing. Skilled teams still deserve responsive leaders.</div>':''}`}
function vaultHTML(){const complete=progress()===4; if(s.finished)return winHTML();return `<div class="workhead"><div><div class="eyebrow">Final mission · integrated leadership judgment</div><h2>The director’s decision console</h2><p>The four labs demonstrate different mechanisms of leadership. Match the dominant response to each live incident. Some styles can overlap; select the approach that most directly addresses the immediate problem.</p></div><span class="tag">${Object.keys(s.finalCases).length} / 4 assigned</span></div>${!complete?`<div class="notice warning">The vault is sealed. Complete all four style laboratories, then return to this console. ${progress()}/4 complete.</div>`:`<div class="notice success">All laboratory access fragments recovered. You may assign leadership responses to the live incidents.</div>`}<div class="grid two">${CASES.map((c,i)=>`<div class="case"><h3>Case ${i+1}: ${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="chips">${Object.entries(STYLE).map(([id,d])=>`<button ${!complete?'disabled':''} class="chip ${s.finalCases[i]===id?'selected':''}" data-case="${i}" data-style="${id}" style="font-size:11px">${esc(d.name)}</button>`).join('')}</div>${s.finalCases[i]?`<div class="impact">Selected: ${esc(STYLE[s.finalCases[i]].name)}. ${esc(s.finalCases[i]===c.best?c.why:'Consider whether this approach addresses the primary need; you can revise your choice.')}</div>`:''}</div>`).join('')}</div><div class="rule"></div><div class="grid two"><div class="card"><h3>Recovered security fragments</h3><div class="grid four">${['vision','performance','service','autonomy'].map(id=>`<div class="slot filled" style="min-height:70px">${s.solved[id]?PIN[id]:'🔒'}<span class="shade">${id==='vision'?'Vision':id==='performance'?'Standards':id==='service'?'People':'Autonomy'}</span></div>`).join('')}</div><p>Read the access fragments in lab order. Enter the code after making all four leadership decisions.</p></div><div class="card"><h3>Executive keypad</h3><div class="lockpin" id="pinDisplay">${esc(s.code.padEnd(4,'·'))}</div><div class="keypad">${['1','2','3','4','5','6','7','8','9','⌫','0','CLR'].map(c=>`<button class="btn" data-key="${c}" ${!complete?'disabled':''}>${c}</button>`).join('')}</div><div class="toolrow"><button class="btn gold full" data-unlock ${!complete?'disabled':''}>Unlock the Director’s Office →</button></div></div></div>`}
function winHTML(){const correct=CASES.filter((c,i)=>s.finalCases[i]===c.best).length;const index=Math.min(100,Math.max(0,Math.round((s.metrics.trust+s.metrics.clarity+s.metrics.engagement+s.metrics.delivery)/4*.56 + correct*8 + progress()*2 - s.usedHints*.5)));return `<div class="result"><div class="eyebrow">Mission cleared · executive briefing unlocked</div><h2>✓ Leadership restored</h2><p>Congratulations${s.name?', '+esc(s.name):''}. You navigated purpose, performance agreements, employee support, and the risks of absent leadership.</p><div class="grid"><div class="card"><div class="eyebrow">Scenario alignment</div><h2>${correct} / 4</h2><p>Final incident choices aligned with the dominant need.</p></div><div class="card"><div class="eyebrow">Illustrative mission index</div><h2>${index} / 100</h2><p>A game performance indicator, not a validated competence score.</p></div><div class="card"><div class="eyebrow">Time elapsed</div><h2>${fmt(s.seconds)}</h2><p>Learning matters more than speed.</p></div></div><div class="explain"><b>Director’s debrief:</b> Transformational leadership provides meaning and inspiration; transactional leadership provides clarity and fair exchange; servant leadership elevates others and removes barriers. Laissez-faire leadership is usually a warning sign of non-leadership, not a preferred substitute for thoughtful delegation.</div><div class="toolrow"><button class="btn gold" data-export>⬇ Download learner report</button><button class="btn" data-casebook>▤ Review casebook</button><button class="btn muted" data-print>Print summary</button></div><h3 style="margin-top:25px">Reflect before your next mission</h3><div class="small">When did you feel tempted to rely on one familiar approach? Where did the leader need to step in rather than remain absent? Which two styles might complement each other in one situation?</div></div>`}
function renderIntro(){$('content').innerHTML=`<div style="padding:clamp(12px,2.3vw,29px)"><div class="introHero"><div class="introBg"></div><div class="introMonitor"><div class="eyebrow">Leadership lenses</div><h3>Four approaches · One mission</h3><div class="monitorGrid"><div class="monitorCard"><b>✦ Transformational</b><small>Purpose and vision</small></div><div class="monitorCard"><b>⚙ Transactional</b><small>Standards and feedback</small></div><div class="monitorCard"><b>♡ Servant</b><small>Support and growth</small></div><div class="monitorCard"><b>◌ Laissez-faire</b><small>Recognize inaction</small></div></div></div><div class="introText"><div class="eyebrow">Leadership 101 · Mission 04</div><h1>THE FOUR<br><span>STYLES PROTOCOL</span></h1><p><b>Meridian Community Services. Forty-five days until launch.</b> The staff need vision, accountability, support, and responsive leadership—but not the same approach to every problem.</p><p>Explore four laboratories, operate working leadership tools, uncover four security fragments, and unlock the Director’s Office. Your decisions change organizational trust, clarity, engagement, and delivery.</p><label for="playerName" class="eyebrow" style="display:block;margin-bottom:8px">Learner / Team name</label><input id="playerName" class="introInput" maxlength="50" placeholder="Enter a name (optional)" value="${esc(s.name)}"><div class="toolrow"><button class="btn gold" data-start>▶ ${s.evidence.length?'Resume Mission':'Start Mission'}</button><span class="tag">40–55 minutes · 6 locations · 4 leadership lenses</span></div></div></div><div class="grid four" style="margin-top:13px">${[['✦','TRANSFORMATIONAL','Vision & inspiration'],['⚙','TRANSACTIONAL','Expectations & feedback'],['♡','SERVANT','Listen & remove barriers'],['◌','LAISSEZ-FAIRE','Recognize the cost of absence']].map(a=>`<div class="card"><div style="font-size:26px;color:var(--gold)">${a[0]}</div><h3>${a[1]}</h3><div class="small">${a[2]}</div></div>`).join('')}</div></div>`}
function openEvidence(id){const e=EVIDENCE.find(e=>e.id===id);if(!e)return;if(!s.evidence.includes(id)){s.evidence.push(id);journal('Evidence reviewed: '+e.title)}modal(`<div class="eyebrow">Evidence recovered · ${s.evidence.length}/3</div><h2 id="modalTitle">${esc(e.title)}</h2><p>${esc(e.body)}</p><div class="toolrow"><button class="btn gold" data-close>Save in casebook</button></div>`);render()}
function openRisk(id){const r=RISK.find(x=>x.id===id);if(!r)return;if(!s.risk.includes(id)){s.risk.push(id);journal('Leadership warning identified: '+r.name)}modal(`<div class="eyebrow">Operational warning ${s.risk.length}/3</div><h2 id="modalTitle">${esc(r.name)}</h2><p>${esc(r.desc)}</p><div class="notice warning">Autonomy does not remove leadership’s duty to respond when people need decisions or protection.</div><button class="btn gold" data-close>Log warning signal</button>`);render()}
function openPerson(id){const p=PEOPLE.find(x=>x.id===id);if(!p)return;modal(`<div class="eyebrow">Employee interview · ${esc(p.role)}</div><h2 id="modalTitle">Conversation with ${esc(p.name)}</h2><div class="person" style="cursor:default"><div class="portrait" style="background-image:url('${pic(p.face)}')"></div><div>${esc(p.quote)}</div></div><p>Choose how to open the conversation. Your question may help reveal what this employee needs.</p><button class="choice" data-answer="${id}:good">“${esc(p.good)}”</button><button class="choice" data-answer="${id}:bad">“${esc(p.bad)}”</button>`)}

function putVision(i,id){if(s.solved.vision)return;s.vision=s.vision.map(x=>x===id?'':x);s.vision[i]=id;s.selectedPiece='';render()}
function checkVision(){if(s.solved.vision)return;if(s.vision.join(',')==='purpose,future,agency'){done('vision','7',{trust:5,engagement:9,clarity:4},'Transformational vision projector activated')}else{s.firstWrong++;toast('The projector rejected this sequence. Distinguish purpose, credible future, and involvement from empty pressure.');}}
function checkPerformance(){if(s.solved.performance)return;let o=s.performance;let errors=[];if(o.expect<65||o.expect>90)errors.push('expectations need to be specific but not excessively rigid');if(o.checkins<40||o.checkins>75)errors.push('monitoring should be regular but not oppressive');if(o.reward<40||o.reward>85)errors.push('recognition needs fairness and consistency');if(errors.length){s.firstWrong++;modal(`<h2 id="modalTitle">Quality-control alert</h2><p>${esc(errors.join('; '))}.</p><p>Transactional leadership offers clear exchanges and contingencies. It works poorly when standards are arbitrary or people are treated as mere numbers.</p><button class="btn gold" data-close>Recalibrate</button>`);return}done('performance','2',{clarity:12,delivery:8,trust:3},'Transactional standards stabilized')}
function checkService(){if(s.solved.service)return;let spent=s.selectedSupport.reduce((a,id)=>a+SUPPORT.find(t=>t.id===id).cost,0);if(s.interviewed.length<3){toast('Interview all three employees before deploying your plan.');return}if(spent>10){toast('Support budget exceeded.');return}let correct=['listen','remove','coach'];if(!correct.every(id=>s.selectedSupport.includes(id))){s.firstWrong++;modal(`<h2 id="modalTitle">Support plan does not resolve the barriers</h2><p>Review the employee interviews. Look for a combination of listening, changing the actual system, and developing capability.</p><button class="btn gold" data-close>Revise the support plan</button>`);return}done('service','9',{trust:11,engagement:12,delivery:4},'Servant leadership support plan delivered')}
function checkAutonomy(){if(s.solved.autonomy)return;if(s.risk.length<3){toast('Investigate all three ignored warning signals first.');return}let correct=['rights','cadence','access'];if(s.rails.length!==3||!correct.every(x=>s.rails.includes(x))){s.firstWrong++;modal(`<h2 id="modalTitle">Leadership connection still unstable</h2><p>The team needs freedom with clear boundaries, routine visibility, and access to a responsive leader. Leaving without setting guardrails recreates the problem.</p><button class="btn gold" data-close>Reconfigure</button>`);return}done('autonomy','4',{clarity:8,engagement:5,delivery:8,trust:4},'Laissez-faire warning resolved with accountable delegation')}
function navigate(id){if(id!=='hub'&&id!=='vault'&&s.evidence.length<3){toast('Read all three mission-briefing documents to unlock the style labs.');return}s.scene=id;closeModal();render();document.querySelector('.missionTitle')?.scrollIntoView({behavior:'smooth',block:'start'})}
function hint(){if(s.usedHints>=3){toast('All three mission hints have been used. Review the casebook.');return}let list=SCENE_HINTS[s.scene];let i=Math.min(s.usedHints,2);s.usedHints++;journal('Hint '+s.usedHints+' requested in '+s.scene);persist();modal(`<div class="eyebrow">Facilitator hint ${s.usedHints}/3</div><h2 id="modalTitle">${esc(phase()[1])}</h2><p>${esc(list[i])}</p><button class="btn gold" data-close>Return to room</button>`);$('hintNum').textContent=3-s.usedHints}
function styleGuide(){modal(`<div class="eyebrow">Leadership 101 · reference library</div><h2 id="modalTitle">Four Leadership Styles</h2><p>These styles are conceptual lenses, not fixed personality types. Effective leadership requires understanding the task, people, ethics, and context.</p><div class="grid two"><div class="card"><h3 style="color:#f6bd70">✦ Transformational</h3><p>Articulate a meaningful vision, model values, encourage new thinking, and develop people.</p><div class="small"><b>Useful when:</b> mobilizing change and commitment. <b>Watch for:</b> inspiration without resources or implementation.</div></div><div class="card"><h3 style="color:#79bffa">⚙ Transactional</h3><p>Specify expectations, monitor against agreed standards, and provide fair contingent recognition and corrective feedback.</p><div class="small"><b>Useful when:</b> consistency, quality, and accountability are needed. <b>Watch for:</b> excessive surveillance or punishment.</div></div><div class="card"><h3 style="color:#7fdfbe">♡ Servant</h3><p>Listen to others, promote development, share power appropriately, and remove barriers to effective service.</p><div class="small"><b>Useful when:</b> employees need voice, resources, or growth. <b>Watch for:</b> support without clarity or boundaries.</div></div><div class="card"><h3 style="color:#d4a5ff">◌ Laissez-faire</h3><p>Minimal intervention or avoidance of leadership responsibilities, even when support is needed.</p><div class="small"><b>Important distinction:</b> an expert team can have autonomy, but intentional delegation retains clear boundaries, check-ins, and accountability.</div></div></div><div class="toolrow"><button class="btn gold" data-close>Return to simulation</button></div>`)}
function casebook(){let lines=EVIDENCE.filter(e=>s.evidence.includes(e.id)).map(e=>`<li><b>${esc(e.title)}:</b> ${esc(e.short)}</li>`).join('')||'<li>No evidence recovered yet.</li>';modal(`<div class="eyebrow">Your investigation journal</div><h2 id="modalTitle">Meridian Casebook</h2><div class="card"><h3>Mission evidence</h3><ul>${lines}</ul><h3>Leadership insight</h3><p>Transformational: shared vision · Transactional: standards and fair exchanges · Servant: listen and remove obstacles · Laissez-faire: non-intervention; beware neglect.</p><h3>Security fragments</h3><div class="lockpin">${['vision','performance','service','autonomy'].map(id=>s.solved[id]?PIN[id]:'?').join(' ')}</div><h3>Employee insights</h3><ul>${PEOPLE.filter(p=>s.interviewed.includes(p.id)).map(p=>`<li>${esc(p.reveal)}</li>`).join('')||'<li>No interviews completed.</li>'}</ul></div><div class="toolrow"><button class="btn gold" data-close>Resume mission</button><button class="btn" data-export>Download current report</button></div>`)}
function tryUnlock(){if(progress()<4){toast('Four laboratories must be completed first.');return}if(Object.keys(s.finalCases).length<4){toast('The Director needs four leadership decisions before unlocking the office.');return}if(s.code!==Object.keys(PIN).map(k=>PIN[k]).join('')){s.attempts++;s.code='';s.firstWrong++;toast('Access denied. Check the fragment sequence in the casebook.');render();return}s.finished=true;metrics({trust:3,clarity:3});journal('Executive vault unlocked: four leadership strategies reviewed');render()}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function report(){let correct=CASES.filter((c,i)=>s.finalCases[i]===c.best).length;return ['LEADERSHIP 101 ESCAPE LAB — THE FOUR STYLES PROTOCOL','Mission 04 · Meridian Community Services',`Learner/team: ${s.name||'(not provided)'}`,`Finished: ${s.finished?'Yes':'No'}`,`Time: ${fmt(s.seconds)}`,`Hints: ${s.usedHints}/3`,`Attempts: ${s.attempts}`,`Incorrect puzzle checks: ${s.firstWrong}`,'','ORGANIZATIONAL SIGNALS',...Object.entries(s.metrics).map(([k,v])=>k+': '+v+'/100'),'','STYLE LABS',...Object.entries(PIN).map(([k,v])=>k+': '+(s.solved[k]?'Completed':'Incomplete')),'','EXECUTIVE RESPONSES',...CASES.map((c,i)=>(i+1)+'. '+c.title+' → '+(STYLE[s.finalCases[i]]?.name||'Not assigned')+' | '+(c.best===s.finalCases[i]?'Aligned':'Review')+' | '+c.why),'',`Final match alignment: ${correct}/4`,'','CASE LOG',...s.log,'','DEBRIEF QUESTIONS','1. When would transformational and servant approaches complement one another?','2. Which transactional mechanisms support fairness, and which can backfire?','3. How did laissez-faire inaction differ from empowered delegation?','4. When should a leader increase structure without abandoning relationships?','5. Which decision would you change and why?','', 'Note: Numerical organizational signals are illustrative, not validated measures of real leadership effectiveness.'].join('\n')}
function exportReport(){const blob=new Blob([report()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Leadership101_FourStyles_Learner_Report.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200);toast('Learner report generated.');}
function reset(){if(confirm('Start a new mission? This clears saved choices and scores.')){s=init();persist();render();}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.start!==undefined){s.started=true;s.name=$('playerName')?.value.trim().slice(0,50)||s.name;journal('Mission started');render();return}if(d.nav)return navigate(d.nav);if(d.evidence)return openEvidence(d.evidence);if(d.risk)return openRisk(d.risk);if(d.person)return openPerson(d.person);if(d.answer){const [id,q]=d.answer.split(':');return answerPerson(id,q)}if(d.piece){s.selectedPiece=d.piece;return render()}if(d.slot!==undefined){const i=Number(d.slot);if(s.selectedPiece)putVision(i,s.selectedPiece);else{s.vision[i]='';render()}return}if(d.clearvision!==undefined){if(!s.solved.vision){s.vision=['','',''];render()}return}if(d.checkvision!==undefined)return checkVision();if(d.checkperformance!==undefined)return checkPerformance();if(d.support){const c=SUPPORT.find(x=>x.id===d.support),used=s.selectedSupport.includes(c.id);if(used)s.selectedSupport=s.selectedSupport.filter(x=>x!==c.id);else if(s.selectedSupport.reduce((a,id)=>a+SUPPORT.find(x=>x.id===id).cost,0)+c.cost<=10)s.selectedSupport.push(c.id);else toast('Only 10 support tokens are available.');render();return}if(d.clearsupport!==undefined){if(!s.solved.service){s.selectedSupport=[];render()}return}if(d.checkservice!==undefined)return checkService();if(d.rail){if(!s.solved.autonomy){s.rails=s.rails.includes(d.rail)?s.rails.filter(x=>x!==d.rail):[...s.rails,d.rail];render()}return}if(d.checkautonomy!==undefined)return checkAutonomy();if(d.case!==undefined){s.finalCases[d.case]=d.style;journal('Executive case '+(Number(d.case)+1)+': '+STYLE[d.style].name);render();return}if(d.key!==undefined){if(d.key==='CLR')s.code='';else if(d.key==='⌫')s.code=s.code.slice(0,-1);else if(s.code.length<4)s.code+=d.key;render();return}if(d.unlock!==undefined)return tryUnlock();if(d.casebook!==undefined)return casebook();if(d.export!==undefined)return exportReport();if(d.print!==undefined)return window.print();});
$('app').addEventListener('input',e=>{const k=e.target.dataset.range;if(!k)return;s.performance[k]=Number(e.target.value);const value=$('val-'+k);if(value)value.textContent=e.target.value;let o=s.performance,p=clamp(45+(o.expect-50)*.23+Math.min(o.checkins,75)*.16+o.reward*.17-Math.max(0,o.checkins-75)*.65-Math.max(0,40-o.reward)*.25);if($('stabilityOutput'))$('stabilityOutput').textContent=p+'/100';if($('stabilityBar'))$('stabilityBar').style.width=p+'%';persist()});
$('app').addEventListener('change',e=>{if(e.target.dataset.range)render()});
$('app').addEventListener('dragstart',e=>{const el=e.target.closest('[data-piece]');if(el){e.dataTransfer.setData('text/plain',el.dataset.piece);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')}});
$('app').addEventListener('dragend',e=>{e.target.closest('[data-piece]')?.classList.remove('dragging')});
$('app').addEventListener('dragover',e=>{if(e.target.closest('[data-slot]')){e.preventDefault();e.target.closest('[data-slot]').classList.add('dropzone')}});
$('app').addEventListener('dragleave',e=>{e.target.closest('[data-slot]')?.classList.remove('dropzone')});
$('app').addEventListener('drop',e=>{const slot=e.target.closest('[data-slot]');if(!slot)return;e.preventDefault();let id=e.dataTransfer.getData('text/plain');slot.classList.remove('dropzone');if(VISION_PIECES.some(x=>x.id===id))putVision(Number(slot.dataset.slot),id)});
$('closeModal').addEventListener('click',closeModal);$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop')||e.target.closest('[data-close]'))closeModal();const d=e.target.closest('button')?.dataset;if(!d)return;if(d.person)openPerson(d.person);if(d.answer){let [id,q]=d.answer.split(':');answerPerson(id,q)}if(d.export!==undefined)exportReport()});$('hintBtn').addEventListener('click',hint);$('styleBtn').addEventListener('click',styleGuide);$('caseBtn').addEventListener('click',casebook);$('restartBtn').addEventListener('click',reset);
$('content').addEventListener('change',e=>{if(e.target.id==='mobileScene')navigate(e.target.value)});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(s.scene==='vault'&&!s.finished&&!$('modalBackdrop').classList.contains('open')&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){if(/^\d$/.test(e.key)){s.code=(s.code+e.key).slice(0,4);render()}if(e.key==='Backspace'){s.code=s.code.slice(0,-1);render()}if(e.key==='Enter'){tryUnlock()}}});
setInterval(()=>{if(s.started&&!s.finished){s.seconds++;if(s.seconds%10===0)persist()}const timer=$('timer');if(timer)timer.textContent=fmt(s.seconds)},1000);
document.documentElement.style.setProperty('--cover',`url('${IMG.cover}')`);
render();
</script></body></html>
