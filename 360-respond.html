{n:"Self-Awareness",s:"Self-Aware",i:"◉",d:"Recognizes leadership impact, understands strengths and development needs, seeks challenging feedback, and adjusts behavior when intention and impact differ.",q:"What recurring feedback would most improve this leader’s awareness of their impact?"},

{n:"Accountability",s:"Account.",i:"✓",d:"Takes responsibility, sets clear standards, addresses unresolved performance or behavior issues, and follows up on commitments.",q:"Where could clearer ownership or follow-through improve performance?"},
{n:"Decision-Making and Judgment",s:"Judgment",i:"⚖",d:"Gathers necessary information, weighs consequences and tradeoffs, decides in time, and exercises judgment under uncertainty.",q:"What would help this leader balance analysis, speed, and risk more effectively?"},
{n:"Critical Thinking",s:"Critical",i:"△",d:"Separates facts from assumptions, considers alternative explanations, tests thinking with questions, and revises conclusions when credible evidence changes.",q:"Which assumption or reasoning habit would be most valuable for this leader to test?"},
{n:"Team Building and Collaboration",s:"Team",i:"◎",d:"Builds collaboration across boundaries, invites contribution, uses team strengths, and promotes shared responsibility for success.",q:"Whose expertise or perspective could this leader involve more intentionally?"},

{n:"Strategic Thinking and Vision",s:"Strategy",i:"↗",d:"Creates direction, connects daily priorities to mission, considers longer-term implications, and balances present demands with future needs.",q:"What longer-term implication or future need deserves more attention from this leader?"},
{n:"Leading Change and Adaptability",s:"Change",i:"⟳",d:"Adapts as conditions change, explains why change matters, supports people through new expectations, and reinforces new behavior until it becomes normal practice.",q:"What would help this leader turn change from an announcement into sustained behavior?"}

const R=["Self","Supervisor","Peer","Direct Report"];
let responses=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")||[], role="Self", step=0, ratings=Array(TOTAL_ITEMS).fill(null);
const app=document.getElementById("app");
const avg=a=>{let v=a.filter(n=>Number.isFinite(n)&&n>0);return v.length?v.reduce((x,y)=>x+y,0)/v.length:null};
const hasRole=r=>responses.some(x=>x.role===r);
function scores(filter){return C.map((_,i)=>{let vals=[];responses.filter(x=>!filter||x.role===filter).forEach(x=>vals.push(...x.ratings.slice(i*ITEMS_PER_COMP,i*ITEMS_PER_COMP+ITEMS_PER_COMP)));return avg(vals)})}
function othersScores(){return C.map((_,i)=>{let vals=[];responses.filter(x=>x.role!=="Self").forEach(x=>vals.push(...x.ratings.slice(i*ITEMS_PER_COMP,i*ITEMS_PER_COMP+ITEMS_PER_COMP)));return avg(vals)})}
function go(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.view===v));({home:flexibleHome,results:flexibleResults,coach,framework}[v]||flexibleHome)();scrollTo(0,0)}
document.getElementById("nav").onclick=e=>{if(e.target.dataset.view)go(e.target.dataset.view)};
function home(){app.innerHTML='<section class="hero"><div class="eyebrow">MULTISOURCE LEADERSHIP DEVELOPMENT</div><h1>Awareness that<br><em>drives growth.</em></h1><p>A 12-competency, 48-behavior Leadership Impact Profile that compares self-perception with feedback from supervisors, peers, and direct reports.</p><div class="actions"><button class="btn gold" onclick="start(\'Self\')">Begin self-assessment →</button><button class="btn white" onclick="go(\'results\')">View current report</button></div><div class="privacy">● &nbsp;<b>Built for trust.</b> Rater names are never collected or shown. Data stays in this browser.</div></section><div class="wrap"><section class="cycle"><span class="kicker">YOUR 360 CYCLE</span><h2>Collect multiple perspectives</h2><p>Complete the self-assessment and create anonymous response packets for supervisors, peers, and direct reports. Import returned packets here to consolidate feedback.</p><div class="roles">'+R.map(r=>'<button class="role" onclick="start(\''+r+'\')"><i>'+responses.filter(x=>x.role===r).length+'</i><b>'+r+'</b><small>'+(r==="Self"?"Complete self-assessment →":"Create anonymous packet →")+'</small></button>').join("")+'</div></section><section style="padding-top:75px"><div class="section-head"><span class="kicker">THE FRAMEWORK</span><h2>Twelve competencies of leadership impact</h2><p>Forty-eight observable behaviors provide a broader view of leading self, others, teams, decisions, strategy, conflict, and change.</p><div class="disclaimer">Developmental use only. This original multisource-feedback instrument is not a validated selection, promotion, disciplinary, clinical, or psychological assessment.</div></div><div class="cards">'+C.map(c=>'<article class="card"><b style="color:var(--gold);font-size:25px">'+c.i+'</b><h3>'+c.n+'</h3><p>'+c.d+'</p></article>').join("")+'</div></section></div>'}
function start(r){role=r;step=0;ratings=Array(TOTAL_ITEMS).fill(null);assessment()}
function assessment(){let totalSteps=C.length+1,c=C[step],isQuestions=step<C.length,qs=role==="Self"?SELF_Q:Q;app.innerHTML='<section class="assess"><div class="wrap"><div class="top"><div><span class="kicker">'+role.toUpperCase()+' PERSPECTIVE</span><h1>'+(isQuestions?c.n:"Written feedback")+'</h1></div><b>'+(step+1)+' of '+totalSteps+'</b></div><div class="progress"><i style="width:'+((step+1)/totalSteps*100)+'%"></i></div>'+(isQuestions?'<div class="assess-grid" style="margin-top:38px"><aside class="aside"><b style="color:var(--gold);font-size:28px">'+c.i+'</b><h2>'+c.n+'</h2><p>'+c.d+'</p><hr style="border-color:#ffffff22"><small><b>1</b> Rarely Demonstrated<br><b>2</b> Occasionally Demonstrated<br><b>3</b> Usually Demonstrated<br><b>4</b> Frequently Demonstrated<br><b>5</b> Consistently Demonstrated<br><b>N/O</b> Not Observed / Unable to Assess</small></aside><div>'+qs.slice(step*ITEMS_PER_COMP,step*ITEMS_PER_COMP+ITEMS_PER_COMP).map((q,j)=>{let ix=step*ITEMS_PER_COMP+j,num=String(ix+1).padStart(2,"0");return '<div class="q"><p><small style="color:#98a5b3">'+num+'</small> &nbsp; '+q+'</p><div class="rating">'+[1,2,3,4,5].map(n=>'<button class="'+(ratings[ix]===n?"sel":"")+'" onclick="rate('+ix+','+n+')">'+n+'</button>').join("")+'<button class="no '+(ratings[ix]===0?"sel":"")+'" onclick="rate('+ix+',0)">N/O</button></div></div>'}).join("")+'<div class="next"><button class="btn white" '+(!step?"disabled":"")+' onclick="step--;assessment()">Back</button><button class="btn gold" '+(ratings.slice(step*ITEMS_PER_COMP,step*ITEMS_PER_COMP+ITEMS_PER_COMP).some(x=>x===null)?"disabled":"")+' onclick="step++;assessment()">Continue →</button></div></div></div>':feedbackForm())+'</div></section>';scrollTo(0,0)}
function rate(i,n){ratings[i]=n;assessment()}
function feedbackForm(){return '<div class="assess-grid" style="margin-top:38px"><div class="aside"><h2>Feedback they can use</h2><p>Comments are optional. Describe observable behavior and its impact. Avoid identity clues or sensitive personal details.</p></div><div><div class="feedback-grid"><label class="field">Positive impact to continue<textarea id="positive" maxlength="800" placeholder="What is one leadership behavior this person should continue because it has a positive impact?"></textarea></label><label class="field">Improve<textarea id="improve" maxlength="800" placeholder="What is one leadership behavior this person could improve to become more effective?"></textarea></label><label class="field">Start<textarea id="startfb" maxlength="800" placeholder="What is something this leader should start doing?"></textarea></label><label class="field">Stop<textarea id="stop" maxlength="800" placeholder="What is something this leader should stop doing?"></textarea></label><label class="field">Continue<textarea id="continuefb" maxlength="800" placeholder="What is something this leader should continue doing?"></textarea></label><label class="field">Additional feedback<textarea id="additional" maxlength="800" placeholder="What additional feedback would help this person grow as a leader?"></textarea></label></div><div class="next"><button class="btn white" onclick="step=C.length-1;assessment()">Back</button><button class="btn gold" onclick="submitResponse()">Submit feedback ✓</button></div></div></div>'}
async function submitResponse(){const feedback={positive:document.getElementById("positive").value.trim(),improve:document.getElementById("improve").value.trim(),start:document.getElementById("startfb").value.trim(),stop:document.getElementById("stop").value.trim(),continue:document.getElementById("continuefb").value.trim(),additional:document.getElementById("additional").value.trim()};const b=document.querySelector("#app .next button:last-child");if(b)b.disabled=true;try{const response=await fetch("https://oxgbhrhpgvtolbasxzjj.supabase.co/functions/v1/ml360-respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"submit",token:inviteToken,ratings,feedback})});const out=await response.json();if(!response.ok)throw Error(out.error||"Submission failed");app.innerHTML='<div class="wrap"><section class="box" style="max-width:700px;margin:45px auto;text-align:center"><div style="font-size:54px;color:#2f9e77">✓</div><h1>Feedback submitted successfully</h1><p>Thank you. Your responses were saved securely. This invitation cannot be used again.</p></section></div>'}catch(e){toast("Could not submit: "+e.message);if(b)b.disabled=false}}
function radar(self,supervisor,peers,directs){let cx=140,cy=140,maxR=90,labelR=116,p=(v,i,rOverride)=>{let a=-Math.PI/2+i*2*Math.PI/C.length,r=rOverride??((Number.isFinite(v)?v:0)/5*maxR);return (cx+Math.cos(a)*r)+","+(cy+Math.sin(a)*r)},poly=(a,c,show)=>show?'<polygon class="'+c+'" points="'+a.map((v,i)=>p(v,i)).join(" ")+'"/>':"";return '<svg class="radar" viewBox="0 0 280 280">'+[1,2,3,4,5].map(v=>'<polygon class="grid" points="'+C.map((_,i)=>p(v,i)).join(" ")+'"/>').join("")+poly(directs,"directpoly",hasRole("Direct Report"))+poly(peers,"peerpoly",hasRole("Peer"))+poly(supervisor,"superpoly",hasRole("Supervisor"))+poly(self,"selfpoly",hasRole("Self"))+C.map((c,i)=>{let xy=p(0,i,labelR).split(",");return '<text x="'+xy[0]+'" y="'+xy[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#617187">'+c.s+'</text>'}).join("")+'</svg>'}
function bestIndex(a,mode){let vals=a.map((v,i)=>({v,i})).filter(x=>Number.isFinite(x.v));if(!vals.length)return -1;return vals.reduce((b,x)=>mode==="max"?(x.v>b.v?x:b):(x.v<b.v?x:b)).i}
function results(){let self=scores("Self"),supervisor=scores("Supervisor"),peers=scores("Peer"),directs=scores("Direct Report"),others=othersScores(),strength=bestIndex(others,"max"),growth=bestIndex(others,"min"),availableGroups=[["Supervisor",supervisor],["Peer",peers],["Direct Report",directs]].filter(([r])=>hasRole(r)),gap=-1,gapVal=-1;if(hasRole("Self")){C.forEach((_,i)=>availableGroups.forEach(([,g])=>{if(Number.isFinite(self[i])&&Number.isFinite(g[i])){let d=Math.abs(self[i]-g[i]);if(d>gapVal){gapVal=d;gap=i}}}))}let fmt=n=>Number.isFinite(n)?n.toFixed(1):"—",story=x=>x>=0?C[x].n:"Collect more feedback";app.innerHTML='<div class="wrap"><div class="top"><div><span class="kicker">CONFIDENTIAL FEEDBACK REPORT</span><h1>Leadership Impact Profile</h1><p>'+responses.length+' perspectives · 12 competencies · 48 behaviors</p></div><button class="btn white no-print" onclick="print()">Print / Save PDF</button></div><div class="summary"><article class="box"><h2>Perspective comparison</h2><div class="legend"><b style="background:var(--gold)"></b>Self <b style="background:#125a92"></b>Supervisor <b style="background:#2f9e77"></b>Peers <b style="background:#8b5fbf"></b>Direct Reports</div>'+radar(self,supervisor,peers,directs)+'</article><article class="box"><h2>Your story in the data</h2><div class="insight"><small>RECOGNIZED STRENGTH ACROSS NON-SELF RATERS</small><b>'+story(strength)+'</b></div><div class="insight"><small>LARGEST SELF–RATER GAP</small><b>'+story(gap)+'</b></div><div class="insight"><small>GROWTH OPPORTUNITY ACROSS NON-SELF RATERS</small><b>'+story(growth)+'</b></div><button class="btn gold no-print" onclick="go(\'coach\')">Open coach report →</button><div class="disclaimer">N/O responses are excluded from averages. A dash means that perspective has no valid rating data for that competency.</div></article></div><article class="box compare"><h2>Competency scores and self-perception gaps</h2><p style="color:var(--muted);font-size:12px">Gap columns equal Self minus that rater group. Positive numbers mean the self-rating is higher.</p><div class="row"><b>Competency</b><b>Self</b><b>Sup.</b><b>Peers</b><b>Direct</b><b>Sup. Gap</b><b>Peer Gap</b><b>Direct Gap</b></div>'+C.map((c,i)=>{let groupVals=[supervisor[i],peers[i],directs[i]],gs=groupVals.map(g=>Number.isFinite(self[i])&&Number.isFinite(g)?self[i]-g:null);return '<div class="row"><b>'+c.n+'</b><strong>'+fmt(self[i])+'</strong><strong>'+fmt(supervisor[i])+'</strong><strong>'+fmt(peers[i])+'</strong><strong>'+fmt(directs[i])+'</strong>'+gs.map(g=>'<span class="gapcell '+(Number.isFinite(g)&&Math.abs(g)>=.5?"hot":"")+'">'+(Number.isFinite(g)?((g>0?"+":"")+g.toFixed(1)):"—")+'</span>').join("")+'</div>'}).join("")+'</article><article class="box compare"><h2>Rater group comparison</h2><div style="overflow:auto"><table><tr><th>Competency</th>'+R.map(r=>'<th>'+r+'<small style="display:block">n='+responses.filter(x=>x.role===r).length+'</small></th>').join("")+'</tr>'+C.map((c,i)=>'<tr><td>'+c.n+'</td>'+R.map(r=>'<td><b>'+fmt(scores(r)[i])+'</b></td>').join("")+'</tr>').join("")+'</table></div></article></div>'}
function feedbackExcerpt(x){let f=x.feedback||{};return f.improve||f.start||f.additional||f.positive||f.continue||f.stop||"No written comment provided."}
function coach(){let others=othersScores(),growth=bestIndex(others,"min"),growthName=growth>=0?C[growth].n:"Collect non-self feedback first";let steps=[["Notice","What stands out? What confirms something you knew? What surprised you?"],["Explore","Where do perspectives converge or diverge? What context might explain the pattern?"],["Choose","Which single behavior, if strengthened, would create the most meaningful difference?"],["Experiment","What small, observable action will you try? Who can notice and give feedback?"],["Sustain","When will you review progress, celebrate evidence, and adjust?"]];app.innerHTML='<div class="wrap"><div class="top"><div><span class="kicker">COACHING CONVERSATION GUIDE</span><h1>From insight to intention</h1><p>Turn the report into one meaningful behavior change.</p></div><button class="btn white no-print" onclick="print()">Print Guide</button></div><div class="summary"><section class="box coachsteps">'+steps.map((s,i)=>'<article><span>0'+(i+1)+'</span><div><h3>'+s[0]+'</h3><p>'+s[1]+'</p>'+(i===2?'<div class="note">Data-based prompt: consider <b>'+growthName+'</b>.</div>':"")+'</div></article>').join("")+'</section><aside class="box comments"><h2>Anonymous voices</h2>'+responses.filter(x=>x.role!=="Self").slice(-6).map(x=>'<blockquote><small>'+x.role.toUpperCase()+'</small>“'+safe(feedbackExcerpt(x))+'”</blockquote>').join("")+'<div class="note"><b>MY 30-DAY COMMITMENT</b><textarea placeholder="I will…"></textarea><input placeholder="Evidence I will look for"><input placeholder="Accountability partner"></div></aside></div></div>'}
function framework(){app.innerHTML='<div class="wrap framework"><div class="section-head"><span class="kicker">LEADERSHIP IMPACT PROFILE</span><h2>Observable behavior. Useful conversation.</h2><p>Twelve shared leadership competencies connect the 360° feedback to development priorities.</p><div class="disclaimer">This is an original developmental multisource-feedback instrument. It is not intended for hiring, promotion, discipline, clinical judgment, or psychological diagnosis.</div></div>'+C.map((c,i)=>'<article><div><b style="color:var(--gold);font-size:26px">'+c.i+'</b><h2>'+c.n+'</h2><p>'+c.d+'</p><div class="note"><small>COACHING QUESTION</small><br>'+c.q+'</div></div><ol>'+Q.slice(i*ITEMS_PER_COMP,i*ITEMS_PER_COMP+ITEMS_PER_COMP).map(q=>'<li>'+q+'</li>').join("")+'</ol></article>').join("")+'</div>'}
function feedbackBlock(f){let entries=[["POSITIVE IMPACT TO CONTINUE",f.positive],["IMPROVE",f.improve],["START",f.start],["STOP",f.stop],["CONTINUE",f.continue],["ADDITIONAL FEEDBACK",f.additional]].filter(([,v])=>v);return entries.length?entries.map(([k,v])=>'<blockquote><small>'+k+'</small>“'+safe(v)+'”</blockquote>').join(""):'<p class="competency-note">No written comments provided.</p>'}
function allFeedback(){let nonself=responses.filter(x=>x.role!=="Self");return '<article class="box compare comments"><span class="kicker">COMPLETE ANONYMOUS FEEDBACK</span><h2>Every written comment from your raters</h2><p style="color:var(--muted)">Comments are grouped by relationship and presented without names or identifying information.</p>'+["Supervisor","Peer","Direct Report"].map(r=>'<section style="margin-top:26px"><h3>'+r+(r==="Peer"?"s":"")+' <small style="color:var(--muted)">('+nonself.filter(x=>x.role===r).length+' responses)</small></h3>'+nonself.filter(x=>x.role===r).map((x,i)=>'<div style="border-top:1px solid var(--line);padding:16px 0"><b>Response '+(i+1)+'</b>'+feedbackBlock(x.feedback||{})+'</div>').join("")+'</section>').join("")+'</article>'}
function flexibleHome(){home();let cycle=document.querySelector(".cycle");cycle.insertAdjacentHTML("beforeend",'<div class="actions" style="border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap"><button class="btn gold" onclick="document.getElementById(\'importer\').click()">Import response packets</button><button class="btn white" onclick="exportBackup()">Export campaign backup</button><button class="btn white" style="border-color:#c94b4b;color:#9b2c2c" onclick="clearAllResults()">Clear All Results</button><span style="align-self:center;color:var(--muted);font-size:12px">'+responses.filter(x=>x.role!=="Self").length+' anonymous packets imported</span></div>')}
function flexibleResults(){results();document.querySelector("#app>.wrap").insertAdjacentHTML("beforeend",allFeedback());let top=document.querySelector("#app .top");if(top)top.querySelector("button")?.insertAdjacentHTML("beforebegin",'<button class="btn white no-print" style="margin-right:8px;border-color:#c94b4b;color:#9b2c2c" onclick="clearAllResults()">Clear All Results</button>')}
function makeId(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(responses))}
function downloadJSON(data,name){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function validResponse(x){return x&&typeof x.id==="string"&&R.includes(x.role)&&Array.isArray(x.ratings)&&x.ratings.length===TOTAL_ITEMS&&x.ratings.every(n=>Number.isInteger(n)&&n>=0&&n<=5)&&x.feedback&&["positive","improve","start","stop","continue","additional"].every(k=>typeof x.feedback[k]==="string")}
async function importPackets(files){let added=0,duplicates=0,invalid=0,oldVersion=0,candidates=[];for(let file of files){try{let data=JSON.parse(await file.text());if(data.kind==="LIP360_ANONYMOUS_RESPONSE"&&data.version===2&&data.response&&data.response.role!=="Self")candidates.push(data.response);else if(data.kind==="LIP360_CAMPAIGN_BACKUP"&&data.version===2&&Array.isArray(data.responses))candidates.push(...data.responses);else if(data.kind==="LI360_ANONYMOUS_RESPONSE"||data.kind==="LI360_CAMPAIGN_BACKUP")oldVersion++;else invalid++}catch{invalid++}}for(let x of candidates){if(!validResponse(x)){invalid++;continue}if(responses.some(r=>r.id===x.id)){duplicates++;continue}responses.push(x);added++}saveLocal();document.getElementById("importer").value="";flexibleHome();toast(added+" response"+(added===1?"":"s")+" imported"+(duplicates?" · "+duplicates+" duplicate"+(duplicates===1?"":"s")+" skipped":"")+(oldVersion?" · "+oldVersion+" older 30-item packet"+(oldVersion===1?"":"s")+" rejected":"")+(invalid?" · "+invalid+" invalid skipped":""))}
function exportBackup(){downloadJSON({kind:"LIP360_CAMPAIGN_BACKUP",version:2,instrument:"Leadership Impact Profile 12x48",exported:new Date().toISOString(),responses},"LIP360_Campaign_Backup_"+new Date().toISOString().slice(0,10)+".json")}
function clearAllResults(){if(!responses.length)return toast("No saved results to clear");if(!confirm("Clear ALL Leadership Impact Profile results from this browser?\n\nThis will permanently delete the self-assessment, all imported supervisor/peer/direct report responses, scores, and written feedback for the 48-item version. This cannot be undone unless you previously exported a campaign backup."))return;responses=[];localStorage.removeItem(STORAGE_KEY);flexibleHome();toast("All results cleared")}
function safe(s){return String(s??"").replace(/[&<>\"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}function toast(s){let d=document.createElement("div");d.className="toast";d.textContent="✓ "+s;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
const inviteToken=new URLSearchParams(location.search).get("invite");async function beginInvitation(){document.querySelector("header").style.display="none";app.innerHTML='<div class="wrap"><section class="box"><h2>Checking invitation…</h2></section></div>';if(!inviteToken){app.innerHTML='<div class="wrap"><section class="box"><h2>Private invitation required</h2></section></div>';return}try{const r=await fetch("https://oxgbhrhpgvtolbasxzjj.supabase.co/functions/v1/ml360-respond",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"validate",token:inviteToken})});const d=await r.json();if(!r.ok)throw Error(d.error||"Invitation unavailable");role=d.role;app.innerHTML='<div class="wrap"><section class="box"><span class="kicker">PRIVATE LEADERSHIP FEEDBACK</span><h1>Leadership Impact Profile 360</h1><p>Providing feedback for <strong>'+safe(d.participant_name)+'</strong> as <strong>'+safe(role)+'</strong>.</p><p>48 questions across 12 leadership competencies, plus optional written feedback. Your individual answers are not identified by name in the participant report.</p><button class="btn gold" id="begin">Begin assessment</button></section></div>';document.getElementById("begin").onclick=()=>start(role)}catch(e){app.innerHTML='<div class="wrap"><section class="box"><h2>Invitation unavailable</h2><p>'+safe(e.message)+'</p><p>Ask your assessment administrator for assistance.</p></section></div>'}}beginInvitation();
</script></body></html>
